<html lang="he" dir="rtl">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<title>מעבדת המוח של יונתן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column phone workbook on graph paper; sticky top bar, fixed bottom tab bar */
:root{
  --paper:#F2F5FB; --grid:rgba(43,89,195,.08); --card:#FFFFFF; --ink:#16233F; --muted:#5A6888; --line:#D3DCEE;
  --blue:#2B59C3; --on-blue:#FFFFFF; --blue-soft:#E2E9FA; --marker:#FFD84D; --on-marker:#2E2400;
  --good:#1D8456; --good-soft:#DCF2E6; --bad:#CF3A45; --bad-soft:#FBE2E4; --boss:#6E3BC6; --boss-soft:#EEE6FB;
  --shadow:0 1px 0 rgba(22,35,63,.06),0 6px 18px -10px rgba(22,35,63,.25);
  --f-display:'Karantina','Rubik','Arial Hebrew',system-ui,sans-serif;
  --f-body:'Rubik','Arial Hebrew','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1424; --grid:rgba(126,166,255,.06); --card:#161F36; --ink:#E6ECF9; --muted:#97A5C4; --line:#283657;
  --blue:#82A8FF; --on-blue:#0D1424; --blue-soft:#1C2A4A; --marker:#FFD84D; --on-marker:#2E2400;
  --good:#4CC38A; --good-soft:#12301F; --bad:#FF6B74; --bad-soft:#3A1A20; --boss:#B892FF; --boss-soft:#271C44;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0D1424; --grid:rgba(126,166,255,.06); --card:#161F36; --ink:#E6ECF9; --muted:#97A5C4; --line:#283657;
  --blue:#82A8FF; --on-blue:#0D1424; --blue-soft:#1C2A4A; --marker:#FFD84D; --on-marker:#2E2400;
  --good:#4CC38A; --good-soft:#12301F; --bad:#FF6B74; --bad-soft:#3A1A20; --boss:#B892FF; --boss-soft:#271C44;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:.95}
.mark{background:linear-gradient(transparent 58%,var(--marker) 58%, var(--marker) 92%, transparent 92%);color:inherit;padding:0 .08em}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:2.3rem;font-weight:700;line-height:.9}
.brand p{margin:0;font-size:.82rem;color:var(--muted)}
.logo{width:42px;height:42px;flex:none;color:var(--blue)}
.rank{font-size:.78rem;font-weight:600;background:var(--blue-soft);color:var(--blue);padding:6px 10px;border-radius:999px;white-space:nowrap}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;padding:20px 18px}
.hero.boss{border-color:var(--boss);background:linear-gradient(160deg,var(--boss-soft),var(--card) 70%)}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.hero h2{font-family:var(--f-display);font-size:3rem;margin-top:4px}
.hero p{margin:6px 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 20px;font-weight:600;min-height:48px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:var(--on-blue)}
.btn-boss{background:var(--boss);color:var(--on-blue)}
.btn-ghost{background:var(--blue-soft);color:var(--blue)}
.btn-wide{width:100%}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 10px;text-align:center}
.stat .big{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:.75rem;color:var(--muted);margin-top:4px}
.stat svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.xpbar{height:10px;border-radius:99px;background:var(--blue-soft);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px 8px}
.sec-h h3{font-family:var(--f-display);font-size:1.9rem}

/* map */
.week{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:6px;align-items:center;margin-bottom:6px}
.week .wl{font-size:.72rem;color:var(--muted);font-weight:600}
.node{aspect-ratio:1;max-width:44px;width:100%;justify-self:center;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--muted);font-variant-numeric:tabular-nums;position:relative}
.node.done{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.node.done.s1{background:var(--blue-soft);color:var(--blue)}
.node.open{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);animation:pulse 1.6s ease-in-out infinite}
.node.boss{border-radius:10px;border-color:var(--boss);color:var(--boss)}
.node.boss.done{background:var(--boss);color:var(--on-blue)}
.node.locked{opacity:.55}
.node .st{position:absolute;bottom:-7px;font-size:.55rem;letter-spacing:-1px;color:var(--marker);text-shadow:0 0 2px rgba(0,0,0,.5)}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--blue-soft)}}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.badge{text-align:center;font-size:.72rem;line-height:1.25;padding:10px 6px}
.badge svg{width:46px;height:46px;display:block;margin:0 auto 6px}
.badge.off{opacity:.38;filter:grayscale(1)}
.badge b{display:block;font-size:.78rem}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.85rem;font-weight:500;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip.hot{border-color:var(--marker);background:var(--marker);color:var(--on-marker)}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--paper)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.icon-btn svg{width:18px;height:18px}
.pdots{flex:1;display:flex;gap:4px;min-width:0}
.pdots i{flex:1;height:7px;border-radius:9px;background:var(--line)}
.pdots i.ok{background:var(--good)}.pdots i.no{background:var(--bad)}.pdots i.cur{background:var(--blue)}.pdots i.ans{background:var(--muted)}
.qmeta{display:flex;flex-direction:column;align-items:flex-end;font-size:.78rem;font-variant-numeric:tabular-nums;line-height:1.2;flex:none}
.qmeta .pts{font-weight:700;color:var(--blue)}
.qmeta .tm.warn{color:var(--bad);font-weight:700}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.tag{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.lvl{font-size:.72rem;color:var(--muted);display:flex;gap:3px;align-items:center}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}.lvl i.on{background:var(--marker)}
.combo{font-size:.75rem;font-weight:700;color:var(--on-marker);background:var(--marker);padding:3px 9px;border-radius:999px}
.qprompt{font-size:1.12rem;font-weight:500;margin:0 0 12px;line-height:1.55}
.qvis{margin-bottom:14px}
.qvis:empty{display:none}
.opts{display:flex;flex-direction:column;gap:9px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(30%,120px),1fr));gap:9px}
.opt{display:flex;align-items:center;gap:10px;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 12px;min-height:52px;font-size:1.02rem;transition:border-color .15s,background .15s}
.opts.grid .opt{flex-direction:column;justify-content:center;padding:8px 6px 6px}
.opt .lt{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--blue-soft);color:var(--blue)}
.opt .ob{min-width:0;flex:1;display:flex;justify-content:flex-start;align-items:center}
.opts.grid .opt .ob{justify-content:center;width:100%}
.opt:not([disabled]):active{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .lt{background:var(--good);color:var(--card)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .lt{background:var(--bad);color:var(--card)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:14px;border:1px solid var(--line)}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb h4{margin:0 0 4px;font-size:1.05rem}
.fb p{margin:0;font-size:.95rem}
.fb .why{font-size:.75rem;font-weight:700;letter-spacing:.05em;color:var(--muted);display:block;margin-top:8px}
.hintbox{margin-top:12px;background:var(--marker);color:var(--on-marker);border-radius:12px;padding:12px 14px;font-size:.92rem}
.qfoot{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qfoot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.qfoot .btn{flex:1}

/* visuals */
.analogy{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:14px 8px;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.analogy .w{font-weight:600;font-size:1.08rem;padding:4px 10px;border-radius:8px;background:var(--blue-soft)}
.analogy .w.q{background:var(--marker);color:var(--on-marker);min-width:40px;text-align:center}
.analogy .sep{font-weight:700;color:var(--muted)}
.analogy .like{font-size:.85rem;color:var(--muted);padding:0 6px}
.series{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;direction:rtl}
.series .cell{min-width:44px;padding:8px 6px;text-align:center;font-weight:700;font-size:1.15rem;background:var(--card);border:2px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
.series .cell.q{background:var(--marker);border-color:var(--marker);color:var(--on-marker)}
.series .arr{color:var(--muted);font-size:.8rem}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);max-width:270px;margin:0 auto;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--card)}
.mbox{aspect-ratio:1;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.mbox.q{background:var(--marker);color:var(--on-marker);font-family:var(--f-display);font-size:2.4rem;font-weight:700}
.mcell{width:100%;max-width:80px;height:auto;display:block;color:var(--ink)}
.opts.grid .mcell{max-width:72px}
.polybig{display:flex;justify-content:center}
.polybig .poly{width:130px}
.poly{width:84px;max-width:100%;height:auto;display:block}
.poly .pc{fill:var(--blue);stroke:var(--card);stroke-width:2}
.polybig .pc{fill:var(--ink)}
.netwrap{display:flex;justify-content:center}
.net{width:100%;height:auto}
.net .nc{fill:var(--card);stroke:var(--ink);stroke-width:2}
.net .nc.hl{fill:var(--marker)}
.net .nt{font-size:24px;fill:var(--ink);font-family:system-ui,sans-serif}
.net .nt.hl{fill:var(--on-marker)}
.sym{font-size:1.6rem;line-height:1;font-family:system-ui,sans-serif}
.eqs{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.eq{font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.clues{margin:0;padding:12px 14px 12px 12px;padding-inline-start:30px;background:var(--card);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:4px}

/* results */
.res-hero{text-align:center;padding:26px 16px}
.stars{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.stars svg{width:52px;height:52px}
.stars .on{color:var(--marker)}.stars .offs{color:var(--line)}
.stars svg.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.res-hero .score{font-family:var(--f-display);font-size:4rem;font-weight:700;line-height:1}
.res-hero .xp{display:inline-block;margin-top:8px;font-weight:700;color:var(--on-marker);background:var(--marker);padding:4px 12px;border-radius:999px}
.rev{display:flex;flex-direction:column;gap:10px}
.rev .item{padding:12px 14px}
.rev .item .q{font-weight:500;margin-bottom:6px;font-size:.95rem}
.rev .item .a{font-size:.88rem}
.rev .item .a .mcell,.rev .item .a .poly{width:48px;display:inline-block;vertical-align:middle}
.rev .item .e{font-size:.85rem;color:var(--muted);margin-top:6px}
.newb{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;border:2px solid var(--marker)}
.newb svg{width:40px;height:40px;flex:none}

/* stats */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .row{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px;gap:8px}
.bar .row span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{height:12px;border-radius:99px;background:var(--blue-soft);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar.weak .track i{background:var(--bad)}
.spark{width:100%;height:auto;display:block}
.spark .b{fill:var(--blue)}.spark .b.boss{fill:var(--boss)}.spark .gl{stroke:var(--line);stroke-width:1}
.spark text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.field input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}

/* tips */
.tip h4{margin:0 0 6px;font-size:1.05rem}
.tip p{margin:0;font-size:.95rem}
.tip ol,.tip ul{margin:6px 0 0;padding-inline-start:20px;font-size:.95rem}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:.74rem;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--blue);font-weight:600}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:20px}
.modal .card{max-width:360px;width:100%}
.modal h4{margin:0 0 6px;font-size:1.15rem}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal .row{display:flex;gap:10px}.modal .row .btn{flex:1}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero h2{font-size:2.5rem}.stat .big{font-size:2rem}.week{grid-template-columns:40px repeat(7,minmax(0,1fr));gap:4px}}
</style>
<div id="app" dir="rtl" lang="he"></div>
<canvas id="fx" hidden></canvas>
<script>
/* ================= QUESTION ENGINE ================= */
let SEEN = {};
const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mc(opts) { const idx = shuffle(opts.map((_, i) => i)); return { options: idx.map(i => opts[i]), answer: idx.indexOf(0) }; }
function numCands(ans, cands, n = 4) {
  const out = [ans];
  for (const c of cands) { if (out.length >= n) break; if (Number.isFinite(c) && c >= 0 && !out.some(o => Math.abs(o - c) < 1e-9)) out.push(c); }
  let t = 0;
  while (out.length < n && t++ < 200) { const s = Math.max(2, Math.round(Math.abs(ans) * 0.15)); const c = ans + ri(1, s) * (R() < .5 ? -1 : 1); if (c >= 0 && !out.includes(c)) out.push(c); }
  return out;
}
const fmt = x => Number.isInteger(x) ? String(x) : String(Math.round(x * 100) / 100);
const L = s => `<span class="ltr" dir="ltr">${s}</span>`;
const numQ = (cat, d, prompt, vis, ans, cands, ex, unit = '') => {
  const m = mc(numCands(ans, cands).map(v => L(fmt(v)) + unit));
  return { cat, d, prompt, vis, options: m.options, answer: m.answer, ex };
};
function pickBank(bank, key, d) {
  if (!SEEN[key]) SEEN[key] = [];
  const all = bank.map((it, i) => ({ it, i })).filter(o => o.it.d <= d);
  let pool = all.filter(o => !SEEN[key].includes(o.i));
  if (!pool.length) { SEEN[key] = SEEN[key].filter(i => bank[i].d > d); pool = all; }
  const pref = pool.filter(o => o.it.d === d);
  const o = (pref.length && R() < .7) ? pick(pref) : pick(pool);
  SEEN[key].push(o.i);
  return o.it;
}
const PEOPLE = [['יונתן', 'm'], ['נועה', 'f'], ['אורי', 'm'], ['מאיה', 'f'], ['דניאל', 'm'], ['תמר', 'f'], ['איתי', 'm'], ['שירה', 'f'], ['עידו', 'm'], ['רוני', 'f']];
const g = (p, m, f) => p[1] === 'm' ? m : f;

/* ---------- VERBAL ---------- */
const AN = [

function genVerbal(d) {
  if (R() < .6) {
    const it = pickBank(AN, 'an', d); const m = mc(it.o);
    return { cat: 'verbal', d, prompt: 'השלם את האנלוגיה. איזו מילה מתאימה במקום סימן השאלה?',
      vis: `<div class="analogy"><span class="w">${it.a}</span><span class="sep">:</span><span class="w">${it.b}</span><span class="like">כמו</span><span class="w">${it.c}</span><span class="sep">:</span><span class="w q">?</span></div>`,
      options: m.options, answer: m.answer, ex: it.ex };
  }
  const it = pickBank(OD, 'od', d); const m = mc(it.o.map(w => /^[\d./%½]+$/.test(w) ? L(w) : w));
  return { cat: 'verbal', d, prompt: 'איזה פריט לא שייך לקבוצה?', vis: '', options: m.options, answer: m.answer, ex: it.ex };
}

/* ---------- NUMBER SERIES ---------- */
function genSeries(d) {
  let t = [], rule = '';
  const T = d === 1 ? pick(['arith', 'arith', 'geom', 'alt']) : d === 2 ? pick(['incdiff', 'squares', 'interleave', 'muladd', 'alt2', 'decdiff']) : pick(['fib', 'diffgeom', 'cubes', 'interleave2', 'primes', 'alt3', 'muladd']);
  switch (T) {
    case 'arith': { const k = pick([3, 4, 6, 7, 8, 9, 11, 12, 15, -3, -4, -6, -7]); const a = ri(2, 40) + (k < 0 ? 60 : 0); for (let i = 0; i < 6; i++) t.push(a + k * i); rule = k > 0 ? `כל מספר גדול מהקודם ב-${k}.` : `כל מספר קטן מהקודם ב-${-k}.`; break; }
    case 'geom': { const a = ri(1, 5), r = pick([2, 2, 3]); for (let i = 0; i < 6; i++) t.push(a * r ** i); rule = `כל מספר גדול פי ${r} מהקודם.`; break; }
    case 'alt': { const a = ri(5, 12), b = ri(2, a - 2); let x = ri(1, 20); for (let i = 0; i < 7; i++) { t.push(x); x += i % 2 === 0 ? a : -b; } rule = `לסירוגין: מוסיפים ${a}, ואז מחסירים ${b}.`; break; }

}
function topBar() {

/* ---------- HOME ---------- */
function viewHome() {

  } else if (!nd) {

  } else if (nd <= un) {

      <h2>${b ? 'הבוס מחכה לך' : missionTitle(nd)}</h2>

      <button class="btn ${b ? 'btn-boss' : 'btn-primary'} btn-wide" data-act="start">${b ? 'להילחם בבוס' : 'יאללה, מתחילים'}</button></section>`;
  } else {
    hero = `<section class="card hero"><div class="eyebrow">המשימה של היום הושלמה</div><h2><span class="mark">כל הכבוד!</span></h2><p>משימה ${nd} תיפתח מחר. רוצה עוד? יש אימון חופשי למטה.</p></section>`;
  }

  const toExam = Math.max(0, dayDiff(todayStr(), S.exam));
  const stats = `<section class="stats3">
    <div class="card stat">${IC.flame}<div class="big">${curStreak()}</div><div class="lbl">ימים ברצף</div></div>
    <div class="card stat"><span style="color:var(--blue)">${IC.bolt}</span><div class="big">${S.xp.toLocaleString('he-IL')}</div><div class="lbl">נקודות</div></div>
    <div class="card stat"><span style="color:var(--boss)">${IC.flag}</span><div class="big">${toExam}</div><div class="lbl">ימים למבחן</div></div>
  </section>
  <div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;font-size:.85rem;gap:8px"><b>${r[1]}</b><span class="muted">${nx ? `עוד ${nx[0] - S.xp} נק׳ לדרגת ${nx[1]}` : 'הדרגה הגבוהה ביותר!'}</span></div><div class="xpbar"><i style="width:${pct}%"></i></div></div>`;
  // map
  let map = '';
  for (let w = 0; w < Math.ceil(TOTAL / 7); w++) {
    let row = `<div class="week"><span class="wl">שבוע ${w + 1}</span>`;
    for (let k = w * 7 + 1; k <= Math.min(TOTAL, w * 7 + 7); k++) {

      const st = m ? starsOf(m.c, m.n) : 0;
      const cls = ['node', b ? 'boss' : '', m ? 'done s' + Math.max(1, st) : (k === nd && k <= un && !S.cur ? 'open' : k > un ? 'locked' : '')].join(' ');
      row += `<button class="${cls}" data-node="${k}" aria-label="משימה ${k}">${b && !m ? '★' : k}${m ? `<span class="st">${'★'.repeat(st)}</span>` : ''}</button>`;
    }
    map += row + '</div>';
  }
  const weak = weakCats();
  const practice = `<section><div class="sec-h"><h3>אימון חופשי</h3><span class="muted" style="font-size:.8rem">6 שאלות · חצי נקודות</span></div>
    <div class="chips">${Object.keys(CATS).map(k => `<button class="chip ${weak.includes(k) ? 'hot' : ''}" data-practice="${k}">${CATS[k].n}</button>`).join('')}</div>
    ${weak.length ? '<p class="muted" style="font-size:.8rem;margin:8px 2px 0">מסומן בצהוב: תחומים שכדאי לחזק.</p>' : ''}</section>`;
  const badges = `<section><div class="sec-h"><h3>תגים</h3><span class="muted" style="font-size:.8rem">${S.badges.length}/${BADGES.length}</span></div><div class="badges">${BADGES.map((b, i) => { const on = S.badges.includes(b.id); return `<div class="card badge ${on ? '' : 'off'}">${medal(on, i)}<b>${b.n}</b>${b.d}</div>`; }).join('')}</div></section>`;
  return `<div class="stack">${topBar()}${hero}${stats}<section><div class="sec-h"><h3>המסלול</h3><span class="muted" style="font-size:.8rem">${doneCount(S)}/${TOTAL} משימות</span></div><div class="card" style="padding:14px 10px">${map}</div></section>${practice}${badges}</div>`;
}
function missionTitle(d) { const t = ['אימון בסיסי', 'מחממים מנועים', 'בונים שרירי מוח', 'רמה עולה', 'אתגר מתקדם', 'מצב מומחה', 'הכנה סופית']; return t[Math.min(6, Math.floor((d - 1) / 9))]; }
function weakCats() { return Object.keys(CATS).filter(k => { const s = S.stats[k]; return s && s.t >= 6 && s.c / s.t < .65; }); }

/* ---------- MISSION ---------- */
function startMission(kind, day, cat) {
  const base = baseDiff(day || nextDay() || TOTAL);
  let slots;
  if (kind === 'daily') slots = ['verbal', 'verbal', 'series', 'matrix', 'spatial', 'math', 'math', 'logic', 'code', pick(['series', 'matrix', 'spatial', 'logic', 'code'])];
  else if (kind === 'boss') slots = ['verbal', 'verbal', 'series', 'series', 'matrix', 'matrix', 'spatial', 'spatial', 'math', 'math', 'math', 'logic', 'logic', 'code', 'code'];
  else slots = Array(6).fill(cat);
  const qs = shuffle(slots).map(c => { let q; try { q = GEN[c](kind === 'boss' ? Math.max(qDiff(base), Math.min(3, base)) : qDiff(base)); } catch (e) { q = genSeries(1); } q.cat = c; return q; });
  S.cur = { kind, day: day || 0, cat: cat || null, qs, i: 0, res: [], pts: 0, combo: 0, hint: false, qStart: Date.now(), deadline: kind === 'boss' ? Date.now() + 20 * 60000 : null };
  go('quiz');
}
function renderQuiz() {
  const c = S.cur, q = c.qs[c.i], r = c.res[c.i];
  const answered = !!r && c.kind !== 'boss';
  const dots = c.qs.map((_, i) => { const x = c.res[i]; return `<i class="${i === c.i && !x ? 'cur' : x ? (c.kind === 'boss' ? 'ans' : x.ok ? 'ok' : 'no') : ''}"></i>`; }).join('');
  const letters = ['א', 'ב', 'ג', 'ד', 'ה'];
  const gridOpts = q.options.some(o => o.includes('<svg') || o.includes('class="sym"'));
  const opts = q.options.map((o, i) => {
    let cls = 'opt';
    if (answered) { if (i === q.answer) cls += ' ok'; else if (i === r.sel) cls += ' no'; }
    return `<button class="${cls}" data-opt="${i}" ${answered ? 'disabled' : ''}><span class="lt">${letters[i]}</span><span class="ob">${o}</span></button>`;
  }).join('');
  const lvl = [1, 2, 3].map(n => `<i class="${n <= q.d ? 'on' : ''}"></i>`).join('');
  let fb = '';
  if (answered) {
    fb = `<div class="fb ${r.ok ? 'ok' : 'no'}"><h4>${r.ok ? pick(['נכון!', 'מעולה!', 'בול!', 'יפה מאוד!']) + (r.gain ? ` +${r.gain}` : '') : 'לא הפעם. התשובה הנכונה: ' + letters[q.answer]}</h4><span class="why">למה?</span><p>${q.ex}</p></div>`;
  }
  const hint = c.hint && !answered ? `<div class="hintbox"><b>טריק:</b> ${CATS[q.cat].tip}</div>` : '';
  const comboTag = c.combo >= 2 && c.kind !== 'boss' ? `<span class="combo">רצף ${c.combo}</span>` : '';
  app.innerHTML = `<div class="qbar"><button class="icon-btn" data-act="quit" aria-label="יציאה">${IC.x}</button><div class="pdots">${dots}</div><div class="qmeta"><span class="pts">${c.pts} נק׳</span><span class="tm" id="tm"></span></div></div>
  <div class="card"><div class="qtop"><span class="tag">${CATS[q.cat].n}</span>${comboTag}<span class="lvl">רמה ${lvl}</span></div>
  <p class="qprompt">${q.prompt}</p><div class="qvis">${q.vis}</div><div class="opts ${gridOpts ? 'grid' : ''}">${opts}</div>${hint}${fb}</div>
  <div class="qfoot"><div class="in">${answered ? `<button class="btn btn-primary" data-act="next">${c.i === c.qs.length - 1 ? 'לסיכום' : 'לשאלה הבאה'}</button>` : c.kind === 'boss' ? `<button class="btn btn-ghost" data-act="skip">דלג וחזור אחר כך</button>` : `<button class="btn btn-ghost" data-act="hint" ${c.hint ? 'disabled' : ''}>${c.hint ? 'רמז נפתח (−3)' : 'רמז (−3 נק׳)'}</button>`}</div></div>`;
  bind();
  const tm = document.getElementById('tm');
  const tick = () => {
    if (c.deadline) { const left = Math.max(0, c.deadline - Date.now()); const s = Math.ceil(left / 1000); tm.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; tm.classList.toggle('warn', s < 120); if (left <= 0) { clearInterval(timerH); finish(); } }
    else if (!answered) { const s = Math.floor((Date.now() - c.qStart) / 1000); tm.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
    else tm.textContent = '';
  };
  tick(); timerH = setInterval(tick, 1000);
}
function answer(i) {
  const c = S.cur, q = c.qs[c.i];
  if (c.res[c.i] && c.kind !== 'boss') return;
  const ok = i === q.answer, secs = (Date.now() - c.qStart) / 1000;
  let gain = 0;
  if (ok) {
    c.combo++;
    gain = { 1: 10, 2: 15, 3: 20 }[q.d] || 10;
    if (c.kind === 'daily' && c.day >= 15 && secs < 45) gain += 5;
    if (c.kind !== 'boss' && c.combo % 3 === 0) gain += 10;
    if (c.hint) gain = Math.max(0, gain - 3);
    if (c.kind === 'boss') gain = Math.round(gain * 1.5);
    if (c.kind === 'practice') gain = Math.round(gain / 2);
  } else c.combo = 0;
  const prev = c.res[c.i];
  if (prev) c.pts -= prev.gain; // boss: changed answer
  c.res[c.i] = { sel: i, ok, gain, secs };
  c.pts += gain;
  if (c.kind === 'boss') {
    save();
    const nxt = c.qs.findIndex((_, k) => k > c.i && !c.res[k]); const any = c.qs.findIndex((_, k) => !c.res[k]);
    const to = nxt >= 0 ? nxt : any;
    if (to < 0) return finish();
    setTimeout(() => { c.i = to; c.qStart = Date.now(); save(); renderQuiz(); }, 220);
    document.querySelectorAll('.opt').forEach((b, k) => b.classList.toggle('sel', k === i));
    return;
  }
  save(); renderQuiz();
  if (ok && c.combo >= 3 && c.combo % 3 === 0) burst(40);
}
function nextQ() {
  const c = S.cur; if (c.i >= c.qs.length - 1) return finish();
  c.i++; c.hint = false; c.qStart = Date.now(); save(); renderQuiz(); window.scrollTo(0, 0);
}
function finish() {
  clearInterval(timerH);
  const c = S.cur; const n = c.qs.length; let correct = 0;
  c.qs.forEach((q, i) => { const r = c.res[i]; const s = S.stats[q.cat] || (S.stats[q.cat] = { c: 0, t: 0 }); s.t++; if (r && r.ok) { s.c++; correct++; } });
  const before = S.badges.slice();
  if (c.kind !== 'practice') {
    S.missions[c.day] = { c: correct, n, pts: c.pts, date: todayStr() };
    const t = todayStr();
    if (S.lastDone !== t) { S.streak = (S.lastDone && dayDiff(S.lastDone, t) === 1) ? S.streak + 1 : 1; S.lastDone = t; }
    S.best = Math.max(S.best, S.streak);
  }
  S.xp += c.pts;
  BADGES.forEach(b => { if (!S.badges.includes(b.id) && b.t(S)) S.badges.push(b.id); });
  S.last = { kind: c.kind, day: c.day, cat: c.cat, correct, n, pts: c.pts, newB: S.badges.filter(b => !before.includes(b)),
    review: c.qs.map((q, i) => ({ q: q.prompt, cat: q.cat, ok: !!(c.res[i] && c.res[i].ok), a: q.options[q.answer], ex: q.ex })).filter(x => c.kind === 'boss' || !x.ok) };
  S.cur = null; go('result');
  if (starsOf(correct, n) >= 2) setTimeout(() => burst(starsOf(correct, n) === 3 ? 140 : 70), 250);
}

/* ---------- RESULT ---------- */
function viewResult() {
  const L0 = S.last; if (!L0) return viewHome();
  const st = starsOf(L0.correct, L0.n);
  const title = L0.kind === 'practice' ? 'אימון ' + CATS[L0.cat].n : L0.kind === 'boss' ? (L0.day === TOTAL ? 'מבחן הגמר' : 'מבחן בוס') : 'משימה ' + L0.day;
  const msg = st === 3 ? 'ביצוע של אלוף.' : st === 2 ? 'עבודה טובה מאוד.' : st === 1 ? 'התחלה טובה. קרא את ההסברים למטה, שם הלמידה האמיתית.' : 'יום קשה קורה לכולם. ההסברים למטה יעזרו לפעם הבאה.';
  const stars = [0, 1, 2].map(i => `<span class="${i < st ? 'on' : 'offs'}">${IC.star.replace('<svg', `<svg class="pop" style="animation-delay:${i * .15}s"`)}</span>`).join('');
  const nb = L0.newB.map(id => { const i = BADGES.findIndex(b => b.id === id); const b = BADGES[i]; return `<div class="card newb">${medal(true, i)}<div><b>תג חדש: ${b.n}</b><div class="muted" style="font-size:.85rem">${b.d}</div></div></div>`; }).join('');
  const rev = L0.review.length ? `<section><div class="sec-h"><h3>${L0.kind === 'boss' ? 'כל השאלות וההסברים' : 'שאלות לחזור עליהן'}</h3></div><div class="rev">${L0.review.map(x => `<div class="card item"><div class="q"><span class="tag" style="margin-inline-end:6px">${CATS[x.cat].n}</span>${x.ok ? '<b style="color:var(--good)">✓</b>' : '<b style="color:var(--bad)">✗</b>'} ${x.q.replace(/<[^>]+>/g, '')}</div><div class="a">תשובה נכונה: <b>${x.a}</b></div><div class="e">${x.ex}</div></div>`).join('')}</div></section>` : '';
  return `<div class="stack">${topBar()}<section class="card res-hero"><div class="eyebrow">${title}</div><div class="stars">${stars}</div><div class="score">${L0.correct}/${L0.n}</div><p class="muted" style="margin:4px 0 0">${msg}</p><span class="xp">+${L0.pts} נקודות</span></section>${nb}<button class="btn btn-primary btn-wide" data-go="home">חזרה למסלול</button>${rev}</div>`;

/* ---------- STATS ---------- */
function viewStats() {
  const ks = Object.keys(CATS);
  const bars = ks.map(k => { const s = S.stats[k] || { c: 0, t: 0 }; const p = s.t ? Math.round(s.c / s.t * 100) : 0; const weak = s.t >= 6 && p < 65; return `<div class="bar ${weak ? 'weak' : ''}"><div class="row"><span>${CATS[k].n}${weak ? ' · <b style="color:var(--bad)">לחזק</b>' : ''}</span><span>${s.t ? p + '% · ' + s.c + '/' + s.t : 'עוד לא תורגל'}</span></div><div class="track"><i style="width:${p}%"></i></div></div>`; }).join('');

  }
  const tot = ks.reduce((a, k) => a + ((S.stats[k] || {}).t || 0), 0), cor = ks.reduce((a, k) => a + ((S.stats[k] || {}).c || 0), 0);

  <section><div class="sec-h"><h3>לפי תחום</h3></div><div class="card bars">${bars}</div></section>

  <section><div class="sec-h"><h3>הגדרות</h3></div><div class="card stack" style="gap:12px"><label class="field" for="exam"><span>תאריך המבחן</span><input type="date" id="exam" value="${S.exam}"></label>
  <div class="field"><span class="muted" style="font-size:.85rem">המסלול התחיל ב-${S.start.split('-').reverse().join('.')}. משימה חדשה נפתחת כל יום. אם פספסת יום, אפשר להשלים.</span></div>
  <button class="btn btn-ghost" data-act="reset" style="color:var(--bad)">איפוס כל ההתקדמות</button></div></section></div>`;
}

}

/* ---------- EVENTS ---------- */
function modal(title, text, okLbl, onOk, okCls = 'btn-primary') {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h4>${title}</h4><p>${text}</p><div class="row"><button class="btn btn-ghost" data-m="no">ביטול</button><button class="btn ${okCls}" data-m="ok">${okLbl}</button></div></div>`;
  app.appendChild(m);
  m.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (e.target === m || (b && b.dataset.m === 'no')) m.remove(); else if (b) { m.remove(); onOk(); } });
}
function bind() {
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => answer(+b.dataset.opt));
  app.querySelectorAll('[data-practice]').forEach(b => b.onclick = () => { if (S.cur) return modal('יש משימה פתוחה', 'קודם סיים את המשימה שהתחלת, או צא ממנה כדי להתחיל אימון.', 'להמשיך במשימה', () => go('quiz')); startMission('practice', nextDay() || TOTAL, b.dataset.practice); });
  app.querySelectorAll('[data-node]').forEach(b => b.onclick = () => {
    const k = +b.dataset.node, m = S.missions[k];
    if (m) return modal(`משימה ${k}`, `${m.c} מתוך ${m.n} נכונות · ${m.pts} נקודות · ${m.date.split('-').reverse().join('.')}`, 'סגור', () => { });
    if (k === nextDay() && k <= unlocked() && !S.cur) return startMission(isBoss(k) ? 'boss' : 'daily', k);
    if (k > unlocked()) modal('עוד לא', `משימה ${k} תיפתח בעוד ${k - unlocked()} ימים. סבלנות של אלופים!`, 'הבנתי', () => { });
  });
  const A = a => app.querySelector(`[data-act="${a}"]`);
  if (A('start')) A('start').onclick = () => { const k = nextDay(); startMission(isBoss(k) ? 'boss' : 'daily', k); };
  if (A('resume')) A('resume').onclick = () => { if (S.cur && !S.cur.deadline) S.cur.qStart = Date.now(); go('quiz'); };
  if (A('next')) A('next').onclick = nextQ;
  if (A('hint')) A('hint').onclick = () => { S.cur.hint = true; save(); renderQuiz(); };
  if (A('skip')) A('skip').onclick = () => { const c = S.cur; const nx = c.qs.findIndex((_, k) => k > c.i && !c.res[k]); const any = c.qs.findIndex((_, k) => k !== c.i && !c.res[k]); const to = nx >= 0 ? nx : any; if (to >= 0) { c.i = to; c.qStart = Date.now(); save(); renderQuiz(); window.scrollTo(0, 0); } };
  if (A('quit')) A('quit').onclick = () => modal('לצאת מהמשימה?', S.cur.kind === 'boss' ? 'ההתקדמות נשמרת, אבל השעון של הבוס ממשיך לרוץ.' : 'ההתקדמות נשמרת ואפשר להמשיך אחר כך מאותה שאלה.', 'יציאה', () => { S.view = 'home'; save(); render(); });
  if (A('reset')) A('reset').onclick = () => modal('לאפס הכל?', 'כל הנקודות, המשימות והתגים יימחקו. אי אפשר לבטל.', 'כן, לאפס', () => { S = defState(); SEEN = S.seen; save(); render(); }, 'btn-boss');
  const ex = document.getElementById('exam'); if (ex) ex.onchange = () => { if (ex.value) { S.exam = ex.value; save(); } };
}

/* ---------- CONFETTI ---------- */
function burst(n) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('fx'); cv.hidden = false; const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; const x = cv.getContext('2d'); x.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement); const cols = ['--blue', '--marker', '--good', '--boss', '--bad'].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: n }, () => ({ x: innerWidth / 2, y: innerHeight * .35, vx: (R() - .5) * 12, vy: -R() * 11 - 3, r: R() * 6 + 3, c: pick(cols), a: R() * 6, va: (R() - .5) * .3 }));
  let t = 0; (function f() { x.clearRect(0, 0, innerWidth, innerHeight); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }); if (++t < 90) requestAnimationFrame(f); else { x.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; } })();
}

render();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
