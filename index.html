"'פזיז' הוא מי שממהר בלי לחשוב, וזה ההפך מהלוחם כאן. חפשו מילה למי שחושב ומתכנן לפני שהוא פועל."],"sc|הוא היה ___ כל כך בפתרון החידה, שלא שמע שקוראים לו.":["'לא שמע שקוראים לו' מלמד כמה הוא היה מרוכז בחידה. איזו מילה מתארת ריכוז חזק כזה?",
"מי שמשועמם או ער היה שומע שקוראים לו. חפשו מילה שאומרת שהוא היה עמוק בתוך החידה."],"sc|הוויכוח הסתיים ב___: כל צד ויתר קצת.":["מה קורה בסוף ויכוח שבו 'כל צד ויתר קצת'? האם מישהו ניצח לגמרי?",
"אף צד לא ניצח, ושני הצדדים נפגשו באמצע. איך קוראים להסכם כזה?"],"sc|המלחין שילב בשיר צלילים ___, כאלה שאף אחד לא שמע קודם.":["החלק 'כאלה שאף אחד לא שמע קודם' מסביר את המילה החסרה. איך מתארים צלילים שלא היו קודם?",
"צלילים שלא נשמעו קודם הם ההפך מ'מוכרים' ומ'ישנים'. איזו מילה היא ההפך שלהן?"],"sc|התשובה שלו הייתה ___ מדי: הוא כתב רק מילה אחת.":["'רק מילה אחת' אומר משהו על אורך התשובה. האם היא הייתה ארוכה או קצרה?",
"תשובה של מילה אחת קצרה מאוד, אז 'מפורטת' ו'ארוכה' לא מתאימות. איזו מילה אומרת 'קצרה מאוד'?"],"sc|המדענית לא הסתפקה בתוצאה אחת, ולכן ___ את הניסוי כמה פעמים.":["היא 'לא הסתפקה בתוצאה אחת'. מה עושים עם ניסוי כשרוצים לקבל עוד תוצאות?",
"כדי לקבל כמה תוצאות, צריך לעשות את אותו ניסוי שוב. איזה פועל אומר לעשות משהו מחדש?"],"sc|הטענה שלו הייתה ___: היא לא נשענה על שום עובדה.":["'לא נשענה על שום עובדה': האם זו טענה חזקה או חלשה?",
"מבוססת, מוכחת והגיונית הן מילים לטענה טובה. כאן הטענה בלי בסיס, אז חפשו מילה הפוכה להן."],"sc|הוא לא רק ניצח, ___ שבר את השיא של עצמו.":["שימו לב לביטוי 'לא רק ניצח'. מה בדרך כלל בא אחרי 'לא רק'?",
"'לא רק' פותח זוג שמוסיף דבר על דבר: ניצח, ובנוסף שבר שיא. חפשו את החלק השני של הזוג."],"sc2|למרות שהמסלול היה ___, הם ___ עד הפסגה.":["התחילו מהמילה 'למרות': היא מחברת שני דברים שהולכים זה נגד זה. איך היה המסלול, ומה עשו בכל זאת?",
"'עד הפסגה' אומר שהגיעו למעלה, אז המילה השנייה מתארת התקדמות. איזה מסלול הופך את זה למפתיע?"],"sc2|הוא ___ מאוד לפני ההופעה, אבל ברגע שעלה לבמה הלחץ ___.":["המילה 'אבל' מחברת בין 'לפני ההופעה' לבין 'ברגע שעלה לבמה'. מה השתנה ביניהם?",
"לפני ההופעה הוא היה לחוץ, אז 'נרגע' נפסל. מה קרה ללחץ על הבמה, אם 'אבל' מראה שינוי?"],"sc2|ככל שמתאמנים ___, כך הביצועים ___.":["'ככל ש... כך' מחבר שני דברים שמשתנים יחד. מה קורה לביצועים כשמשנים את כמות האימון?",
"אימון עוזר לביצועים ולא מזיק, אז 'נחלשים' ו'נעלמים' נפסלים. מה נשאר לבדוק במילה הראשונה?"],"sc2|אף שהמגדלור היה רחוק, הוא ___ אותו בבירור דרך ה___.":["שני רמזים: 'אף ש' מראה ניגוד למילה 'רחוק', והמילה 'בבירור'. במה משתמשים כדי לראות דברים רחוקים?",
"'אף ש' אומר שלמרות המרחק הוא הצליח, אז 'לא ראה' נפסל. איזה חוש ואיזה מכשיר מתאימים למגדלור?"],"sc2|הניסוי ___ בפעם הראשונה, ולכן המדענית ___ אותו שוב מההתחלה.":["'ולכן' מראה שהחלק השני הוא תוצאה של הראשון. למה מדענית תעשה ניסוי 'שוב מההתחלה'?",
"מתחילים מחדש רק כשמשהו לא עבד, אז האפשרויות עם 'הצליח' נפסלות. איזו פעולה מתאימה ל'אותו שוב מההתחלה'?"],"sc2|המכונית נסעה ___ כל כך, שהנהג לא הספיק ___ ברמזור.":["'כל כך... ש' מתאר תוצאה. מה נהג צריך לעשות ברמזור, ומה גורם לו לא להספיק?",
"ברמזור נהג צריך להאט ולהיעצר, אז 'לנסוע' נפסל. באיזו נסיעה נהג לא מספיק להיעצר בזמן?"],"sc2|ה___ של הצמח סופגים מים מהאדמה, וה___ קולטים את אור השמש.":["איזה חלק של הצמח נמצא בתוך האדמה, ואיזה חלק פונה אל השמש?",
"המילה הראשונה היא חלק שנמצא מתחת לאדמה, אז 'פרחים' ו'זרעים' נפסלים. מה הסדר הנכון בין שני הזוגות שנשארו?"],"sc2|הספר היה ___ מכדי לסיים אותו בערב אחד, ולכן הוא ___ את הקריאה לכמה ימים.":["'מכדי לסיים אותו בערב אחד' אומר שמשהו בספר היה יותר מדי. מה בספר מונע לסיים אותו מהר?",
"רק ספר עם הרבה עמודים לא נגמר בערב אחד, אז 'קצר' נפסל. מה עשה עם הקריאה כשפרש אותה על 'כמה ימים'?"],"sc2|המורה אמרה שתשובה נכונה בלי ___ שווה פחות, כי חשוב להבין ___ הגעת אליה.":["התחילו מהחלק השני: 'חשוב להבין ___ הגעת אליה'. מה המורה רוצה לדעת על הדרך לתשובה?",
"המורה מתעניינת בדרך לתשובה, לא בזמן, אז האפשרויות עם 'מתי' נפסלות. מה כותבים ליד תשובה כדי להראות את הדרך?"],"sc2|הנהר ___ אחרי הגשמים הכבדים, ולכן היה אסור ___ בו.":["מה קורה לנהר אחרי 'גשמים כבדים'? ומה מסוכן לעשות בנהר כזה?",
"אחרי הרבה גשם המים בנהר עולים, אז 'יבש' ו'קפא' נפסלים. מה באמת מסוכן לעשות בנהר מלא וחזק?"],"sc2|הקבוצה ___ ברוב המשחק, אבל דווקא בדקה האחרונה היא ___ את התוצאה.":["'אבל דווקא בדקה האחרונה' רומז על הפתעה. מה מפתיע שקורה בסוף משחק?",
"הפתעה בסוף מתאימה לקבוצה שהייתה מאחור רוב המשחק, אז 'הובילה' ו'שלטה' נפסלות. מה היא עשתה לתוצאה?"],"sc2|בלי ___ אי אפשר לבנות אמון, כי אנשים צריכים לדעת שאפשר ___ על מה שאומרים להם.":["מה צריך כדי שנאמין למה שמישהו אומר לנו? חשבו על המילה 'אמון'.",
"אמון אומר שאפשר להאמין לאחרים, אז 'לצחוק' ו'לחשוב' נפסלים. מה, משני הזוגות שנשארו, באמת בונה אמון?"],"ns|נועה שכחה את המטרייה בבית. כשיצאה מבית הספר התחיל לרדת גשם חזק.":["שני פרטים חשובים: אין לה מטרייה, ויורד גשם חזק. איזה המשך לא סותר אף אחד מהם?",
"פסלו המשך שבו יש לה מטרייה או שמש, והמשך שחוזר לפני בית הספר. מה קורה למי שהולך בגשם בלי מטרייה?"],"ns|בכיתה הצביעו על טיול שנתי. רוב התלמידים רצו ללכת לים, אבל ביום הטיול הייתה סערה.":["הפרט האחרון הוא 'אבל ביום הטיול הייתה סערה'. מה סערה עושה לתוכנית ללכת לים?",
"בסערה אי אפשר לבלות בים. פסלו המשכים שמתעלמים מהסערה או חוזרים להצבעה, ובדקו מה עוד יכול לקרות לטיול."],"ns|הגשם לא ירד שלושה חודשים. החקלאים הסתכלו כל בוקר על השמיים.":["שלושה חודשים בלי גשם, והחקלאים מסתכלים כל בוקר על השמיים. למה הם מסתכלים?",
"החקלאים מחכים לגשם, אז המשך עם יותר מדי מים או גשם כל יום נפסל. מה ירגישו כשיראו סימן שגשם מגיע?"],"ns|הקבוצה הפסידה בשלושת המשחקים הראשונים. המאמן החליט לשנות את שיטת האימונים.":["המאמן 'החליט לשנות את שיטת האימונים'. מה הגיוני שיקרה אחרי שינוי כזה?",
"פסלו המשכים שסותרים את מה שנאמר: שהמאמן לא שינה, או שהקבוצה ניצחה בשלושת הראשונים. מה עוד לא הגיוני?"],"ns|יונתן התאמן על קטע קשה בפסנתר במשך שבוע. ביום ההופעה הידיים שלו רעדו.":["יונתן התאמן שבוע, אבל ביום ההופעה הידיים רעדו. חפשו המשך שמתחבר לשני הפרטים האלה.",
"פסלו המשכים שסותרים את האימון, את הפסנתר או את סדר הזמנים. איזה המשך מראה מה עשו האימונים מול הרעד?"],"ns|המדענית הניחה שתי עגבניות על אדן החלון: אחת בשמש ואחת בצל. אחרי שבוע היא בדקה אותן.":["זה ניסוי: עגבנייה אחת בשמש ואחת בצל, ו'אחרי שבוע היא בדקה אותן'. מה בא אחרי בדיקה בניסוי?",
"אחרי בדיקה מדווחים מה ראו. פסלו משפטים שסותרים את הניסוי או חוזרים לתחילתו. איזה משפט משווה שמש וצל?"],"ns|הסופר היה מלא באנשים. בקופה הראשית השתרך תור ארוך, והקופאי עבד מהר ככל שיכול.":["שני פרטים: תור ארוך, וקופאי שעובד מהר ככל שיכול. מה יוצא כששניהם קורים יחד?",
"גם קופאי מהיר לא מעלים תור ארוך. פסלו את מה שסותר 'מלא באנשים' או 'עבד מהר'. מה עבר על הלקוחות בתור?"],"ns|אורי שכח את הסיסמה למחשב. הוא ניסה שלוש פעמים, והמחשב ננעל לחמש דקות.":["המחשב ננעל לחמש דקות, ואורי צריך לחכות. מה יכול לקרות בזמן הזה בלי לסתור את מה שכבר קרה?",
"המשכים שבהם המחשב נפתח מיד או שאורי זכר את הסיסמה סותרים את הסיפור. מה אורי יכול לעשות בזמן ההמתנה?"],"ns|הלוחם ניצח בשני הסיבובים הראשונים. בסיבוב השלישי הוא היה עייף מאוד.":["הוא ניצח פעמיים, אבל בסיבוב השלישי 'היה עייף מאוד'. מה לוחם חכם עושה כשהכוח שלו נגמר?",
"פסלו את מה שסותר את העייפות, את מספר הסיבובים או את זה שכבר נלחם. איך נלחמים כשנשאר מעט כוח?"],"ns|דנה השקתה את העציץ שלה כל יום במשך שבוע, אבל העלים הצהיבו.":["דנה השקתה 'כל יום', ובכל זאת העלים הצהיבו. האם ההשקיה עזרה? מה זה אומר על הרעיון שלה?",
"השקיה רבה לא פתרה את הבעיה, אז להשקות עוד ממשיך את אותה טעות. על מה כדאי לה לחשוב מחדש?"],"ns|בגלל עבודות בכביש, האוטובוס של עידו איחר בחצי שעה. השיעור הראשון שלו היה מבחן.":["האוטובוס איחר בחצי שעה, והשיעור הראשון היה מבחן. מה קורה לתלמיד שמגיע מאוחר למבחן?",
"פסלו המשך שסותר את האיחור, את המבחן או את סדר הסיבה והתוצאה. מה איחור עושה לזמן שנשאר לפתור?"],"os|יונתן מצא בגינה גור חתולים רטוב ורועד.":["חפשו את הרגע שבו יונתן פוגש את הגור בפעם הראשונה, כשהגור עוד לא בבית.",
"הסיפור נפתח כשיונתן מוצא בגינה גור רטוב ורועד. מה צריך לעשות עם גור כזה מיד אחר כך?"],"os|הקבוצה הפסידה בחצי הראשון 2:0.":["משחק כדורגל בנוי מחצי ראשון, הפסקה וחצי שני. חפשו את המשפט על החלק הראשון של המשחק.",
"הסיפור נפתח בהפסד 2:0 בחצי הראשון. מה קורה בין החצי הראשון לחצי השני?"],"os|בבוקר השמיים היו בהירים לגמרי.":["המשפטים עוברים על שעות היום. חפשו את המשפט עם השעה המוקדמת ביותר.",
"הסיפור נפתח בבוקר עם שמיים בהירים. מה צריך להופיע בשמיים לפני שיורד גשם?"],"os|הקופאי סרק את כל המוצרים.":["בקופה יש סדר קבוע: קודם המוצרים, אחר כך התשלום. חפשו את המשפט שבו עוד לא יודעים כמה לשלם.",
"הסיפור נפתח כשהקופאי סורק את כל המוצרים. מה הקופה מראה מיד אחרי הסריקה?"],"os|נועה נרשמה לתחרות פסנתר.":["לפני אימונים ותחרות צריך להחליט להשתתף. חפשו את המשפט שבו נועה מצטרפת לתחרות.",
"הסיפור נפתח כשנועה נרשמת לתחרות פסנתר. מה היא עושה בזמן שעובר עד יום התחרות?"],"os|המדענית שמה לב שהצמחים בחלון גדלים מהר יותר.":["מדענית מתחילה ממשהו שהיא רואה. חפשו את המשפט שבו היא שמה לב לתופעה, עוד לפני שהיא מנחשת ובודקת.",
"הסיפור נפתח כשהיא שמה לב שהצמחים בחלון גדלים מהר יותר. מה מדענית עושה לפני שהיא בונה ניסוי?"],"os|הלוחם עלה לזירה והתחמם.":["לפני הסיבוב הראשון הלוחם צריך להגיע לזירה. חפשו את המשפט שקורה לפני שהקרב מתחיל.",
"הסיפור נפתח כשהלוחם עולה לזירה ומתחמם. איזה סיבוב בא ראשון, ומה הוא עושה בו?"],"os|הביטלס התחילו לנגן במועדונים קטנים.":["לפני שלהקה מתפרסמת היא מתחילה במקומות קטנים. חפשו את המשפט על ההתחלה הצנועה של הביטלס.",
"הסיפור נפתח כשהביטלס מנגנים במועדונים קטנים. מה צריך לקרות לשירים שלהם לפני שיש קהל שצורח?"],"os|אורי שם לב שהאופניים שלו חורקים.":["כל תיקון מתחיל בזה ששמים לב לבעיה. חפשו את המשפט שבו אורי מגלה שמשהו לא בסדר.",
"הסיפור נפתח כשאורי שומע שהאופניים שלו חורקים. מה עושה מי שלא יודע מאיפה בא הרעש?"],"rd|לפי הקטע, למה השעות הארוכות במועדונים היו \"בית ספר אמיתי\"?":["חפשו בקטע את המילים 'בית ספר אמיתי', וקראו מה כתוב מיד אחרי הנקודתיים.",
"אחרי הנקודתיים כתוב: 'הם למדו לנגן יחד כמעט בלי לחשוב'. איזו תשובה אומרת את זה במילים אחרות?"],"rd|לפי הקטע, מה כנראה גרם לביטלס להפסיק להופיע בהופעות חיות?":["הקטע לא אומר את הסיבה ישירות. קראו מה קרה בהופעות 'כשהצליחו', ממש לפני השנה 1966.",
"שימו לב מה הקהל עשה בהופעות כשהלהקה הצליחה, ומה זה עשה לנגינה שלהם על הבמה."],"rd|מה הרעיון של המשפט האחרון בקטע?":["קראו את המשפט האחרון: על איזו החלטה הוא מדבר, ומה יצא ממנה?",
"הם הפסיקו משהו, ודווקא אז הגיעו לשירים הכי יצירתיים. איזו תשובה מתארת את הקשר הזה באופן כללי?"],"rd|מה אפשר ללמוד מהקטע על האופי של בריאן מיי?":["חפשו שני פרטים בקטע: כמה זמן נמשכה בניית הגיטרה, ומה קרה עם הדוקטורט.",
"הוא עבד על הגיטרה יותר משנה, וחזר להשלים את הדוקטורט אחרי יותר מ-30 שנה. איזו תכונה משותפת לשני הדברים?"],"rd|המילה \"הסתפק\" בקטע קרובה במשמעותה ל:":["מצאו את המשפט 'הוא גם לא הסתפק במוזיקה'. מה הוא עשה חוץ ממוזיקה?",
"מוזיקה לבד לא הספיקה לו, ולכן למד גם אסטרופיזיקה. מה המשמעות של 'להסתפק במשהו'?"],"rd|איזה משפט נכון לפי הקטע?":["בדקו כל אפשרות מול הקטע: מי בנה את הגיטרה, במה מיי מנגן, ומתי סיים את הדוקטורט.",
"לפי הקטע הוא לא קנה את הגיטרה, מנגן עם מטבע, והפסיק את הדוקטורט כשהלהקה הצליחה. אילו אפשרויות זה פוסל?"],"rd|מה היה היתרון הגדול של הפסנתר על הצ'מבלו?":["חפשו בקטע את ההבדל בין הצ'מבלו לבין הפסנתר: מה כתוב על 'עוצמה'?",
"בצ'מבלו כל צליל נשמע כמעט באותה עוצמה. ובפסנתר, מה קורה בלחיצה חזקה ומה בלחיצה עדינה?"],"rd|למה הקלידים השחורים מסודרים בקבוצות של 2 ו-3?":["חפשו את המשפט על הקבוצות של שניים ושלושה, וקראו מה בא אחרי המילה 'וכך'.",
"כתוב שבזכות הסידור הזה הנגן לא צריך לספור קלידים. מה הוא יודע בזכות זה?"],"rd|כמה קלידים לבנים יש בפסנתר על כל קליד שחור, בקירוב?":["מצאו בקטע כמה קלידים לבנים וכמה שחורים יש. כדי להשוות, מחלקים את מספר הלבנים במספר השחורים.",
"52 חלקי 36: ה-36 נכנס פעם אחת, ונשארים 16. האם 16 קרוב לאפס, לחצי של 36, או לכל ה-36?"],"rd|איזו בעיה נייסמית' נדרש לפתור?":["קראו את המשפט הראשון: מה ביקשו מנייסמית', ולמה?",
"שימו לב לשלושה פרטים במשפט הראשון: העונה, המקום, ומה רצו למנוע מהסטודנטים. איזו תשובה כוללת את כולם?"],"rd|מה אפשר להסיק מהמשפט \"רק שנים אחר כך חשבו לפתוח את התחתית\"?":["חשבו כמה קשה היה 'לפתוח את התחתית', ומה כתוב על הבעיה שהייתה לפני כן.",
"עם תחתית, מישהו טיפס אחרי כל סל להוציא את הכדור. הפתרון פשוט מאוד, ובכל זאת עברו שנים. מה זה מלמד?"],"rd|איזה פרט לא השתנה מאז 1891?":["חפשו בסוף הקטע את המילים 'לא השתנה מאז'. על מה הן נאמרות?",
"סלי האפרסקים והתחתית הוחלפו מאז. המשפט האחרון מזכיר מספר אחד שנשאר בדיוק כמו שהיה. מה המספר הזה מודד?"],"rd|מה הכוונה ב\"שחקן 12\"?":["כמה שחקנים יש בקבוצת כדורגל על המגרש? ומי לפי הקטע 'שווה שחקן 12'?",
"בקבוצה יש 11 שחקנים. הקטע אומר שהרעש של מישהו מהיציע שווה עוד שחקן. של מי הרעש?"],"rd|לפי הקטע, מה ידוע בוודאות?":["הפרידו בין מה שהמחקרים 'מראים' לבין מה שהחוקרים 'לא בטוחים' בו.",
"המחקרים מראים תוצאה, אבל החוקרים לא בטוחים מה הסיבה לה. פסלו תשובות שקובעות סיבה או אומרות 'תמיד'."],"rd|מה מתאר הכי טוב את הגישה של הקטע לשאלה \"למה יש יתרון ביתי\"?":["קראו את המשפט האחרון: כמה הסברים הוא מציג, ומה הוא אומר על החוקרים?",
"הקטע מציג שלוש סיבות אפשריות ואומר שהחוקרים 'לא בטוחים'. איזו מילה מתארת כותב שלא קובע בלי הוכחה?"],"rd|מה היתרון של זירה בעלת שמונה צלעות, לפי הקטע?":["חפשו את ההשוואה לזירה מרובעת, כמו בזירת אגרוף: מה הבעיה עם הפינות שלה?",
"בזירה מרובעת יש פינות חדות שבהן לוחם יכול להילכד. מה כתוב על הזוויות בזירה של שמונה צלעות?"],"rd|קרב רגיל נמשך עד הסוף, בלי ניצחון מוקדם. כמה דקות לחמו בו בסך הכל, בלי ההפסקות?":["חפשו במשפט האחרון כמה סיבובים יש בקרב רגיל, וכמה זמן נמשך כל סיבוב.",
"יש 3 סיבובים, וכל סיבוב נמשך 5 דקות. כמה זה 3 פעמים 5?"],"rd|למה המילה \"לתקוע\" כתובה בקטע בתוך מירכאות?":["מצאו את המשפט שבו מופיעה המילה 'לתקוע'. מה תוקעים בדרך כלל, ומה 'תוקעים' כאן?",
"בדרך כלל תוקעים מסמר בקיר, אבל כאן מדובר ביריב בפינה של הזירה. בדקו גם: האם הקטע מזכיר אדם כלשהו שאפשר לצטט?"],"rd|מה הבעיה שהחוקרים הזהירים זיהו?":["חפשו את המשפט שמתחיל ב'אבל חוקרים זהירים שאלו'. מה השאלה שלהם?",
"הם שאלו: אולי מי שכבר מזהה פרטים מהר פשוט משחק יותר? חשבו: המשחק משנה את המוח, או להפך?"],"rd|למה החוקרים נתנו לשחק רק לחלק מהאנשים, ולא לכולם?":["חפשו בקטע מה עשו החוקרים: 'נתנו רק לחלק מהם לשחק'. מה קורה עם החלק השני?",
"אם כולם היו משחקים, לא היינו יודעים איך היו נראים בלי משחק. מה הקבוצה שלא שיחקה מראה לחוקרים?"],"rd|איזו כותרת מתאימה ביותר לקטע?":["כותרת טובה מתאימה לרוב הקטע, לא לפרט אחד. על מה מדבר רוב הקטע, אחרי המשפט השני?",
"רוב הקטע עוסק בשאלה של החוקרים הזהירים ובניסוי שבנו כדי לבדוק אותה. איזו כותרת מתארת את דרך הבדיקה?"],"rd|מה התפקיד של הקבוצה שנשארה ערה בניסוי?":["חפשו את הניסוי: מה עשה כל חצי מהתלמידים, ואיך השוו ביניהם?",
"חצי ישנו וחצי נשארו ערים, וכל השאר היה אותו דבר. בלי הקבוצה הערה, למה היה אפשר להשוות את מי שישן?"],"rd|מה המסקנה המעשית מהקטע?":["קראו את המשפט האחרון, שמתחיל ב'לכן'. מה הוא ממליץ לעשות לפני מבחן חשוב?",
"כתוב ששעה נוספת של משהו עשויה לעזור יותר משעה נוספת של שינון. מהו הדבר הזה?"],"rd|המילה \"מחזק\" בקטע קרובה במשמעותה ל:":["מצאו את המשפט 'ומחזק את הזיכרונות החשובים'. מה קורה לזיכרון חזק לאורך זמן?",
"'מחליש' ו'מוחק' הם בדיוק ההפך. איזו אפשרות אומרת שהזיכרון נשאר במקומו ולא נעלם?"],"rd|למה הדבורים \"מרוויחות\" מתאים בצורת משושה?":["חפשו בקטע ממה למשושה יש 'הכי מעט' לכל תא, וממה הדבורים בונות את זה.",
"למשושה יש הכי מעט קירות לכל תא, והקירות עשויים משעווה. מה כתוב על מה שדרוש כדי לייצר שעווה?"],"rd|איזו צורה לא יכולה לכסות משטח בלי רווחים, לפי הקטע?":["חפשו את המשפט שמונה אילו צורות משוכללות 'מתאימות' לכיסוי בלי רווחים.",
"הקטע מונה בדיוק שלוש צורות. בדקו איזו מהאפשרויות לא מופיעה ברשימה הזו."],"rd|מה אפשר להסיק מהמשפט האחרון?":["קראו את המשפט האחרון: כמה זמן 'חשדו', ומתי נמצאה ההוכחה?",
"מתמטיקאים חשדו בזה מאות שנים, וההוכחה המלאה הגיעה רק ב-1999. מה המרחק בזמן בין החשד להוכחה מלמד?"],"rd|לפי הקטע, למה אנשים האמינו ברעיון של ארבעת היסודות כל כך הרבה זמן?":["חפשו את המשפט עם המילים 'כל כך משכנע'. איזו דוגמה הקטע נותן ממש לפניו?",
"הקטע מסביר שריפת עץ: יוצאים אש ועשן, ונשאר אפר שנראה כמו אדמה. למה הסבר כזה שכנע אנשים?"],"rd|איזה משפט נכון לפי המדע של היום?":["חפשו בקטע מה מדענים גילו 'במאות השנים האחרונות'. אילו דוגמאות של יסודות אמיתיים מופיעות שם?",
"הקטע אומר שאחד מארבעת היסודות הישנים אינו יסוד בכלל. איזה מהם, וממה הוא בנוי לפי הקטע?"],"rd|מה דעת הכותב על הרעיון הישן?":["קראו את המשפט האחרון, שמתחיל ב'ובכל זאת'. מה הכותב אומר שם על הרעיון הישן?",
"הכותב אומר שהרעיון 'לא היה טיפשי' והיה ניסיון ראשון להסביר עולם מסובך. זה יחס של לעג או של הערכה?"],"lg|כל החתולים אוהבים חלב. מיצי אוהב חלב. מה אפשר להסיק בוודאות?":["המשפט אומר שכל החתולים אוהבים חלב. האם הוא אומר שרק חתולים אוהבים חלב?",
"גם כלב יכול לאהוב חלב. אז מזה שמיצי אוהב חלב, האם אפשר לדעת מה הוא?"],"lg|במגירה 10 גרביים שחורות ו-10 לבנות, והחדר חשוך. כמה גרביים צריך להוציא כדי להיות בטוח שיש זוג באותו צבע?":["חשבו על המקרה הגרוע: מה הכי פחות מזל שיכול לקרות בגרביים הראשונות שמוציאים?",
"במקרה הגרוע שתי הראשונות יוצאות שחורה ולבנה. מה קורה עם הגרב הבאה?"],"lg|לאבא של דנה יש 5 בנות: ננה, נני, נינו ונונו. מה שם הבת החמישית?":["קראו שוב את תחילת השאלה, מילה במילה. של מי האבא?",
"ברשימה כתובים ארבעה שמות. יש בשאלה עוד שם של ילדה, מחוץ לרשימה. איפה הוא?"],"lg|בתחרות ריצה עקפת את הרץ שהיה במקום השני. באיזה מקום אתה עכשיו?":["ציירו את הרצים בשורה. מי שעוקף רץ, את המקום של מי הוא תופס?",
"אחרי העקיפה אתם עומדים איפה שעמד הרץ שעקפתם. האם מי שמוביל עדיין לפניכם?"],"lg|אורי, מאיה ותמר אוהבים כל אחד פרי אחר: תפוח, בננה או ענבים. אורי לא אוהב בננה ולא ענבים. מאיה לא אוהבת ענבים. מה אוהבת תמר?":["בנו טבלה: שמות בשורות, פירות בעמודות. מחקו כל מה שכתוב שמישהו לא אוהב.",
"לאורי נשאר רק תפוח. מה נשאר למאיה, לפי מה שהיא לא אוהבת? ומה נשאר לתמר?"],"lg|במשפחה יש שלוש אחיות, ולכל אחת מהן יש בדיוק אח אחד. כמה ילדים במשפחה?":["האם לכל אחות יש אח אחר, או שזה יכול להיות אותו אח? ציירו את המשפחה.",
"שלוש האחיות הן אחיות זו לזו, ולכולן אותו אח אחד. כמה ילדים ציירתם?"],"lg|יונתן עומד בתור. הוא השביעי מההתחלה והשנים-עשר מהסוף. כמה אנשים בתור?":["ציירו תור. כמה אנשים עומדים לפני יונתן, וכמה אחריו?",
"לפניו 6 אנשים ואחריו 11. אל תשכחו לספור גם את יונתן עצמו."],"lg|רכבת יוצאת כל 15 דקות, החל מ-6:00. יונתן מגיע לתחנה ב-7:38. מתי הרכבת הבאה?":["כתבו את שעות היציאה של הרכבות, כל 15 דקות, מ-7:00 והלאה.",
"הרכבות יוצאות ב-7:00, 7:15, 7:30 וכן הלאה. איזו יציאה היא הראשונה אחרי 7:38?"],"lg|סבתא מבשלת 3 ביצים בסיר אחד ב-12 דקות. כמה זמן ייקח לה לבשל 6 ביצים באותו סיר, יחד?":["האם ביצה מתבשלת לאט יותר כשיש לידה עוד ביצים בסיר?",
"כל הביצים בסיר מתבשלות באותו הזמן, יחד. כמה זמן לקח לבשל את 3 הביצים?"],"lg|כל הזרגים הם פלימים. חלק מהפלימים כחולים. האם בהכרח חלק מהזרגים כחולים?":["ציירו עיגול גדול של פלימים, ובתוכו עיגול קטן של זרגים. איפה יכולים להיות הכחולים?",

 { t:'הביטלס', p:'להקת הביטלס נוסדה בעיר ליברפול שבאנגליה בשנת 1960. ארבעת חבריה, ג\'ון לנון, פול מקרטני, ג\'ורג\' האריסון ורינגו סטאר, התחילו לנגן במועדונים קטנים, לפעמים שמונה שעות בלילה. השעות הארוכות האלה היו בית ספר אמיתי: הם למדו לנגן יחד כמעט בלי לחשוב. כשהצליחו, הקהל צרח כל כך חזק שהם לא שמעו את עצמם על הבמה. ב-1966 הפסיקו להופיע בהופעות חיות והתרכזו בעבודה באולפן, שם ניסו צלילים חדשים, כמו הקלטות שמושמעות הפוך. רבים חושבים שדווקא ההחלטה להפסיק להופיע הובילה לשירים היצירתיים ביותר שלהם.',

 { t:'הגיטרה של בריאן מיי', p:'בריאן מיי, הגיטריסט של להקת קווין, לא קנה את הגיטרה המפורסמת שלו בחנות. כשהיה נער הוא בנה אותה יחד עם אביו, מעץ של אח (קמין) ישן ומחלקים שמצאו בבית. העבודה עליה נמשכה יותר משנה. הגיטרה קיבלה את הכינוי "האדומה המיוחדת", והיא נשמעת שונה מכל גיטרה אחרת. במקום מפרט רגיל, מיי מנגן עם מטבע. הוא גם לא הסתפק במוזיקה: הוא למד אסטרופיזיקה, הפסיק את הדוקטורט כשהלהקה הצליחה, וחזר להשלים אותו יותר מ-30 שנה אחר כך.',

 { t:'פיאנו-פורטה', p:'לפסנתר רגיל יש 88 קלידים: 52 לבנים ו-36 שחורים. הקלידים השחורים מסודרים בקבוצות של שניים ושלושה, וכך הנגן יודע איפה הוא נמצא בלי לספור. הפסנתר הומצא באיטליה בסביבות שנת 1700 בידי בונה כלים בשם ברטולומאו כריסטופורי. לפני כן היה נפוץ הצ\'מבלו, שבו המיתרים נפרטים, ולכן כל צליל נשמע כמעט באותה עוצמה. בפסנתר, פטיש קטן מכה במיתר: לחיצה חזקה נותנת צליל חזק, ולחיצה עדינה נותנת צליל שקט. השם המקורי של הכלי, "פיאנופורטה", פירושו באיטלקית "שקט-חזק".',

      ['כמה קלידים לבנים יש בפסנתר על כל קליד שחור, בקירוב?',['בערך 1.5','בערך 2','בערך 3','בערך 1'],`לוקחים את שני המספרים מהקטע ומחלקים: לבנים חלקי שחורים.<span class="rdq">לפסנתר רגיל יש 88 קלידים: 52 לבנים ו-36 שחורים.</span>${L('52 ÷ 36')}: ה-36 נכנס פעם אחת, ונשארים 16. זה כמעט חצי מ-36 (חצי הוא 18). לכן בערך קליד וחצי לבן על כל שחור.<span class="rdt"><b>מלכודת:</b> "בערך 2". אילו היו 2 לבנים על כל שחור, היו ${L('2 × 36 = 72')} לבנים, ויש רק 52.</span>`,3,'לפסנתר רגיל יש 88 קלידים: 52 לבנים ו-36 שחורים.']]},

 { t:'השחקן ה-12', p:'מועדון הכדורגל ליברפול נוסד בשנת 1892, ומשחק מאז באצטדיון אנפילד. אחד הדברים המפורסמים באנפילד הוא היציע "הקופ", שבו נמצאים אלפי האוהדים הרועשים ביותר. אוהדים רבים מאמינים שהרעש שלהם שווה "שחקן 12" לקבוצה. מחקרים על כדורגל מראים שלקבוצה המארחת יש באמת יתרון קטן: היא מנצחת יותר משחקים בבית מאשר בחוץ. עם זאת, החוקרים לא בטוחים מה הסיבה: הקהל, ההיכרות עם המגרש, או אולי העייפות של הקבוצה האורחת מהנסיעה.',
   q:[['מה הכוונה ב"שחקן 12"?',['הקהל, שעוזר לקבוצה כאילו היה עוד שחקן','שחקן מחליף','השוער','המאמן'],'ביטוי במירכאות מסבירים בעזרת המשפט שבו הוא נמצא.<span class="rdq">אוהדים רבים מאמינים שהרעש שלהם שווה "שחקן 12" לקבוצה.</span>בקבוצת כדורגל יש 11 שחקנים על המגרש. הרעש של האוהדים עוזר כמו עוד שחקן, השנים-עשר.<span class="rdt"><b>מלכודת:</b> "שחקן מחליף". הקטע מדבר על הרעש של האוהדים, לא על שחקן אמיתי.</span>',1,'אוהדים רבים מאמינים שהרעש שלהם שווה "שחקן 12" לקבוצה.'],
      ['לפי הקטע, מה ידוע בוודאות?',['קבוצות מארחות מנצחות קצת יותר','הקהל הוא הסיבה ליתרון','הקבוצה האורחת תמיד עייפה','ליברפול לא מפסידה בבית'],'"בוודאות" = מה שהמחקרים מראים, לא מה שאנשים מאמינים או מנחשים.<span class="rdq">מחקרים על כדורגל מראים שלקבוצה המארחת יש באמת יתרון קטן</span><span class="rdt"><b>מלכודת:</b> "הקהל הוא הסיבה ליתרון". על הסיבה הקטע אומר במפורש: "החוקרים לא בטוחים מה הסיבה".</span>',2,'מחקרים על כדורגל מראים שלקבוצה המארחת יש באמת יתרון קטן'],
      ['מה מתאר הכי טוב את הגישה של הקטע לשאלה "למה יש יתרון ביתי"?',['זהירה: היא מציגה כמה הסברים אפשריים','בטוחה לגמרי שזה הקהל','לועגת לאוהדים','טוענת שאין יתרון כזה'],'את הגישה של כותב מגלים לפי המילים שלו: "בטוח", "אולי", "לא ברור".<span class="rdq">עם זאת, החוקרים לא בטוחים מה הסיבה</span>ואחריו שלוש אפשרויות, אחת מהן עם "אולי". מי שמציג כמה הסברים ולא בוחר אחד הוא זהיר.<span class="rdt"><b>מלכודת:</b> "בטוחה לגמרי שזה הקהל". הקהל הוא רק אחת משלוש האפשרויות.</span>',3,'עם זאת, החוקרים לא בטוחים מה הסיבה']]},
 { t:'למה שמונה צלעות?', p:'בקרבות אומנויות לחימה מעורבות (MMA) נלחמים בתוך זירה בעלת שמונה צלעות שנקראת "אוקטגון". למה דווקא שמונה? בזירה מרובעת, כמו בזירת אגרוף, יש פינות חדות שבהן לוחם יכול להילכד. בזירה בעלת שמונה צלעות הזוויות רחבות יותר, ולכן קשה יותר "לתקוע" יריב בפינה. סיבה נוספת היא בטיחות: הרשת שמסביב מונעת מהלוחמים ליפול החוצה. בקרב רגיל יש 3 סיבובים, וכל סיבוב נמשך 5 דקות.',
   q:[['מה היתרון של זירה בעלת שמונה צלעות, לפי הקטע?',['הזוויות רחבות יותר וקשה להילכד בפינה','היא גדולה יותר מזירת אגרוף','היא זולה יותר לבנייה','רואים בה טוב יותר בטלוויזיה'],'מחפשים את המשפט עם "ולכן": הוא מחבר סיבה ותוצאה.<span class="rdq">בזירה בעלת שמונה צלעות הזוויות רחבות יותר, ולכן קשה יותר "לתקוע" יריב בפינה.</span><span class="rdt"><b>מלכודת:</b> "היא גדולה יותר מזירת אגרוף". הקטע משווה לזירת אגרוף רק את הפינות, ולא אומר כלום על הגודל.</span>',1,'בזירה בעלת שמונה צלעות הזוויות רחבות יותר, ולכן קשה יותר "לתקוע" יריב בפינה.'],
      ['קרב רגיל נמשך עד הסוף, בלי ניצחון מוקדם. כמה דקות לחמו בו בסך הכל, בלי ההפסקות?',['15','8','5','35'],`לוקחים מהקטע את שני המספרים. "כל סיבוב" נמשך 5 דקות, ולכן כופלים.<span class="rdq">בקרב רגיל יש 3 סיבובים, וכל סיבוב נמשך 5 דקות.</span>${L('3 × 5 = 15')} דקות.<span class="rdt"><b>מלכודת:</b> 8. זה ${L('3 + 5')}, אבל יש 3 סיבובים של 5 דקות כל אחד.</span>`,1,'בקרב רגיל יש 3 סיבובים, וכל סיבוב נמשך 5 דקות.'],
      ['למה המילה "לתקוע" כתובה בקטע בתוך מירכאות?',['כי היא לא במשמעות הרגילה שלה: הכוונה ללכוד יריב, לא לתקוע חפץ','כי זה ציטוט של לוחם מפורסם','כי זו מילה באנגלית','כי אסור לתקוע יריב לפי החוקים'],'מירכאות סביב מילה אחת מסמנות לפעמים שהמילה משמשת בצורה לא רגילה. בדרך כלל תוקעים מסמר בקיר. בקטע:<span class="rdq">ולכן קשה יותר "לתקוע" יריב בפינה</span>כאן הכוונה ללכוד את היריב בפינה, כך שלא יוכל לברוח. זה מתאים למשפט הקודם: "פינות חדות שבהן לוחם יכול להילכד".<span class="rdt"><b>מלכודת:</b> "ציטוט של לוחם מפורסם". אף אדם לא מוזכר בקטע, אז אין את מי לצטט.</span>',3,'ולכן קשה יותר "לתקוע" יריב בפינה']]},
 { t:'משחקי מחשב והמוח', p:'מדענים בדקו אם משחקי מחשב משפיעים על המוח. הם מצאו שאנשים שמשחקים הרבה במשחקי פעולה מהירים מזהים פרטים קטנים על המסך מהר יותר מאחרים. אבל חוקרים זהירים שאלו שאלה חשובה: אולי אנשים שכבר מזהים פרטים מהר פשוט נהנים יותר ממשחקים כאלה, ולכן משחקים יותר? כדי לבדוק, הם לקחו קבוצה של אנשים שלא שיחקו בכלל, ונתנו רק לחלק מהם לשחק במשך כמה שבועות. רק כך אפשר לדעת מה גורם למה.',
   q:[['מה הבעיה שהחוקרים הזהירים זיהו?',['לא ברור מה הסיבה ומה התוצאה','המשחקים היו ישנים מדי','המשתתפים שיחקו מעט מדי','לא היו מספיק מחשבים'],'את הבעיה מוצאים אחרי מילים כמו "אבל" ו"אולי".<span class="rdq">אולי אנשים שכבר מזהים פרטים מהר פשוט נהנים יותר ממשחקים כאלה, ולכן משחקים יותר?</span>אולי לא המשחק משפר את הזיהוי, אלא הזיהוי הטוב גורם לשחק יותר. לא ברור מה הסיבה ומה התוצאה.<span class="rdt"><b>מלכודת:</b> "המשתתפים שיחקו מעט מדי". הקטע מדבר על אנשים ש"משחקים הרבה".</span>',2,'אולי אנשים שכבר מזהים פרטים מהר פשוט נהנים יותר ממשחקים כאלה, ולכן משחקים יותר?'],
      ['למה החוקרים נתנו לשחק רק לחלק מהאנשים, ולא לכולם?',['כדי להשוות ולראות אם המשחק עשה את ההבדל','כדי שיהיה שקט בחדר','כי לא היו מספיק משחקים','כדי שהקבוצה ששיחקה תנצח'],'בניסוי טוב משנים דבר אחד רק בקבוצה אחת, ומשווים לקבוצה שלא שינו בה כלום.<span class="rdq">ונתנו רק לחלק מהם לשחק במשך כמה שבועות</span>ומיד אחר כך: "רק כך אפשר לדעת מה גורם למה". בלי קבוצה שלא שיחקה, אין למה להשוות.<span class="rdt"><b>מלכודת:</b> "כי לא היו מספיק משחקים". הקטע לא אומר שהיה מחסור, והחלוקה נעשתה בכוונה, "כדי לבדוק".</span>',2,'ונתנו רק לחלק מהם לשחק במשך כמה שבועות'],
      ['איזו כותרת מתאימה ביותר לקטע?',['איך בודקים אם משהו באמת גורם למשהו אחר','משחקי מחשב מזיקים לעיניים','כל המשחקים משפרים את המוח','למה אנשים אוהבים משחקים'],'כותרת טובה מתאימה לרוב הקטע, לא לפרט אחד. רק המשפט השני מספר מה מצאו. כל השאר עוסק בשאלה של החוקרים הזהירים ובניסוי שבנו, ונגמר כך:<span class="rdq">רק כך אפשר לדעת מה גורם למה.</span><span class="rdt"><b>מלכודת:</b> "כל המשחקים משפרים את המוח". הקטע מדבר רק על משחקי פעולה, ועוסק בעיקר בדרך לבדוק, לא בתוצאה.</span>',3,'רק כך אפשר לדעת מה גורם למה.']]},
 { t:'המוח בלילה', p:'בזמן שאנחנו ישנים, המוח לא נח. מחקרים מראים שבזמן השינה המוח מסדר את מה שלמדנו במהלך היום ומחזק את הזיכרונות החשובים. בניסוי אחד למדו תלמידים רשימת מילים. חצי מהם ישנו לילה שלם לפני המבחן, והחצי השני נשארו ערים. הקבוצה שישנה זכרה הרבה יותר מילים. לכן, לפני מבחן חשוב, שעה נוספת של שינה עשויה לעזור יותר משעה נוספת של שינון.',
   q:[['מה התפקיד של הקבוצה שנשארה ערה בניסוי?',['קבוצת השוואה, שמאפשרת לראות את ההשפעה של השינה','קבוצה שלמדה יותר מילים','קבוצה שלא השתתפה בניסוי','קבוצה שבדקה את המבחן'],'קבוצת השוואה היא הקבוצה שלא קיבלה את הדבר שבודקים (כאן: שינה).<span class="rdq">חצי מהם ישנו לילה שלם לפני המבחן, והחצי השני נשארו ערים.</span>משווים את מי שישן למי שלא ישן, וכך רואים מה השינה עשתה.<span class="rdt"><b>מלכודת:</b> "קבוצה שלמדה יותר מילים". כולם למדו את אותה רשימה, ודווקא הקבוצה שישנה זכרה יותר.</span>',2,'חצי מהם ישנו לילה שלם לפני המבחן, והחצי השני נשארו ערים.'],
      ['מה המסקנה המעשית מהקטע?',['לפני מבחן כדאי לישון מספיק','כדאי לשנן כל הלילה לפני מבחן','שינה לא משפיעה על זיכרון','צריך ללמוד רק בבוקר'],'מסקנה מחפשים במשפט שמתחיל ב"לכן".<span class="rdq">לפני מבחן חשוב, שעה נוספת של שינה עשויה לעזור יותר משעה נוספת של שינון</span><span class="rdt"><b>מלכודת:</b> "כדאי לשנן כל הלילה לפני מבחן". זה ההפך: מי שנשאר ער זכר פחות מילים.</span>',1,'לפני מבחן חשוב, שעה נוספת של שינה עשויה לעזור יותר משעה נוספת של שינון'],
      ['המילה "מחזק" בקטע קרובה במשמעותה ל:',['מייצב','מוחק','מחליש','מסדר מחדש'],'שאלת מילה: שמים כל תשובה במקום המילה, ובודקים שהמשפט עדיין הגיוני.<span class="rdq">ומחזק את הזיכרונות החשובים</span>"מייצב את הזיכרונות" = עושה אותם יציבים, כך שיישארו ולא יישכחו.<span class="rdt"><b>מלכודת:</b> "מסדר מחדש". גם "מסדר" מופיע באותו משפט, אבל זו פעולה אחרת של המוח, לא הפירוש של "מחזק".</span>',2,'ומחזק את הזיכרונות החשובים']]},
 { t:'למה דבורים בונות משושים?', p:'כוורת בנויה מאלפי תאים קטנים בצורת משושה. למה דווקא משושה? אם רוצים לכסות משטח בתאים שווים בלי להשאיר רווחים, יש רק שלוש צורות משוכללות שמתאימות: משולש, ריבוע ומשושה. מבין השלוש, המשושה מחלק את השטח לתאים שווים עם הכי מעט "קירות" לכל תא. לדבורים זה חשוב, כי את הקירות הן בונות משעווה, ולייצר שעווה דורש מהן הרבה אנרגיה. מתמטיקאים חשדו בזה במשך מאות שנים, אבל ההוכחה המלאה נמצאה רק ב-1999.',
   q:[['למה הדבורים "מרוויחות" מתאים בצורת משושה?',['הן חוסכות שעווה ואנרגיה','המשושה יפה יותר','משושה מכיל פחות דבש','כך קל יותר לספור את התאים'],'מחברים שני פרטים מהקטע. למשושה יש "הכי מעט קירות לכל תא", וגם:<span class="rdq">את הקירות הן בונות משעווה, ולייצר שעווה דורש מהן הרבה אנרגיה</span>פחות קירות, פחות שעווה, פחות אנרגיה.<span class="rdt"><b>מלכודת:</b> "המשושה יפה יותר". אולי, אבל הקטע לא מדבר על יופי בכלל.</span>',1,'את הקירות הן בונות משעווה, ולייצר שעווה דורש מהן הרבה אנרגיה'],
      ['איזו צורה לא יכולה לכסות משטח בלי רווחים, לפי הקטע?',['מחומש משוכלל','משולש','ריבוע','משושה'],'כשהקטע נותן רשימה עם המילה "רק", כל מה שלא ברשימה לא מתאים.<span class="rdq">יש רק שלוש צורות משוכללות שמתאימות: משולש, ריבוע ומשושה</span>מחומש לא מופיע ברשימה.<span class="rdt"><b>מלכודת:</b> "משושה". הוא דווקא ברשימה, והדבורים משתמשות בו בדיוק כי הוא מכסה בלי רווחים.</span>',2,'יש רק שלוש צורות משוכללות שמתאימות: משולש, ריבוע ומשושה'],
      ['מה אפשר להסיק מהמשפט האחרון?',['לפעמים לוקח הרבה זמן להוכיח דבר שנראה נכון','הדבורים גילו את ההוכחה','מתמטיקאים לא התעניינו בדבורים','ההוכחה הייתה קלה מאוד'],'הסקה: שואלים מה המשפט מלמד באופן כללי.<span class="rdq">מתמטיקאים חשדו בזה במשך מאות שנים, אבל ההוכחה המלאה נמצאה רק ב-1999.</span>חשדו (חשבו שזה נכון) "מאות שנים", והוכיחו "רק ב-1999".<span class="rdt"><b>מלכודת:</b> "ההוכחה הייתה קלה מאוד". אילו הייתה קלה, לא היו צריכים מאות שנים.</span>',3,'מתמטיקאים חשדו בזה במשך מאות שנים, אבל ההוכחה המלאה נמצאה רק ב-1999.']]},
];
const RD = [];
/* a question may end with the exact sentence of the passage that proves the answer (marked after answering) */
PASS.forEach((P, pi) => P.q.forEach(([q, o, ex, d, ev]) => RD.push({ pi, q, o, ex, d, ev })));
function genReading(d) {
  const it = pickBank(RD, 'rd', d); const P = PASS[it.pi]; const m = mc(it.o);
  return { cat: 'reading', d, prompt: it.q, vis: `<div class="passage"><h5>${P.t}</h5><p>${P.p}</p></div>`, options: m.options, answer: m.answer, ex: it.ex, evidence: it.ev || null };
}
function genVerbal2(d) {
  if (R() < .25) { const it = pickBank(SC, 'sc', d); const m = mc(it.o);
    return { cat: 'verbal', d, prompt: 'איזו מילה משלימה את המשפט בצורה הטובה ביותר?', vis: `<div class="sentence">${it.s.replace('___', '<span class="gap">?</span>')}</div>`, options: m.options, answer: m.answer, ex: it.ex }; }
  return genVerbal(d);
}

/* ---------- NUMBER SERIES ----------
   Every series keeps how each number was made (step), so the solution shows the full calculation:
   the rule, one line per step, and for "difference" series also the row of differences. */

  const lines = [];
  for (let i = from; i < t.length; i++) lines.push(calcLine(step(i), t[i], i === hide));
  return `<span class="calc">${lines.join('')}</span>`;
}

/* ---- 20-learn/rating.js ---- */

/* ---- 20-learn/mistakes.js ---- */

function noteMist(q, ok, c, first, noNew) {

function makeTwin(q) {

}
function mistQ(m) {

  if (q.d >= 3 && !S.firstD[q.cat + q.d]) { S.firstD[q.cat + q.d] = 1; out.push(`פעם ראשונה שפתרת ${nm2} ברמה ${q.d}!`); }

/* ---- 40-game/minigames.js ---- */
let MG_RAF = null;
/* boss half-time games, one per boss in turn */
const MG_TITLE = { pong: B => `פינג פונג מול ${B.n}`, brick: B => `לשבור את המגן של ${B.n}`, goal: B => `פנדלים מול ${B.n}` };
const MG_HELP = { pong: 'הראשון ל-3 נקודות. גוררים את המחבט עם האצבע.', brick: '40 שניות לשבור את כל הלבנים. גוררים את המחבט.', goal: '5 בעיטות. מחליקים את האצבע מהכדור לנקודה בשער שבה רוצים שהכדור ייכנס. בפינות קשה לשוער.' };
const stopMG = () => { cancelAnimationFrame(MG_RAF); MG_RAF = null; };
function renderBossGame(c) {
  clearTimers(); stopMG(); c.lock = false;
  const B = BOSSES[c.day] || BOSSES[7], order = Object.keys(BOSSES).map(Number).sort((a, b) => a - b), bi = Math.max(0, order.indexOf(c.day));
  const kind = ['pong', 'goal', 'brick'][bi % 3], col = EC[B.el] || '#7B5CFF';
  c.mgStart = Date.now();
  app.innerHTML = `<div class="stack"><div class="card bossgame" style="--bc:${col}"><div class="row bghead"><span class="bgface">${bossSVG(B)}</span><div class="grow"><div class="eyebrow">הפסקת קרב · רק בשביל הכיף</div><b>${MG_TITLE[kind](B)}</b><div class="small muted">${MG_HELP[kind]}</div></div></div>
  <div class="bgscore" id="bgs"></div><canvas id="bgc"></canvas><div id="bgend"><button class="btn btn-ghost btn-wide" data-mg="skip" style="min-height:40px">לדלג, חזרה לקרב</button></div></div></div>`;
  const cv = app.querySelector('#bgc'), ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(260, cv.parentElement.clientWidth - 28), H = Math.round(Math.min(460, Math.max(320, window.innerHeight * .52)));
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.scale(dpr, dpr);
  const k = W / 340, pw = W * .22, ph = 10;
  let px = W / 2, bx = W / 2, ball = null, over = false, pause = 0;
  const setX = e => { const r = cv.getBoundingClientRect(); px = Math.max(pw / 2, Math.min(W - pw / 2, (e.clientX - r.left) * (W / r.width))); };
  cv.addEventListener('pointermove', setX); cv.addEventListener('pointerdown', setX);
  const scoreEl = app.querySelector('#bgs'), endEl = app.querySelector('#bgend');
  const back = reward => { stopMG(); if (c.deadline) c.deadline += Date.now() - c.mgStart; c.pts += reward; c.qStart = Date.now(); save(); renderQuiz(); window.scrollTo(0, 0); };
  endEl.querySelector('[data-mg="skip"]').onclick = () => back(0);
  const finishGame = (win, reward, msg) => {
    over = true; stopMG(); if (win) { SFX.win(); burst && burst(70); } else SFX.tap();
    endEl.innerHTML = `<div class="bgres ${win ? 'win' : ''}"><b>${msg}</b>${reward ? `<span>+${reward} נקודות לקרב</span>` : ''}</div><button class="btn btn-primary btn-wide" data-mg="back">חזרה לקרב!</button>`;
    endEl.querySelector('[data-mg="back"]').onclick = () => back(reward);

  const drawBall = (x, y) => { ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 12; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 7 * k, 0, Math.PI * 2); ctx.fill(); ctx.restore(); };

  const speed0 = H / 105;
  const serve = dir => { const a = (R() - .5) * .9; ball = { x: W / 2, y: H / 2, vx: Math.sin(a) * speed0, vy: dir * Math.cos(a) * speed0, s: speed0 }; pause = 40; };
  const bounce = (padX, dir) => { const off = Math.max(-1, Math.min(1, (ball.x - padX) / (pw / 2))); ball.s = Math.min(ball.s * 1.06, H / 45); ball.vx = off * ball.s * .85; ball.vy = dir * Math.sqrt(Math.max(.2, ball.s * ball.s - ball.vx * ball.vx)); buzz(15); };

  if (kind === 'pong') {
    let me = 0, him = 0; const ai = W / Math.max(55, 95 - bi * 4);
    const upd = () => { scoreEl.innerHTML = `<span>אתה <b>${me}</b></span><span><b>${him}</b> ${B.n}</span>`; };
    upd(); serve(-1);
    const loop = () => {
      if (over) return;
      bg(); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);
      const target = ball.vy < 0 && ball.y < H * .8 ? ball.x : W / 2;
      bx += Math.max(-ai, Math.min(ai, target - bx)); bx = Math.max(pw / 2, Math.min(W - pw / 2, bx));
      if (pause > 0) pause--; else { ball.x += ball.vx; ball.y += ball.vy; }
      if (ball.x < 7 * k || ball.x > W - 7 * k) { ball.vx *= -1; ball.x = Math.max(7 * k, Math.min(W - 7 * k, ball.x)); }
      const py = H - 24, by = 14;

      if (ball.vy < 0 && ball.y - 7 * k <= by + ph && ball.y > by && Math.abs(ball.x - bx) <= pw / 2 + 6) { ball.y = by + ph + 7 * k; bounce(bx, 1); tone(440, 0, .06, 'square', .04); }

      if (ball.y > H + 10) { him++; upd(); tone(200, 0, .15, 'sine', .05); if (him >= 3) return finishGame(false, me * 5, me ? `${B.n} ניצח ${him}:${me}. היה צמוד!` : `${B.n} ניצח הפעם. בקרב הבא!`); serve(-1); }
      paddle(bx, by, col); paddle(px, H - 24, '#8FE3FF'); drawBall(ball.x, ball.y);
      MG_RAF = requestAnimationFrame(loop);
    };
    MG_RAF = requestAnimationFrame(loop);
  } else if (kind === 'goal') {
    /* Penalty kicks. The keeper walks along the line; after the kick he dives to where he guessed.
       A good guess is more likely against later bosses. Corners are the safest place to aim. */
    const gw = W * .74, gx = (W - gw) / 2, gh = H * .24, gy = H * .1, line = gy + gh;
    const kw = gw * .19, kh = gh * .78, spot = { x: W / 2, y: H * .84 }, r0 = 13 * k;
    const react = Math.min(.7, .4 + bi * .05), kspd = .0017 + bi * .00015;
    let shots = 0, goals = 0, shot = null, msg = '', msgT = 0, kx = W / 2, aim = null, start = null, t0 = performance.now();
    const upd = () => { scoreEl.innerHTML = `<span>גולים <b>${goals}</b></span><span>בעיטה <b>${Math.min(shots + 1, 5)}</b> מתוך 5</span>`; };
    upd();
    const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };
    cv.style.touchAction = 'none';
    cv.onpointerdown = e => { if (shot || over || msgT) return; start = pt(e); aim = start; };
    cv.onpointermove = e => { if (start) aim = pt(e); };
    cv.onpointerup = e => {
      if (!start || shot || over) return;

      else if (len >= 14 * k && dy < -10 * k) { tx = spot.x + dx * ((spot.y - line) / -dy); th = Math.min(.6, len / (spot.y - line)); }
      else return;
      tx += (R() - .5) * 10 * k; th = Math.max(.04, th + (R() - .5) * .08);
      const guess = R() < react ? tx : gx + kw / 2 + R() * (gw - kw);
      shot = { tx, th, f: 0, n: 30, kt: Math.max(gx + kw / 2, Math.min(gx + gw - kw / 2, guess)) }; tone(300, 0, .08, 'triangle', .06);
    };
    const resolve = () => {
      const { tx, th } = shot, hy = th * gh;
      let res;
      if (th > 1.02) res = ['מעל המשקוף!', 0];
      else if (tx < gx + r0 * .4 || tx > gx + gw - r0 * .4) res = ['החוצה! קרוב לקורה', 0];
      else if (Math.abs(kx - tx) < kw / 2 + r0 * .5 && hy < kh + r0) res = [`${B.n} עצר!`, 0];
      else res = [pick(['גול!', 'גוללל!', 'ישר לרשת!', 'איזה גול!']), 1];
      goals += res[1]; shots++; msg = res[0]; msgT = 60; upd();
      if (res[1]) { SFX.ok(); burst(30, tx, line - hy); buzz(30); } else tone(180, 0, .2, 'sine', .06);
    };
    const drawGoal = () => {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0E3B2A'); g.addColorStop(1, '#1D6B45'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.05)'; ctx.fillRect(0, line + i * (H - line) / 6, W, (H - line) / 6); }
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, line); ctx.lineTo(W, line); ctx.stroke();
      ctx.strokeRect(gx - gw * .12, line, gw * 1.24, (H - line) * .32);
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(spot.x, spot.y + r0 * 1.2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
      for (let x = gx; x <= gx + gw; x += 12 * k) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, line); ctx.stroke(); }
      for (let y = gy; y <= line; y += 12 * k) { ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y); ctx.stroke(); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * k; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(gx, line); ctx.lineTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.lineTo(gx + gw, line); ctx.stroke();
    };
    const drawKeeper = () => {
      const top = line - kh;
      ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(kx - kw * .32, top + kh * .28, kw * .64, kh * .72, 8) : ctx.rect(kx - kw * .32, top + kh * .28, kw * .64, kh * .72); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 6 * k; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(kx - kw * .3, top + kh * .38); ctx.lineTo(kx - kw * .5, top + kh * .12); ctx.moveTo(kx + kw * .3, top + kh * .38); ctx.lineTo(kx + kw * .5, top + kh * .12); ctx.stroke();
      ctx.fillStyle = '#FFC845'; [[-.5, .12], [.5, .12]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(kx + kw * a, top + kh * b, 5 * k, 0, Math.PI * 2); ctx.fill(); });
      ctx.fillStyle = '#F6D5BF'; ctx.beginPath(); ctx.arc(kx, top + kh * .16, kw * .17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1A1B22'; ctx.fillRect(kx - kw * .08, top + kh * .14, 3, 3); ctx.fillRect(kx + kw * .05, top + kh * .14, 3, 3);
    };
    const drawSoccer = (x, y, r) => {
      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y + r * .9, r * .9, r * .3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1A1B22'; ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; ctx.lineTo(x + Math.cos(a) * r * .38, y + Math.sin(a) * r * .38); } ctx.fill();
      for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * .86, y + Math.sin(a) * r * .86, r * .2, 0, Math.PI * 2); ctx.fill(); }

    const loop = now => {
      if (over) return;
      drawGoal();
      if (shot) {
        shot.f++; if (shot.f > 3) kx += Math.max(-gw * .045, Math.min(gw * .045, shot.kt - kx));
        const p = Math.min(1, shot.f / shot.n), tyE = line - Math.min(1.4, shot.th) * gh;

        if (shot.hold > 1) { shot.last = [bxp, byp]; }

      }
      if (msgT) {
        ctx.save(); ctx.font = `700 ${Math.round(26 * k)}px Fredoka, Rubik, sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = /גול|רשת/.test(msg) ? '#FFC845' : '#fff';
        ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8; ctx.fillText(msg, W / 2, H * .55); ctx.restore();

        }

    };

    const cols = 6, rows = 3, gap = 6 * k, bw = (W - gap * (cols + 1)) / cols, bh = 16 * k, top = 46 * k;

    const end = Date.now() + 40000; let broken = 0;
    const upd = () => { scoreEl.innerHTML = `<span>נשברו <b>${broken}</b>/${bricks.length}</span><span><b>${Math.max(0, Math.ceil((end - Date.now()) / 1000))}</b> שנ׳</span>`; };

      if (over) return;
      if (Date.now() > end) return finishGame(broken === bricks.length, broken * 3, `שברת ${broken} מתוך ${bricks.length} לבנים!`);
      bg(); upd();
      if (pause > 0) pause--; else { ball.x += ball.vx; ball.y += ball.vy; }
      if (ball.x < 7 * k || ball.x > W - 7 * k) { ball.vx *= -1; ball.x = Math.max(7 * k, Math.min(W - 7 * k, ball.x)); }

      const py = H - 24;
      if (ball.vy > 0 && ball.y + 7 * k >= py && ball.y < py + ph && Math.abs(ball.x - px) <= pw / 2 + 6) { ball.y = py - 7 * k; bounce(px, -1); tone(620, 0, .05, 'square', .04); }
      for (const b of bricks) if (b.alive && ball.x > b.x - 4 && ball.x < b.x + bw + 4 && ball.y > b.y - 4 && ball.y < b.y + bh + 4) { b.alive = false; broken++; ball.vy *= -1; tone(880 + b.r * 120, 0, .05, 'triangle', .05); break; }
      if (broken === bricks.length) return finishGame(true, broken * 3 + 30, `שברת את כל המגן של ${B.n}!`);
      if (ball.y > H + 10) { serve(-1); ball.x = px; ball.y = H - 40; }

      ctx.globalAlpha = 1; paddle(px, py, '#8FE3FF'); drawBall(ball.x, ball.y);
      MG_RAF = requestAnimationFrame(loop);
    };
    MG_RAF = requestAnimationFrame(loop);
  }
}

let PARENT_OK = false;
/* Parent area. Behind a 4-digit PIN. On dad's own phone it shows the kid's cloud data and sends changes
   through the parent channel; on the kid's phone it edits the local state directly. */
function viewParent() {
  if (isSbx()) PARENT_OK = true;
  if (!S.pin) return `<div class="stack"><div class="sec-h"><h3>אזור הורים</h3></div><div class="card stack"><p style="margin:0">בחר קוד הורים של 4 ספרות. הקוד מגן על אישור הפרסים ועל הוספת יהלומים. אל תשכח אותו: אין דרך לשחזר אותו.</p><input class="pin" id="pin1" type="password" inputmode="numeric" maxlength="4" placeholder="קוד"><input class="pin" id="pin2" type="password" inputmode="numeric" maxlength="4" placeholder="שוב, לאימות"><p class="small" id="pinmsg" style="margin:0;color:var(--bad)"></p><button class="btn btn-primary" data-act="pinset">שמור קוד</button><button class="btn btn-ghost" data-go="stats">חזרה</button></div></div>`;
  if (!PARENT_OK) return `<div class="stack"><div class="sec-h"><h3>אזור הורים</h3></div><div class="card stack"><p style="margin:0">הזן את קוד ההורים.</p><input class="pin" id="pin1" type="password" inputmode="numeric" maxlength="4" placeholder="קוד"><p class="small" id="pinmsg" style="margin:0;color:var(--bad)"></p><button class="btn btn-primary" data-act="pinin">כניסה</button><button class="btn btn-ghost" data-go="stats">חזרה</button></div></div>`;
  const dadPhone = isDadPhone() && !isSbx();
  let report, panel;
  if (dadPhone) {
    const cached = ccGet();
    report = `<div id="dadreport">${cached ? reportHTML(normCloud(cached), true) + parentExplainCard(cached) : `<div class="card small muted">טוען את ההתקדמות של ${ME.name}...</div>`}</div>`;
    panel = `<div id="dadpanel">${dadPanel(normCloud(ccGet() || {}), PNODE || {})}</div>`;
    setTimeout(refreshDadReport, 30); setTimeout(refreshDadPanel, 40);
  } else {
    report = reportHTML(S, false) + parentExplainCard();
    panel = localParentPanel();
  }
  return `<div class="stack"><div class="sec-h"><h3>אזור הורים</h3><button class="chip" data-act="pout">יציאה</button></div>${report}
  ${panel}
  ${cloudSection()}
  ${backupSection()}
  ${isSbx() ? '' : `<section class="card stack" style="gap:8px"><h4 style="font-size:1.15rem">מצב בדיקה</h4><p class="small muted" style="margin:0">משחק בעותק נפרד של האפליקציה: כל המשימות פתוחות, ואפשר לקפוץ לכל יום, לתת מטבעות ולבדוק פרסים. הנתונים של ${ME.name} לא משתנים. קיצור נסתר: 5 לחיצות מהירות על "ימים למבחן" במסך הבית.</p><button class="btn btn-gold" data-act="sbxenter">כניסה למצב בדיקה</button></section>`}
  ${isSbx() ? '' : `<button class="btn btn-ghost btn-wide" data-act="reset" style="color:var(--bad);min-height:44px">איפוס ההתקדמות של ${ME.name}</button>`}

/* ---------- visual rewards ----------

   celebrate(): what a correct answer looks like. Small and quick for a normal hit, bigger for a streak,
   a hard question or the champion question. A few variations so it does not get boring. */
const calmFx = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const cx = ox ?? innerWidth / 2, cy = oy ?? innerHeight * .35;

    FX_P.forEach(p => {

      else x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      x.restore();
    });

  };

}

function celebrate(el, o = {}) {
  if (!el) return;
  const kind = o.champ ? 'champ' : o.second ? 'fix' : o.combo && o.combo % 3 === 0 ? 'combo' : o.hard ? 'hard' : 'hit';
  const big = kind === 'champ' || kind === 'combo' || kind === 'hard';
  el.classList.remove('yay'); void el.offsetWidth; el.classList.add('yay', 'yay-' + pick(['a', 'b', 'c']));

  const ring = document.createElement('div'); ring.className = 'yay-ring' + (big ? ' big' : '');
  Object.assign(ring.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });

  st.innerHTML = `<span class="ys-ic">${pick(STICKERS())}</span><b>${pick(CHEER[kind])}</b>`;

  document.body.appendChild(st); setTimeout(() => st.remove(), 1300);

}

  if (dueLearn().length && !S.guest) return 'learn';
