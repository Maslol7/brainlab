.lg-seat{flex:1 1 0;max-width:64px;min-width:0;display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;border-radius:12px 12px 6px 6px;background:var(--bg2);border:1px solid var(--edge2);font-size:.86rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
/* syllogisms: Euler circles */
.lg-eus{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 2px}
.lg-eu{display:inline-flex;flex-direction:column;align-items:center;max-width:100%}
.lg-eu .lg-cap{margin:0;max-width:170px}
.lg-svg{display:block;max-width:100%;height:auto;overflow:visible}
.lg-svg circle{stroke-width:2}
.lg-svg circle.lg-a{fill:var(--acc);fill-opacity:.16;stroke:var(--acc)}
.lg-svg circle.lg-b{fill:var(--gold);fill-opacity:.12;stroke:var(--gold)}
.lg-svg circle.lg-c{fill:var(--violet,#A98BFF);fill-opacity:.12;stroke:var(--violet,#A98BFF)}
.lg-svg circle.lg-dot{fill:var(--ink);stroke:var(--bg0);stroke-width:1.5}
.lg-svg text{font-size:12px;font-weight:700;stroke:var(--bg0);stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.lg-svg text.lg-a{fill:var(--acc)}.lg-svg text.lg-b{fill:var(--gold)}.lg-svg text.lg-c{fill:var(--violet,#A98BFF)}
.calc i{font-style:normal;font-size:.8rem;color:var(--muted)}
/* groups: one box per team */
.lg-teams{display:flex;justify-content:center;gap:6px;margin:10px 0 8px}
.lg-team{flex:1 1 0;max-width:150px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 8px;border-radius:12px;background:var(--bg2);border:1px solid var(--edge2)}
.lg-team>b{font-size:.76rem;color:var(--muted);font-weight:600}
.lg-mem{display:block;width:100%;text-align:center;padding:2px 4px;border-radius:8px;background:var(--panel2);font-weight:600;font-size:.9rem}
.lg-mem.me{box-shadow:0 0 0 1px var(--acc);color:var(--acc)}
.lg-mem.on{box-shadow:0 0 0 1px var(--gold);color:var(--gold)}

/* ---- math explanations, part 2: the "how to recognise it" line, packs, age bars, parts bars, extra colours ---- */
.mspot{display:block;margin-top:6px;padding:6px 10px;border-radius:10px;font-size:.84rem;background:color-mix(in srgb,var(--violet) 14%,transparent);border-inline-start:3px solid var(--violet)}
.mspot b{color:var(--violet);font-weight:700}
/* unit price: each pack is a row of boxes, one per item, with the price of one item in each box */
.mpacks{display:block;margin:8px 0 6px}
.mpk{display:block;margin:4px 0 6px}
.mpkh{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.mpk.best .mpkh{color:var(--gold)}
.mpk .mbc{flex-wrap:wrap;align-items:center}
.mpk .mbc i{width:32px;font-size:.68rem}
.mpk .mbc em{font-style:normal;font-size:.74rem;font-weight:700;color:var(--gold);margin-inline-start:6px}
/* parts bar inside a calculation line (ages): a wider label for "לפני 4 שנים" */
.calc .mbar{margin:6px 0 4px}
.mbar.mparts .mbl{width:72px}
/* age bars: child, dad, and the gold difference that keeps its length */
.msvg .bc{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.2}
.msvg .bd{fill:color-mix(in srgb,var(--violet) 28%,transparent);stroke:var(--violet);stroke-width:1.2}
.msvg .bgap{fill:rgba(255,200,69,.28);stroke:var(--gold);stroke-width:1.2}
.msvg text.gk{fill:var(--gold);font-weight:700}
.msvg text.tt{fill:var(--ink);font-weight:700}
.msvg .thin{stroke-opacity:.22}
/* a third colour for a third bus line */
.msvg circle.w,.msvg text.w{fill:var(--water)}
.mleg i.w{background:var(--water);border-color:var(--water)}
/* a small "how" line under a calculation step */
.calc i.msub{display:block;font-style:normal;font-size:.8rem;line-height:1.5;color:var(--muted);margin:0 0 4px}
/* guided math lesson: the options with a reason for each */
.gwl{display:block;margin-top:6px}
.gwl>span{display:block;padding:4px 0;border-top:1px solid var(--edge);font-size:.9rem}
.gwl>span.ok{color:var(--good)}

/* ---- math explanations: method line, bar model, tables, number lines, timelines ---- */
.mhow{display:block;font-weight:600;color:var(--ink);margin-bottom:2px}
.mtip{display:block;margin-top:4px;font-size:.84rem;color:var(--muted)}
.mcap{display:block;margin-top:3px;font-size:.78rem;color:var(--muted)}
/* bar model: equal unit boxes, so strips are in proportion */
.mbar{display:block;margin:8px 0 6px}
.mbr{display:flex;align-items:center;gap:8px;margin:3px 0}
.mbl{flex:none;width:50px;font-size:.78rem;color:var(--muted)}
.mbc{display:flex;gap:2px;min-width:0}
.mbc i{flex:none;width:26px;height:24px;display:inline-grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:700;border-radius:5px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);color:var(--ink);font-variant-numeric:tabular-nums;overflow:hidden}
.mbc i.g{background:rgba(255,200,69,.2);border-color:var(--gold);color:var(--gold)}
.mbc i.m{background:rgba(255,255,255,.05);border-color:var(--edge2);color:var(--muted)}
.mbc i.k{background:color-mix(in srgb,var(--violet) 25%,transparent);border-color:var(--violet)}
.mbar.full .mbc{flex:1}
.mbar.full .mbc i{flex:1 1 0;width:auto;min-width:0}
.mleg{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px;font-size:.78rem;color:var(--muted)}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px;background:var(--acc-soft);border:1px solid var(--acc)}
.mleg i.g{background:var(--gold);border-color:var(--gold)}
.mleg i.m{background:rgba(255,255,255,.08);border-color:var(--edge2)}
.mleg i.k,.mleg i.v{background:var(--violet);border-color:var(--violet)}
.mleg i.a{background:var(--acc);border-color:var(--acc)}
/* small table */
.mtab{display:grid;grid-template-columns:repeat(var(--n),auto);width:max-content;max-width:100%;margin:8px 0 6px;border:1px solid var(--edge);border-radius:10px;overflow:hidden;font-variant-numeric:tabular-nums;font-size:.9rem}
.mtab>span{padding:3px 10px;text-align:center;border-top:1px solid var(--edge)}
.mtab>.th{border-top:0;font-size:.76rem;color:var(--muted);background:rgba(255,255,255,.05)}
.mtab>.hi{color:var(--gold);font-weight:700;background:rgba(255,200,69,.1)}
/* number lines, timelines, shapes */
.msvg{direction:ltr;display:block;width:100%;max-width:300px;height:auto;margin:6px auto 2px;overflow:visible;font-variant-numeric:tabular-nums}
.msvg text{fill:currentColor}
.msvg .ln{stroke:currentColor;stroke-opacity:.45;fill:none}
.msvg .la{stroke:var(--acc);fill:none;stroke-width:1.6}
.msvg .lv{stroke:var(--violet);fill:none;stroke-width:1.6}
.msvg .lg{stroke:var(--gold);stroke-width:1.5}
.msvg .dash{stroke-dasharray:4 3}
.msvg .w3{stroke-width:3.5}
.msvg circle.a,.msvg text.a{fill:var(--acc)}
.msvg circle.v,.msvg text.v{fill:var(--violet)}
.msvg circle.g,.msvg text.g{fill:var(--gold)}
.msvg text.g{font-weight:700}
.msvg text.mu{fill:var(--muted)}
.mdots{display:block;margin:6px 0 2px;max-width:100%}
.mdots .rd{fill:var(--bad)}.mdots .bl{fill:var(--water)}.mdots .gr{fill:var(--good)}
/* a number and its unit ("4 שעות", "48 ₪") are separate items in the option's flex box; keep a space between them */
.opt .ob{column-gap:.3em}
.mnw{display:inline-block;white-space:nowrap;unicode-bidi:isolate}

/* reading comprehension: the proving sentence and the trap line inside a solution */
.rdq{display:block;margin:6px 0;padding:5px 10px;border-inline-start:3px solid var(--gold);background:rgba(255,200,69,.10);border-radius:6px;color:var(--ink);line-height:1.6}
.rdt{display:block;margin-top:6px;color:var(--muted)}
.rdt b{color:var(--bad, #FF6B6B)}

/* logic riddles and family questions: pictures inside the solution (src/10-content/logic-banks.js) */
.rd-m{display:block;margin:2px 0 6px;padding-inline-start:9px;border-inline-start:3px solid var(--acc);color:var(--ink);font-weight:600;line-height:1.5}
.rd-fig{display:block;margin:8px 0;text-align:center;line-height:1.3}
.rd-svg{max-width:100%;height:auto;overflow:visible;vertical-align:top}
.rd-svg text{fill:var(--ink);font-size:12px;font-family:var(--f-body)}
.rd-svg text.mu{fill:var(--muted)}
.rd-svg text.gd{fill:var(--gold);font-weight:700}
.rd-svg text.acc{fill:var(--acc);font-weight:700}
.rd-svg text.bad{fill:var(--bad);font-weight:700}
.rd-svg text.big{font-size:17px;font-weight:700}
.rd-svg .ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.rd-svg .ln.acc{stroke:var(--acc);fill:rgba(127,227,214,.08)}
.rd-svg .ln.bad{stroke:var(--bad);fill:rgba(255,92,122,.08)}
.rd-svg .blue{fill:rgba(83,168,255,.35);stroke:var(--water);stroke-width:1.5}
.rd-svg .gdot{fill:var(--gold)}
.rd-svg .pdot{fill:var(--muted);opacity:.7}
.rd-svg .past{fill:var(--bg1);stroke:var(--muted);stroke-width:1.5}
.rd-svg .next{fill:var(--good)}
.rd-svg .arr{stroke:var(--acc);stroke-width:2}
.rd-svg .br{fill:none;stroke:var(--muted);stroke-width:1.2}
.rd-svg .rope{stroke:var(--earth);stroke-width:5;stroke-linecap:round}
.rd-svg .cut{stroke:var(--bad);stroke-width:2.5}
.rd-svg .post{fill:var(--gold)}
.rd-svg .pond{fill:rgba(83,168,255,.18);stroke:var(--water);stroke-width:1.2}
.rd-svg .pond.k{stroke:var(--gold);stroke-width:2}
.rd-svg .lily{fill:var(--good);opacity:.75}
/* family tree */
.rd-svg .nd rect{fill:var(--bg2);stroke:var(--edge2);stroke-width:1.2}
.rd-svg .nd.me rect{stroke:var(--acc);stroke-width:2}
.rd-svg .nd.me text{fill:var(--acc);font-weight:700}
.rd-svg .nd.tg rect{stroke:var(--gold);stroke-width:2;fill:#3a3420}
.rd-svg .nd.tg text{fill:var(--gold);font-weight:700}
.rd-svg .nd.dim text{fill:var(--muted)}
.rd-svg .el{fill:none;stroke:var(--dim);stroke-width:1.5}
.rd-svg .eh{fill:none;stroke:var(--acc);stroke-width:2.2}
/* tables (truth tables, the fruit grid, if... then) */
.rd-tab{display:inline-grid;gap:3px;font-size:.8rem;text-align:center;vertical-align:top}
.rd-tab>span{padding:4px 7px;border-radius:6px;background:var(--panel);white-space:nowrap}
.rd-tab>span.h{background:none;color:var(--muted);font-weight:600;white-space:normal}
.rd-tab>span.y{color:var(--good);font-weight:600}
.rd-tab>span.n{color:var(--bad);font-weight:600}
.rd-tab>span.k{background:rgba(255,200,69,.16);box-shadow:inset 0 0 0 1.5px var(--gold)}
/* socks */
.rd-socks{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap}
.rd-sg{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.rd-sg>span:first-child{display:inline-flex;gap:2px}
.rd-lab{font-size:.72rem;color:var(--muted)}
.rd-sock path{stroke-width:1.2;stroke-linejoin:round}
.rd-sock.b path{fill:#2a3157;stroke:#A3AED6}
.rd-sock.w path{fill:#F3F6FF;stroke:#F3F6FF}
.rd-sock.q path{fill:none;stroke:var(--gold);stroke-dasharray:2 2}
/* bat and ball bars */
.rd-bars{display:inline-grid;grid-template-columns:auto auto;gap:5px 8px;align-items:center;font-size:.82rem}
.rd-bars>span:nth-child(even){display:flex;gap:2px}
.rd-seg{display:inline-block;height:24px;line-height:24px;border-radius:6px;text-align:center;font-weight:700}
.rd-seg.x{width:42px;background:rgba(255,200,69,.2);box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold)}
.rd-seg.c{width:150px;background:rgba(127,227,214,.14);box-shadow:inset 0 0 0 1.5px var(--acc)}
/* houses in a row (drawn left to right, like the street) */
.rd-houses{display:flex;direction:ltr;justify-content:center;align-items:flex-end;gap:4px}
.rd-house{position:relative;width:46px;height:42px;padding-top:16px;box-sizing:border-box;clip-path:polygon(50% 0,100% 34%,100% 100%,0 100%,0 34%);color:#0A0F24;font-size:.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rd-house i{font-style:normal;font-size:.62rem;opacity:.7;line-height:1}
.rd-end{font-size:.72rem;color:var(--muted);padding:0 2px 12px}
/* three labelled boxes */
.rd-boxes{display:flex;justify-content:center;gap:8px}
.rd-box{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:5px 6px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--edge2);font-size:.8rem}
.rd-box i{font-style:normal;font-size:.66rem;color:var(--muted)}
.rd-box s{color:var(--bad);text-decoration-thickness:2px}
.rd-box b{color:var(--gold)}
/* weighing */
.rd-weigh{display:inline-grid;grid-template-columns:repeat(6,auto);gap:5px;align-items:center;font-size:.75rem;color:var(--muted)}
.rd-grp{display:inline-flex;gap:3px;justify-content:center;padding:4px 6px;border-radius:12px;box-shadow:inset 0 0 0 1.2px var(--edge2)}
.rd-grp.out{box-shadow:inset 0 0 0 1.2px var(--dim);opacity:.75}
.rd-ball{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--muted)}
.rd-ball.k{background:var(--gold)}
/* dates in a row */
.rd-strip{display:flex;justify-content:center;gap:3px}
.rd-cell{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;padding:4px 2px;border-radius:7px;background:var(--panel);font-size:.78rem}
.rd-cell i{font-style:normal;font-size:.62rem;color:var(--muted);white-space:nowrap}
.rd-cell b{font-size:.74rem}
.rd-cell.k{box-shadow:inset 0 0 0 1.5px var(--gold)}
.rd-cell.k b{color:var(--gold)}

/* ---------- solutions that teach: number series, number tables, shape series, invented operation and language ---------- */
/* shared lines */
.sx-rule{display:block;margin:2px 0 6px;padding:7px 10px;border-radius:10px;background:var(--acc-soft);border-inline-start:3px solid var(--acc);color:var(--ink);line-height:1.5}
.sx-rule b{color:var(--acc)}
.sx-note{display:block;margin:6px 0;line-height:1.5}
.sx-note b{color:var(--ink)}
.sx-trap{display:block;margin:8px 0 4px;line-height:1.5;color:var(--muted)}
.sx-trap b{color:var(--bad,#FF5C7A)}
.sx-next{display:block;margin:8px 0 2px;padding:6px 10px;border-radius:10px;border:1px dashed var(--edge2);line-height:1.5}
.sx-next b{color:var(--gold)}

/* the ladder: numbers on a grid, steps between them, the change of the steps under them */
.sx-lad{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));column-gap:0;row-gap:3px;align-items:center;width:100%;max-width:calc(var(--n) * 50px);margin:10px auto 6px;direction:rtl}
.sx-c{display:block;margin:0 2px;padding:5px 0;text-align:center;font-weight:700;font-size:.98rem;font-variant-numeric:tabular-nums;border-radius:9px;background:rgba(255,255,255,.07);border:1.5px solid var(--edge2);line-height:1.25;white-space:nowrap}
.sx-c.sx-q{border-color:var(--gold);background:rgba(255,200,69,.18);color:var(--gold);box-shadow:0 0 8px rgba(255,200,69,.35)}
.sx-c.sx-a{border-color:var(--acc);color:var(--acc)}
.sx-c.sx-b{border-color:var(--violet,#A98BFF);color:var(--violet,#A98BFF)}
.sx-c.sx-q.sx-a,.sx-c.sx-q.sx-b{background:rgba(255,200,69,.18);box-shadow:0 0 0 2px var(--gold)}
.sx-l{display:block;text-align:center;font-size:.78rem;font-weight:700;line-height:1.2;white-space:nowrap;color:var(--acc)}
.sx-l i{font-style:normal}
.sx-l.sx-a{color:var(--acc)}.sx-l.sx-b{color:var(--violet,#A98BFF)}
.sx-l.sx-d2{color:var(--muted);font-weight:600}
.sx-l.sx-hot{color:var(--gold)}
.sx-l.sx-mk{color:var(--muted);font-weight:600}
.sx-l.sx-sm{font-size:.62rem;letter-spacing:-.02em}
/* brackets that join every second number (two series woven together) */
.sx-br{display:block;height:1.35em;text-align:center;font-size:.78rem;font-weight:700;line-height:1.3;border:2px solid currentColor;margin:0 3px}
.sx-br i{font-style:normal}
.sx-br.up{border-bottom:0;border-radius:8px 8px 0 0}
.sx-br.dn{border-top:0;border-radius:0 0 8px 8px;line-height:1.5}
.sx-br.sx-a{color:var(--acc)}.sx-br.sx-b{color:var(--violet,#A98BFF)}
/* primes: every number in the range, the primes marked */
.sx-pl{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 2px;direction:rtl}
.sx-p{display:inline-block;min-width:1.9em;padding:1px 2px;text-align:center;font-size:.78rem;border-radius:6px;color:var(--muted);text-decoration:line-through;opacity:.7;font-variant-numeric:tabular-nums}
.sx-p.pr{color:var(--acc);text-decoration:none;opacity:1;font-weight:700;border:1px solid var(--acc)}
.sx-p.sx-q{color:var(--gold);border-color:var(--gold);background:rgba(255,200,69,.18)}

/* number table: each row with its rule written out */
.tx{display:grid;grid-template-columns:repeat(5,auto);justify-content:start;gap:4px 8px;align-items:center;margin:8px 0;direction:rtl}
.tx-r{display:contents}
.tx-n{display:block;min-width:1.9em;padding:3px 4px;text-align:center;font-weight:700;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--edge);font-variant-numeric:tabular-nums}
.tx-f{display:block;text-align:center;white-space:nowrap}
.tx-eq{display:block;color:var(--muted)}
.tx-res{color:var(--ink)}
.tx-last .tx-res{border-color:var(--gold)}
.tx-last .tx-res b{color:var(--gold)}
.tx-tries{display:flex;flex-direction:column;gap:2px;margin:4px 0 6px;align-items:flex-start}

"'כאן' מתאים רק למשפט השני, ועין לא פותחים לרופא שיניים. איזה חלק בפנים הוא גם מילה שאומרת 'כאן'?"],"hom|שכחתי את ה___ של הבית.":["מה צריך כדי לפתוח את דלת הבית? ואיך נקראת הרשימה בסוף הספר שעוזרת למצוא נושא?",
"'מנעול' מתאים לדלת אבל לא לספר. חפשו חפץ שפותח דלת, ששמו גם רשימה שפותחת את הדרך לנושא בספר."],"hom|אחרי הגשם הופיעה ___ בשמיים.":["מה מופיע בשמיים בצבעים אחרי גשם? ובמה מחזיק הכנר כדי לנגן על המיתרים?",
"'מיתר' לא מופיע בשמיים, ושמש לא מנגנת. חפשו משהו צבעוני ומקומר שהוא גם שם המקל של הכנר."],"hom|שמתי כובע על ה___.":["על איזה חלק בגוף שמים כובע? ואיך קוראים לאישה שמנהלת את העירייה?",
"על הגב והכתף לא שמים כובע. איזה חלק בגוף הוא גם שם למי שמנהל ועומד בהתחלה?"],"hom|לציפור נשברה ___.":["מה נשבר לציפור שלא יכולה לעוף? ומה יש למטוס בצד, שמסתיר את הנוף?",
"ליד חלון דווקא רואים הרבה, אז הוא לא מתאים. חפשו חלק שיש גם לציפור וגם למטוס ועוזר לשניהם לעוף."],"hom|מצאתי ___ של עשרה שקלים על המדרכה.":["מה עשוי מתכת ושווה עשרה שקלים? ואיך קוראים לכסף של כל מדינה, כמו דולר או שקל?",
"'שטר' עשוי נייר ומתאים רק למשפט הראשון. חפשו מילה לכסף ממתכת שהיא גם שם לסוג הכסף של מדינה."],"hom|ה___ של העץ עמוק באדמה.":["איזה חלק של העץ נמצא מתחת לאדמה? ואיך קוראים לאותיות כ-ת-ב שמהן בנויה המילה?",
"הגזע והענף נמצאים מעל האדמה. חפשו את החלק של העץ שבתוך האדמה, ובדקדוק יש לו אותו שם."],"hom|הגולש רכב על ___ ענק.":["על מה גולשים בים? ובמשפט השני, איך עוד אפשר לקרוא לערימת אבנים?",
"'ערימה' מתאימה רק לאבנים, ועל ים לא רוכבים. חפשו את מה שהגולש רוכב עליו, שבעברית הוא גם ערימת אבנים."],"hom|רופא השיניים טיפל לי ב___.":["במה מטפל רופא השיניים? חשבו גם על גלגל במכונה שיש לו בליטות קטנות מסביב.",
"לשון מתאימה לרופא אבל לא לגלגל. לגלגל כזה קוראים 'גלגל שיניים'. איך קוראים לכל בליטה בו?"],"sc|יונתן התאמן בפסנתר כל יום, ___ ההופעה שלו הייתה מצוינת.":["מה הקשר בין 'התאמן כל יום' לבין 'ההופעה הייתה מצוינת'? האם זה ניגוד, או שאחד גרם לשני?",
"האימון היומי הוא הסיבה, וההופעה המצוינת היא התוצאה. איזו מילה מובילה מסיבה לתוצאה?"],"sc|הקבוצה הפסידה במחצית, ___ בסוף המשחק היא ניצחה.":["הפסידו במחצית, ובסוף ניצחו. האם החלק השני מסביר את הראשון, או הפוך ממנו?",
"הפסד ואחריו ניצחון הם דברים הפוכים. חפשו מילה שמחברת בין שני דברים הפוכים, לא מילת סיבה."],"sc|הוא לא הגיע לאימון, ___ היה חולה.":["קראו את החלק השני: 'היה חולה'. האם זה קרה בגלל שלא הגיע, או שזה מה שגרם לו לא להגיע?",
"המחלה באה קודם, והיא הסיבה לכך שלא הגיע לאימון. חפשו מילה שמציגה סיבה."],"sc|השחקן ___ את הכדור לחבר במקום לזרוק בעצמו, וזה הוביל לסל.":["המילים 'לחבר' ו'במקום לזרוק בעצמו' רומזות מה עשה עם הכדור. מה עושים בכדורסל כדי שחבר יקבל כדור?",
"הוא העביר את הכדור בכוונה לחבר, וזה הוביל לסל. איבד וחטף לא נעשים בכוונה בשביל חבר. איזה פועל נשאר?"],"sc|___ שהיה עייף מאוד, הוא סיים את כל המשימה.":["האם עייפות בדרך כלל עוזרת לסיים משימה, או מפריעה? ומה קרה כאן בסוף?",
"הוא היה עייף, ובכל זאת סיים: זה ניגוד. חפשו מילה שפותחת משפט של ניגוד, לא של סיבה או מטרה."],"sc|הוא קרא את השאלה פעמיים ___ לא לפספס פרט חשוב.":["לשם מה הוא קרא את השאלה פעמיים? מה החלק 'לא לפספס פרט חשוב' מספר לנו?",
"'לא לפספס פרט חשוב' הוא המטרה של הקריאה הכפולה. איזו מילה מובילה אל מטרה?"],"sc|המבחן היה קשה, ___ רוב התלמידים הצליחו בו.":["מבחן קשה, ורוב התלמידים הצליחו בו. זה מה שהיינו מצפים, או הפתעה?",
"קושי מוביל בדרך כלל לכישלון, אבל כאן הצליחו. חפשו ביטוי של ניגוד, לא של סיבה כמו 'ולכן' או 'כי'."],"sc|הלוחם היה ___: הוא חיכה בסבלנות לרגע הנכון ולא מיהר לתקוף.":["קראו מה בא אחרי הנקודתיים: 'חיכה בסבלנות לרגע הנכון'. איזו תכונה מתארת לוחם כזה?",
"'פזיז' הוא מי שממהר בלי לחשוב, וזה ההפך מהלוחם כאן. חפשו מילה למי שחושב ומתכנן לפני שהוא פועל."],"sc|הוא היה ___ כל כך בפתרון החידה, שלא שמע שקוראים לו.":["'לא שמע שקוראים לו' מלמד כמה הוא היה מרוכז בחידה. איזו מילה מתארת ריכוז חזק כזה?",
"מי שמשועמם או ער היה שומע שקוראים לו. חפשו מילה שאומרת שהוא היה עמוק בתוך החידה."],"sc|הוויכוח הסתיים ב___: כל צד ויתר קצת.":["מה קורה בסוף ויכוח שבו 'כל צד ויתר קצת'? האם מישהו ניצח לגמרי?",
"אף צד לא ניצח, ושני הצדדים נפגשו באמצע. איך קוראים להסכם כזה?"],"sc|המלחין שילב בשיר צלילים ___, כאלה שאף אחד לא שמע קודם.":["החלק 'כאלה שאף אחד לא שמע קודם' מסביר את המילה החסרה. איך מתארים צלילים שלא היו קודם?",
"צלילים שלא נשמעו קודם הם ההפך מ'מוכרים' ומ'ישנים'. איזו מילה היא ההפך שלהן?"],"sc|התשובה שלו הייתה ___ מדי: הוא כתב רק מילה אחת.":["'רק מילה אחת' אומר משהו על אורך התשובה. האם היא הייתה ארוכה או קצרה?",
"תשובה של מילה אחת קצרה מאוד, אז 'מפורטת' ו'ארוכה' לא מתאימות. איזו מילה אומרת 'קצרה מאוד'?"],"sc|המדענית לא הסתפקה בתוצאה אחת, ולכן ___ את הניסוי כמה פעמים.":["היא 'לא הסתפקה בתוצאה אחת'. מה עושים עם ניסוי כשרוצים לקבל עוד תוצאות?",
"כדי לקבל כמה תוצאות, צריך לעשות את אותו ניסוי שוב. איזה פועל אומר לעשות משהו מחדש?"],"sc|הטענה שלו הייתה ___: היא לא נשענה על שום עובדה.":["'לא נשענה על שום עובדה': האם זו טענה חזקה או חלשה?",
"מבוססת, מוכחת והגיונית הן מילים לטענה טובה. כאן הטענה בלי בסיס, אז חפשו מילה הפוכה להן."],"sc|הוא לא רק ניצח, ___ שבר את השיא של עצמו.":["שימו לב לביטוי 'לא רק ניצח'. מה בדרך כלל בא אחרי 'לא רק'?",
"'לא רק' פותח זוג שמוסיף דבר על דבר: ניצח, ובנוסף שבר שיא. חפשו את החלק השני של הזוג."],"sc2|למרות שהמסלול היה ___, הם ___ עד הפסגה.":["התחילו מהמילה 'למרות': היא מחברת שני דברים שהולכים זה נגד זה. איך היה המסלול, ומה עשו בכל זאת?",
"'עד הפסגה' אומר שהגיעו למעלה, אז המילה השנייה מתארת התקדמות. איזה מסלול הופך את זה למפתיע?"],"sc2|הוא ___ מאוד לפני ההופעה, אבל ברגע שעלה לבמה הלחץ ___.":["המילה 'אבל' מחברת בין 'לפני ההופעה' לבין 'ברגע שעלה לבמה'. מה השתנה ביניהם?",
"לפני ההופעה הוא היה לחוץ, אז 'נרגע' נפסל. מה קרה ללחץ על הבמה, אם 'אבל' מראה שינוי?"],"sc2|ככל שמתאמנים ___, כך הביצועים ___.":["'ככל ש... כך' מחבר שני דברים שמשתנים יחד. מה קורה לביצועים כשמשנים את כמות האימון?",
"אימון עוזר לביצועים ולא מזיק, אז 'נחלשים' ו'נעלמים' נפסלים. מה נשאר לבדוק במילה הראשונה?"],"sc2|אף שהמגדלור היה רחוק, הוא ___ אותו בבירור דרך ה___.":["שני רמזים: 'אף ש' מראה ניגוד למילה 'רחוק', והמילה 'בבירור'. במה משתמשים כדי לראות דברים רחוקים?",
"'אף ש' אומר שלמרות המרחק הוא הצליח, אז 'לא ראה' נפסל. איזה חוש ואיזה מכשיר מתאימים למגדלור?"],"sc2|הניסוי ___ בפעם הראשונה, ולכן המדענית ___ אותו שוב מההתחלה.":["'ולכן' מראה שהחלק השני הוא תוצאה של הראשון. למה מדענית תעשה ניסוי 'שוב מההתחלה'?",
"מתחילים מחדש רק כשמשהו לא עבד, אז האפשרויות עם 'הצליח' נפסלות. איזו פעולה מתאימה ל'אותו שוב מההתחלה'?"],"sc2|המכונית נסעה ___ כל כך, שהנהג לא הספיק ___ ברמזור.":["'כל כך... ש' מתאר תוצאה. מה נהג צריך לעשות ברמזור, ומה גורם לו לא להספיק?",
"ברמזור נהג צריך להאט ולהיעצר, אז 'לנסוע' נפסל. באיזו נסיעה נהג לא מספיק להיעצר בזמן?"],"sc2|ה___ של הצמח סופגים מים מהאדמה, וה___ קולטים את אור השמש.":["איזה חלק של הצמח נמצא בתוך האדמה, ואיזה חלק פונה אל השמש?",
"המילה הראשונה היא חלק שנמצא מתחת לאדמה, אז 'פרחים' ו'זרעים' נפסלים. מה הסדר הנכון בין שני הזוגות שנשארו?"],"sc2|הספר היה ___ מכדי לסיים אותו בערב אחד, ולכן הוא ___ את הקריאה לכמה ימים.":["'מכדי לסיים אותו בערב אחד' אומר שמשהו בספר היה יותר מדי. מה בספר מונע לסיים אותו מהר?",
"רק ספר עם הרבה עמודים לא נגמר בערב אחד, אז 'קצר' נפסל. מה עשה עם הקריאה כשפרש אותה על 'כמה ימים'?"],"sc2|המורה אמרה שתשובה נכונה בלי ___ שווה פחות, כי חשוב להבין ___ הגעת אליה.":["התחילו מהחלק השני: 'חשוב להבין ___ הגעת אליה'. מה המורה רוצה לדעת על הדרך לתשובה?",
"המורה מתעניינת בדרך לתשובה, לא בזמן, אז האפשרויות עם 'מתי' נפסלות. מה כותבים ליד תשובה כדי להראות את הדרך?"],"sc2|הנהר ___ אחרי הגשמים הכבדים, ולכן היה אסור ___ בו.":["מה קורה לנהר אחרי 'גשמים כבדים'? ומה מסוכן לעשות בנהר כזה?",
"אחרי הרבה גשם המים בנהר עולים, אז 'יבש' ו'קפא' נפסלים. מה באמת מסוכן לעשות בנהר מלא וחזק?"],"sc2|הקבוצה ___ ברוב המשחק, אבל דווקא בדקה האחרונה היא ___ את התוצאה.":["'אבל דווקא בדקה האחרונה' רומז על הפתעה. מה מפתיע שקורה בסוף משחק?",
"הפתעה בסוף מתאימה לקבוצה שהייתה מאחור רוב המשחק, אז 'הובילה' ו'שלטה' נפסלות. מה היא עשתה לתוצאה?"],"sc2|בלי ___ אי אפשר לבנות אמון, כי אנשים צריכים לדעת שאפשר ___ על מה שאומרים להם.":["מה צריך כדי שנאמין למה שמישהו אומר לנו? חשבו על המילה 'אמון'.",
"אמון אומר שאפשר להאמין לאחרים, אז 'לצחוק' ו'לחשוב' נפסלים. מה, משני הזוגות שנשארו, באמת בונה אמון?"],"ns|נועה שכחה את המטרייה בבית. כשיצאה מבית הספר התחיל לרדת גשם חזק.":["שני פרטים חשובים: אין לה מטרייה, ויורד גשם חזק. איזה המשך לא סותר אף אחד מהם?",
"פסלו המשך שבו יש לה מטרייה או שמש, והמשך שחוזר לפני בית הספר. מה קורה למי שהולך בגשם בלי מטרייה?"],"ns|בכיתה הצביעו על טיול שנתי. רוב התלמידים רצו ללכת לים, אבל ביום הטיול הייתה סערה.":["הפרט האחרון הוא 'אבל ביום הטיול הייתה סערה'. מה סערה עושה לתוכנית ללכת לים?",
"בסערה אי אפשר לבלות בים. פסלו המשכים שמתעלמים מהסערה או חוזרים להצבעה, ובדקו מה עוד יכול לקרות לטיול."],"ns|הגשם לא ירד שלושה חודשים. החקלאים הסתכלו כל בוקר על השמיים.":["שלושה חודשים בלי גשם, והחקלאים מסתכלים כל בוקר על השמיים. למה הם מסתכלים?",
"החקלאים מחכים לגשם, אז המשך עם יותר מדי מים או גשם כל יום נפסל. מה ירגישו כשיראו סימן שגשם מגיע?"],"ns|הקבוצה הפסידה בשלושת המשחקים הראשונים. המאמן החליט לשנות את שיטת האימונים.":["המאמן 'החליט לשנות את שיטת האימונים'. מה הגיוני שיקרה אחרי שינוי כזה?",
"פסלו המשכים שסותרים את מה שנאמר: שהמאמן לא שינה, או שהקבוצה ניצחה בשלושת הראשונים. מה עוד לא הגיוני?"],"ns|יונתן התאמן על קטע קשה בפסנתר במשך שבוע. ביום ההופעה הידיים שלו רעדו.":["יונתן התאמן שבוע, אבל ביום ההופעה הידיים רעדו. חפשו המשך שמתחבר לשני הפרטים האלה.",
"פסלו המשכים שסותרים את האימון, את הפסנתר או את סדר הזמנים. איזה המשך מראה מה עשו האימונים מול הרעד?"],"ns|המדענית הניחה שתי עגבניות על אדן החלון: אחת בשמש ואחת בצל. אחרי שבוע היא בדקה אותן.":["זה ניסוי: עגבנייה אחת בשמש ואחת בצל, ו'אחרי שבוע היא בדקה אותן'. מה בא אחרי בדיקה בניסוי?",
"אחרי בדיקה מדווחים מה ראו. פסלו משפטים שסותרים את הניסוי או חוזרים לתחילתו. איזה משפט משווה שמש וצל?"],"ns|הסופר היה מלא באנשים. בקופה הראשית השתרך תור ארוך, והקופאי עבד מהר ככל שיכול.":["שני פרטים: תור ארוך, וקופאי שעובד מהר ככל שיכול. מה יוצא כששניהם קורים יחד?",
"גם קופאי מהיר לא מעלים תור ארוך. פסלו את מה שסותר 'מלא באנשים' או 'עבד מהר'. מה עבר על הלקוחות בתור?"],"ns|אורי שכח את הסיסמה למחשב. הוא ניסה שלוש פעמים, והמחשב ננעל לחמש דקות.":["המחשב ננעל לחמש דקות, ואורי צריך לחכות. מה יכול לקרות בזמן הזה בלי לסתור את מה שכבר קרה?",
"המשכים שבהם המחשב נפתח מיד או שאורי זכר את הסיסמה סותרים את הסיפור. מה אורי יכול לעשות בזמן ההמתנה?"],"ns|הלוחם ניצח בשני הסיבובים הראשונים. בסיבוב השלישי הוא היה עייף מאוד.":["הוא ניצח פעמיים, אבל בסיבוב השלישי 'היה עייף מאוד'. מה לוחם חכם עושה כשהכוח שלו נגמר?",
"פסלו את מה שסותר את העייפות, את מספר הסיבובים או את זה שכבר נלחם. איך נלחמים כשנשאר מעט כוח?"],"ns|דנה השקתה את העציץ שלה כל יום במשך שבוע, אבל העלים הצהיבו.":["דנה השקתה 'כל יום', ובכל זאת העלים הצהיבו. האם ההשקיה עזרה? מה זה אומר על הרעיון שלה?",
"השקיה רבה לא פתרה את הבעיה, אז להשקות עוד ממשיך את אותה טעות. על מה כדאי לה לחשוב מחדש?"],"ns|בגלל עבודות בכביש, האוטובוס של עידו איחר בחצי שעה. השיעור הראשון שלו היה מבחן.":["האוטובוס איחר בחצי שעה, והשיעור הראשון היה מבחן. מה קורה לתלמיד שמגיע מאוחר למבחן?",
"פסלו המשך שסותר את האיחור, את המבחן או את סדר הסיבה והתוצאה. מה איחור עושה לזמן שנשאר לפתור?"],"os|יונתן מצא בגינה גור חתולים רטוב ורועד.":["חפשו את הרגע שבו יונתן פוגש את הגור בפעם הראשונה, כשהגור עוד לא בבית.",
"הסיפור נפתח כשיונתן מוצא בגינה גור רטוב ורועד. מה צריך לעשות עם גור כזה מיד אחר כך?"],"os|הקבוצה הפסידה בחצי הראשון 2:0.":["משחק כדורגל בנוי מחצי ראשון, הפסקה וחצי שני. חפשו את המשפט על החלק הראשון של המשחק.",
"הסיפור נפתח בהפסד 2:0 בחצי הראשון. מה קורה בין החצי הראשון לחצי השני?"],"os|בבוקר השמיים היו בהירים לגמרי.":["המשפטים עוברים על שעות היום. חפשו את המשפט עם השעה המוקדמת ביותר.",
"הסיפור נפתח בבוקר עם שמיים בהירים. מה צריך להופיע בשמיים לפני שיורד גשם?"],"os|הקופאי סרק את כל המוצרים.":["בקופה יש סדר קבוע: קודם המוצרים, אחר כך התשלום. חפשו את המשפט שבו עוד לא יודעים כמה לשלם.",
"הסיפור נפתח כשהקופאי סורק את כל המוצרים. מה הקופה מראה מיד אחרי הסריקה?"],"os|נועה נרשמה לתחרות פסנתר.":["לפני אימונים ותחרות צריך להחליט להשתתף. חפשו את המשפט שבו נועה מצטרפת לתחרות.",
"הסיפור נפתח כשנועה נרשמת לתחרות פסנתר. מה היא עושה בזמן שעובר עד יום התחרות?"],"os|המדענית שמה לב שהצמחים בחלון גדלים מהר יותר.":["מדענית מתחילה ממשהו שהיא רואה. חפשו את המשפט שבו היא שמה לב לתופעה, עוד לפני שהיא מנחשת ובודקת.",
"הסיפור נפתח כשהיא שמה לב שהצמחים בחלון גדלים מהר יותר. מה מדענית עושה לפני שהיא בונה ניסוי?"],"os|הלוחם עלה לזירה והתחמם.":["לפני הסיבוב הראשון הלוחם צריך להגיע לזירה. חפשו את המשפט שקורה לפני שהקרב מתחיל.",
"הסיפור נפתח כשהלוחם עולה לזירה ומתחמם. איזה סיבוב בא ראשון, ומה הוא עושה בו?"],"os|הביטלס התחילו לנגן במועדונים קטנים.":["לפני שלהקה מתפרסמת היא מתחילה במקומות קטנים. חפשו את המשפט על ההתחלה הצנועה של הביטלס.",
"הסיפור נפתח כשהביטלס מנגנים במועדונים קטנים. מה צריך לקרות לשירים שלהם לפני שיש קהל שצורח?"],"os|אורי שם לב שהאופניים שלו חורקים.":["כל תיקון מתחיל בזה ששמים לב לבעיה. חפשו את המשפט שבו אורי מגלה שמשהו לא בסדר.",
"הסיפור נפתח כשאורי שומע שהאופניים שלו חורקים. מה עושה מי שלא יודע מאיפה בא הרעש?"],"rd|לפי הקטע, למה השעות הארוכות במועדונים היו \"בית ספר אמיתי\"?":["חפשו בקטע את המילים 'בית ספר אמיתי', וקראו מה כתוב מיד אחרי הנקודתיים.",
"אחרי הנקודתיים כתוב: 'הם למדו לנגן יחד כמעט בלי לחשוב'. איזו תשובה אומרת את זה במילים אחרות?"],"rd|לפי הקטע, מה כנראה גרם לביטלס להפסיק להופיע בהופעות חיות?":["הקטע לא אומר את הסיבה ישירות. קראו מה קרה בהופעות 'כשהצליחו', ממש לפני השנה 1966.",
"שימו לב מה הקהל עשה בהופעות כשהלהקה הצליחה, ומה זה עשה לנגינה שלהם על הבמה."],"rd|מה הרעיון של המשפט האחרון בקטע?":["קראו את המשפט האחרון: על איזו החלטה הוא מדבר, ומה יצא ממנה?",
"הם הפסיקו משהו, ודווקא אז הגיעו לשירים הכי יצירתיים. איזו תשובה מתארת את הקשר הזה באופן כללי?"],"rd|מה אפשר ללמוד מהקטע על האופי של בריאן מיי?":["חפשו שני פרטים בקטע: כמה זמן נמשכה בניית הגיטרה, ומה קרה עם הדוקטורט.",
"הוא עבד על הגיטרה יותר משנה, וחזר להשלים את הדוקטורט אחרי יותר מ-30 שנה. איזו תכונה משותפת לשני הדברים?"],"rd|המילה \"הסתפק\" בקטע קרובה במשמעותה ל:":["מצאו את המשפט 'הוא גם לא הסתפק במוזיקה'. מה הוא עשה חוץ ממוזיקה?",
"מוזיקה לבד לא הספיקה לו, ולכן למד גם אסטרופיזיקה. מה המשמעות של 'להסתפק במשהו'?"],"rd|איזה משפט נכון לפי הקטע?":["בדקו כל אפשרות מול הקטע: מי בנה את הגיטרה, במה מיי מנגן, ומתי סיים את הדוקטורט.",
"לפי הקטע הוא לא קנה את הגיטרה, מנגן עם מטבע, והפסיק את הדוקטורט כשהלהקה הצליחה. אילו אפשרויות זה פוסל?"],"rd|מה היה היתרון הגדול של הפסנתר על הצ'מבלו?":["חפשו בקטע את ההבדל בין הצ'מבלו לבין הפסנתר: מה כתוב על 'עוצמה'?",
"בצ'מבלו כל צליל נשמע כמעט באותה עוצמה. ובפסנתר, מה קורה בלחיצה חזקה ומה בלחיצה עדינה?"],"rd|למה הקלידים השחורים מסודרים בקבוצות של 2 ו-3?":["חפשו את המשפט על הקבוצות של שניים ושלושה, וקראו מה בא אחרי המילה 'וכך'.",
"כתוב שבזכות הסידור הזה הנגן לא צריך לספור קלידים. מה הוא יודע בזכות זה?"],"rd|כמה קלידים לבנים יש בפסנתר על כל קליד שחור, בקירוב?":["מצאו בקטע כמה קלידים לבנים וכמה שחורים יש. כדי להשוות, מחלקים את מספר הלבנים במספר השחורים.",
"52 חלקי 36: ה-36 נכנס פעם אחת, ונשארים 16. האם 16 קרוב לאפס, לחצי של 36, או לכל ה-36?"],"rd|איזו בעיה נייסמית' נדרש לפתור?":["קראו את המשפט הראשון: מה ביקשו מנייסמית', ולמה?",
"שימו לב לשלושה פרטים במשפט הראשון: העונה, המקום, ומה רצו למנוע מהסטודנטים. איזו תשובה כוללת את כולם?"],"rd|מה אפשר להסיק מהמשפט \"רק שנים אחר כך חשבו לפתוח את התחתית\"?":["חשבו כמה קשה היה 'לפתוח את התחתית', ומה כתוב על הבעיה שהייתה לפני כן.",
"עם תחתית, מישהו טיפס אחרי כל סל להוציא את הכדור. הפתרון פשוט מאוד, ובכל זאת עברו שנים. מה זה מלמד?"],"rd|איזה פרט לא השתנה מאז 1891?":["חפשו בסוף הקטע את המילים 'לא השתנה מאז'. על מה הן נאמרות?",
"סלי האפרסקים והתחתית הוחלפו מאז. המשפט האחרון מזכיר מספר אחד שנשאר בדיוק כמו שהיה. מה המספר הזה מודד?"],"rd|מה הכוונה ב\"שחקן 12\"?":["כמה שחקנים יש בקבוצת כדורגל על המגרש? ומי לפי הקטע 'שווה שחקן 12'?",
"בקבוצה יש 11 שחקנים. הקטע אומר שהרעש של מישהו מהיציע שווה עוד שחקן. של מי הרעש?"],"rd|לפי הקטע, מה ידוע בוודאות?":["הפרידו בין מה שהמחקרים 'מראים' לבין מה שהחוקרים 'לא בטוחים' בו.",
"המחקרים מראים תוצאה, אבל החוקרים לא בטוחים מה הסיבה לה. פסלו תשובות שקובעות סיבה או אומרות 'תמיד'."],"rd|מה מתאר הכי טוב את הגישה של הקטע לשאלה \"למה יש יתרון ביתי\"?":["קראו את המשפט האחרון: כמה הסברים הוא מציג, ומה הוא אומר על החוקרים?",
"הקטע מציג שלוש סיבות אפשריות ואומר שהחוקרים 'לא בטוחים'. איזו מילה מתארת כותב שלא קובע בלי הוכחה?"],"rd|מה היתרון של זירה בעלת שמונה צלעות, לפי הקטע?":["חפשו את ההשוואה לזירה מרובעת, כמו בזירת אגרוף: מה הבעיה עם הפינות שלה?",
"בזירה מרובעת יש פינות חדות שבהן לוחם יכול להילכד. מה כתוב על הזוויות בזירה של שמונה צלעות?"],"rd|קרב רגיל נמשך עד הסוף, בלי ניצחון מוקדם. כמה דקות לחמו בו בסך הכל, בלי ההפסקות?":["חפשו במשפט האחרון כמה סיבובים יש בקרב רגיל, וכמה זמן נמשך כל סיבוב.",
"יש 3 סיבובים, וכל סיבוב נמשך 5 דקות. כמה זה 3 פעמים 5?"],"rd|למה המילה \"לתקוע\" כתובה בקטע בתוך מירכאות?":["מצאו את המשפט שבו מופיעה המילה 'לתקוע'. מה תוקעים בדרך כלל, ומה 'תוקעים' כאן?",
"בדרך כלל תוקעים מסמר בקיר, אבל כאן מדובר ביריב בפינה של הזירה. בדקו גם: האם הקטע מזכיר אדם כלשהו שאפשר לצטט?"],"rd|מה הבעיה שהחוקרים הזהירים זיהו?":["חפשו את המשפט שמתחיל ב'אבל חוקרים זהירים שאלו'. מה השאלה שלהם?",
"הם שאלו: אולי מי שכבר מזהה פרטים מהר פשוט משחק יותר? חשבו: המשחק משנה את המוח, או להפך?"],"rd|למה החוקרים נתנו לשחק רק לחלק מהאנשים, ולא לכולם?":["חפשו בקטע מה עשו החוקרים: 'נתנו רק לחלק מהם לשחק'. מה קורה עם החלק השני?",
"אם כולם היו משחקים, לא היינו יודעים איך היו נראים בלי משחק. מה הקבוצה שלא שיחקה מראה לחוקרים?"],"rd|איזו כותרת מתאימה ביותר לקטע?":["כותרת טובה מתאימה לרוב הקטע, לא לפרט אחד. על מה מדבר רוב הקטע, אחרי המשפט השני?",
"רוב הקטע עוסק בשאלה של החוקרים הזהירים ובניסוי שבנו כדי לבדוק אותה. איזו כותרת מתארת את דרך הבדיקה?"],"rd|מה התפקיד של הקבוצה שנשארה ערה בניסוי?":["חפשו את הניסוי: מה עשה כל חצי מהתלמידים, ואיך השוו ביניהם?",
"חצי ישנו וחצי נשארו ערים, וכל השאר היה אותו דבר. בלי הקבוצה הערה, למה היה אפשר להשוות את מי שישן?"],"rd|מה המסקנה המעשית מהקטע?":["קראו את המשפט האחרון, שמתחיל ב'לכן'. מה הוא ממליץ לעשות לפני מבחן חשוב?",
"כתוב ששעה נוספת של משהו עשויה לעזור יותר משעה נוספת של שינון. מהו הדבר הזה?"],"rd|המילה \"מחזק\" בקטע קרובה במשמעותה ל:":["מצאו את המשפט 'ומחזק את הזיכרונות החשובים'. מה קורה לזיכרון חזק לאורך זמן?",
"'מחליש' ו'מוחק' הם בדיוק ההפך. איזו אפשרות אומרת שהזיכרון נשאר במקומו ולא נעלם?"],"rd|למה הדבורים \"מרוויחות\" מתאים בצורת משושה?":["חפשו בקטע ממה למשושה יש 'הכי מעט' לכל תא, וממה הדבורים בונות את זה.",
"למשושה יש הכי מעט קירות לכל תא, והקירות עשויים משעווה. מה כתוב על מה שדרוש כדי לייצר שעווה?"],"rd|איזו צורה לא יכולה לכסות משטח בלי רווחים, לפי הקטע?":["חפשו את המשפט שמונה אילו צורות משוכללות 'מתאימות' לכיסוי בלי רווחים.",
"הקטע מונה בדיוק שלוש צורות. בדקו איזו מהאפשרויות לא מופיעה ברשימה הזו."],"rd|מה אפשר להסיק מהמשפט האחרון?":["קראו את המשפט האחרון: כמה זמן 'חשדו', ומתי נמצאה ההוכחה?",
"מתמטיקאים חשדו בזה מאות שנים, וההוכחה המלאה הגיעה רק ב-1999. מה המרחק בזמן בין החשד להוכחה מלמד?"],"rd|לפי הקטע, למה אנשים האמינו ברעיון של ארבעת היסודות כל כך הרבה זמן?":["חפשו את המשפט עם המילים 'כל כך משכנע'. איזו דוגמה הקטע נותן ממש לפניו?",
"הקטע מסביר שריפת עץ: יוצאים אש ועשן, ונשאר אפר שנראה כמו אדמה. למה הסבר כזה שכנע אנשים?"],"rd|איזה משפט נכון לפי המדע של היום?":["חפשו בקטע מה מדענים גילו 'במאות השנים האחרונות'. אילו דוגמאות של יסודות אמיתיים מופיעות שם?",
"הקטע אומר שאחד מארבעת היסודות הישנים אינו יסוד בכלל. איזה מהם, וממה הוא בנוי לפי הקטע?"],"rd|מה דעת הכותב על הרעיון הישן?":["קראו את המשפט האחרון, שמתחיל ב'ובכל זאת'. מה הכותב אומר שם על הרעיון הישן?",
"הכותב אומר שהרעיון 'לא היה טיפשי' והיה ניסיון ראשון להסביר עולם מסובך. זה יחס של לעג או של הערכה?"],"lg|כל החתולים אוהבים חלב. מיצי אוהב חלב. מה אפשר להסיק בוודאות?":["המשפט אומר שכל החתולים אוהבים חלב. האם הוא אומר שרק חתולים אוהבים חלב?",
"גם כלב יכול לאהוב חלב. אז מזה שמיצי אוהב חלב, האם אפשר לדעת מה הוא?"],"lg|במגירה 10 גרביים שחורות ו-10 לבנות, והחדר חשוך. כמה גרביים צריך להוציא כדי להיות בטוח שיש זוג באותו צבע?":["חשבו על המקרה הגרוע: מה הכי פחות מזל שיכול לקרות בגרביים הראשונות שמוציאים?",
"במקרה הגרוע שתי הראשונות יוצאות שחורה ולבנה. מה קורה עם הגרב הבאה?"],"lg|לאבא של דנה יש 5 בנות: ננה, נני, נינו ונונו. מה שם הבת החמישית?":["קראו שוב את תחילת השאלה, מילה במילה. של מי האבא?",
"ברשימה כתובים ארבעה שמות. יש בשאלה עוד שם של ילדה, מחוץ לרשימה. איפה הוא?"],"lg|בתחרות ריצה עקפת את הרץ שהיה במקום השני. באיזה מקום אתה עכשיו?":["ציירו את הרצים בשורה. מי שעוקף רץ, את המקום של מי הוא תופס?",
"אחרי העקיפה אתם עומדים איפה שעמד הרץ שעקפתם. האם מי שמוביל עדיין לפניכם?"],"lg|אורי, מאיה ותמר אוהבים כל אחד פרי אחר: תפוח, בננה או ענבים. אורי לא אוהב בננה ולא ענבים. מאיה לא אוהבת ענבים. מה אוהבת תמר?":["בנו טבלה: שמות בשורות, פירות בעמודות. מחקו כל מה שכתוב שמישהו לא אוהב.",
"לאורי נשאר רק תפוח. מה נשאר למאיה, לפי מה שהיא לא אוהבת? ומה נשאר לתמר?"],"lg|במשפחה יש שלוש אחיות, ולכל אחת מהן יש בדיוק אח אחד. כמה ילדים במשפחה?":["האם לכל אחות יש אח אחר, או שזה יכול להיות אותו אח? ציירו את המשפחה.",
"שלוש האחיות הן אחיות זו לזו, ולכולן אותו אח אחד. כמה ילדים ציירתם?"],"lg|יונתן עומד בתור. הוא השביעי מההתחלה והשנים-עשר מהסוף. כמה אנשים בתור?":["ציירו תור. כמה אנשים עומדים לפני יונתן, וכמה אחריו?",
"לפניו 6 אנשים ואחריו 11. אל תשכחו לספור גם את יונתן עצמו."],"lg|רכבת יוצאת כל 15 דקות, החל מ-6:00. יונתן מגיע לתחנה ב-7:38. מתי הרכבת הבאה?":["כתבו את שעות היציאה של הרכבות, כל 15 דקות, מ-7:00 והלאה.",
"הרכבות יוצאות ב-7:00, 7:15, 7:30 וכן הלאה. איזו יציאה היא הראשונה אחרי 7:38?"],"lg|סבתא מבשלת 3 ביצים בסיר אחד ב-12 דקות. כמה זמן ייקח לה לבשל 6 ביצים באותו סיר, יחד?":["האם ביצה מתבשלת לאט יותר כשיש לידה עוד ביצים בסיר?",
"כל הביצים בסיר מתבשלות באותו הזמן, יחד. כמה זמן לקח לבשל את 3 הביצים?"],"lg|כל הזרגים הם פלימים. חלק מהפלימים כחולים. האם בהכרח חלק מהזרגים כחולים?":["ציירו עיגול גדול של פלימים, ובתוכו עיגול קטן של זרגים. איפה יכולים להיות הכחולים?",
"נסו לצייר את הכחולים רק בחלק של הפלימים שמחוץ לזרגים. האם זה סותר משהו בשאלה?"],"lg|במגירה 10 גרביים שחורות ו-10 לבנות, והחדר חשוך. כמה גרביים צריך להוציא כדי להיות בטוח שיש לך זוג של שתי גרביים שחורות?":["חשבו על המקרה הגרוע: אילו גרביים יכולות לצאת קודם ולהפריע לכם?",
"במקרה הגרוע כל 10 הלבנות יוצאות קודם. כמה שחורות צריך אחר כך כדי שיהיה זוג?"],"lg|היום יום שלישי. איזה יום הוא \"שלשום\" של \"מחרתיים\"?":["פרקו את זה לשני צעדים: קודם מחרתיים, ואז שלשום של אותו יום.",
"מחרתיים זה יומיים קדימה, ושלשום זה יומיים אחורה. לאן חוזרים?"],"lg|בכיתה 30 תלמידים. 18 אוהבים כדורגל, 15 אוהבים כדורסל, ו-5 לא אוהבים אף אחד מהם. כמה אוהבים את שניהם?":["קודם הורידו את 5 שלא אוהבים אף אחד. כמה תלמידים אוהבים לפחות ספורט אחד?",
"25 תלמידים אוהבים לפחות אחד, אבל 18 + 15 = 33. למה יצא יותר, ומי נספר פעמיים?"],"lg|שעון מאחר 5 דקות בכל שעה. כיוונו אותו נכון בשעה 12:00. מה הוא יראה כשהשעה האמיתית היא 18:00?":["כמה שעות עוברות מ-12:00 עד 18:00? בכל שעה כזו השעון מפסיד 5 דקות.",
"עוברות 6 שעות, אז השעון מאחר 6 × 5 = 30 דקות. מה הוא מראה כשהשעה האמיתית 18:00?"],"lg|חבל באורך 12 מטר נחתך לחתיכות של 2 מטר. כל חיתוך לוקח דקה. כמה דקות זה ייקח?":["ציירו חבל של 12 מטר וסמנו איפה חותכים, כל 2 מטר. כמה חתיכות יוצאות?",
"יוצאות 6 חתיכות. כמה חיתוכים צריך? ספרו את הסימנים בציור, לא את החתיכות."],"lg|גדר ישרה באורך 20 מטר. מציבים עמוד כל 4 מטר, כולל בשני הקצוות. כמה עמודים?":["ציירו קו של 20 מטר וסמנו עמוד כל 4 מטר. אל תשכחו את שני הקצוות.",
"20 ÷ 4 = 5 רווחים בין עמודים. האם יש יותר עמודים מרווחים, או פחות?"],"lg|5 מכונות מייצרות 5 צעצועים ב-5 דקות. כמה זמן ייקח ל-100 מכונות לייצר 100 צעצועים?":["כמה צעצועים מייצרת כל מכונה בזמן הזה? חשבו על מכונה אחת מתוך ה-5.",
"כל מכונה מייצרת צעצוע אחד בזמן הזה, וכל המכונות עובדות במקביל. מה משתנה כשיש 100 מכונות?"],"lg|שושן מים מכפיל את גודלו כל יום. ביום ה-30 הוא מכסה את כל האגם. באיזה יום הוא כיסה חצי מהאגם?":["חשבו אחורה מיום 30. אם השושן מכפיל את עצמו כל יום, מה היה גודלו יום לפני?",
"ביום 30 האגם מלא, ויום לפני השושן היה קטן פי 2. כמה זה מהאגם, ובאיזה יום?"],"lg|מחבט וכדור עולים יחד 110 ₪. המחבט יקר מהכדור ב-100 ₪. כמה עולה הכדור?":["נסו לבדוק 10 ₪ לכדור: כמה יעלה המחבט, וכמה יחד? האם יוצא 110?",
"נסמן את מחיר הכדור x. המחבט עולה x + 100. יחד: x + x + 100 = 110. כמה זה x?"],"lg|אם יורד גשם, יונתן לוקח מטרייה. היום יונתן לא לקח מטרייה. מה נכון בוודאות?":["אם היה יורד גשם, מה יונתן היה עושה? ומה הוא עשה בפועל?",
"בגשם הוא תמיד לוקח מטרייה, והיום הוא לא לקח. האם ייתכן שהיה גשם?"],"lg|דלי מלא מים שוקל 10 ק\"ג. כשהוא חצי מלא הוא שוקל 6 ק\"ג. כמה שוקל הדלי הריק?":["מה ההבדל בין דלי מלא לדלי חצי מלא? רק המים. כמה שוקלים חצי מהמים?",
"חצי מהמים שוקל 10 − 6 = 4 ק\"ג. כמה שוקלים כל המים, ומה נשאר לדלי?"],"lg|אם כל הפלורבים הם גלונים, ואף גלון אינו טרומי, מה נכון?":["ציירו עיגול של גלונים ובתוכו עיגול של פלורבים. איפה תציירו את הטרומיים?",
"הטרומיים חייבים להיות מחוץ לעיגול של הגלונים. האם הם יכולים לגעת בעיגול של הפלורבים?"],"lg|5 בתים בשורה, כל אחד בצבע אחר. הירוק באמצע. הצהוב בקצה הימני. הלבן צמוד לצהוב. האדום נמצא מיד משמאל לכחול. איזה בית בקצה השמאלי?":["ציירו 5 משבצות בשורה ומלאו קודם את מה שבטוח: האמצע והקצה הימני.",
"צהוב בקצה הימני, הלבן צמוד אליו, הירוק באמצע. אילו שני מקומות נשארו, ומי משמאל למי?"],"lg|שני אבות ושני בנים הלכו לדוג. כל אחד דג דג אחד, ובסך הכל דגו 3 דגים. איך זה ייתכן?":["האם אדם אחד יכול להיות גם אב וגם בן באותו הזמן?",
"3 דגים אומר שיש רק 3 אנשים. מי מהם יכול להיות גם אבא של מישהו וגם בן של מישהו?"],"lg|מהו המספר הקטן ביותר שמתחלק ב-2, 3, 4, 5 וגם ב-6?":["אין צורך לכפול את כל המספרים. מי שמתחלק ב-4 מתחלק גם ב-2. אילו מספרים עוד 'נכללים' באחרים?",
"מספיק שיתחלק ב-4, ב-3 וב-5, כי אז הוא מתחלק גם ב-2 וב-6. מה המספר הקטן ביותר כזה?"],"lg|באי יש אבירים, שתמיד אומרים אמת, ונוכלים, שתמיד משקרים. פגשת שניים מהם, א' וב'. א' אומר: \"שנינו נוכלים\". מי הם א' וב'?":["התחילו מא': אם הוא אביר, האם הוא יכול לומר \"שנינו נוכלים\"?",
"אביר לא יכול לומר על עצמו שהוא נוכל, אז א' משקר. אם המשפט \"שנינו נוכלים\" שקר, מה זה אומר על ב'?"],"lg|אם יורד גשם, יונתן לוקח מטרייה. היום יונתן לקח מטרייה. מה נכון בוודאות?":["הכלל אומר מה קורה כשיש גשם. האם הוא אומר משהו על מתי עוד יונתן לוקח מטרייה?",
"האם יש סיבות אחרות לקחת מטרייה, למשל נגד שמש? אם כן, מה המטרייה מלמדת על הגשם?"],"lg|אחד משלושה ילדים שבר חלון. אבי: \"דני שבר\". דני: \"לא אני\". גיל: \"לא אני\". רק אחד מהם דובר אמת. מי שבר?":["בדקו כל ילד בתורו: אם הוא שבר, מי משלושתם אומר אמת? ספרו.",
"אם דני שבר, שני הילדים האחרים אומרים אמת, וזה יותר מדי. בדקו באותה דרך את שתי האפשרויות האחרות."],"lg|כמה פעמים מופיעה הספרה 7 כשכותבים את כל המספרים מ-1 עד 100?":["ספרו בנפרד: כמה פעמים 7 בספרת האחדות, וכמה פעמים בספרת העשרות.",
"באחדות: 7, 17, 27 עד 97, כלומר 10 פעמים. כמה מספרים יש מ-70 עד 79, ומה עם 77?"],"lg|שלוש קופסאות עם תוויות: \"תפוחים\", \"תפוזים\", \"מעורב\". כל התוויות שגויות. מאיזו קופסה מספיק להוציא פרי אחד כדי לדעת מה יש בכל הקופסאות?":["כל התוויות שגויות. לכל קופסה, רשמו מה יכול להיות בה באמת.",
"רק קופסה אחת, שהתווית שלה שגויה, בטוח מכילה סוג פרי אחד בלבד. איזו? פרי אחד ממנה מגלה הכל."],"lg|יש 9 כדורים זהים במראה, ואחד מהם כבד יותר. במאזני כפות, מה מספר השקילות הקטן ביותר שמבטיח למצוא את הכבד?":["במאזניים יש שלוש תוצאות: שמאל כבד, ימין כבד, או שוויון. איך כדאי לחלק את 9 הכדורים?",
"חלקו ל-3 קבוצות של 3 ושקלו שתיים. אחרי שקילה אחת יודעים באיזו קבוצה הכבד. כמה עוד צריך?"],"lg|בשנה רגילה (365 ימים) ה-1 בינואר יצא ביום ראשון. באיזה יום יצא ה-1 בינואר בשנה שאחריה?":["כמה שבועות שלמים יש ב-365 ימים, ומה נשאר? חלקו ב-7.",
"365 ימים הם 52 שבועות ועוד יום אחד. כמה ימים בשבוע זזים קדימה מיום ראשון?"],"lg|רינה אומרת: \"שלשום הייתי בת 10, ובשנה הבאה אהיה בת 13\". באיזה תאריך היא אומרת את זה?":["בין שלשום לשנה הבאה היא עולה מ-10 ל-13. כמה ימי הולדת יש בדרך, ומתי יום ההולדת יכול להיות?",
"נסו יום הולדת ב-31 בדצמבר. אם שלשום הייתה בת 10 ואתמול חגגה 11, איזה תאריך היום?"],"fam|רותי היא אחותה של אמא של עידו. מה רותי לעידו?":["התחילו מאמא של עידו. רותי היא אחות שלה. מה היא בשביל הילדים של אחותה?",
"זו לא סבתא, היא מהדור של אמא. איך קוראים במשפחה לאחות של אמא או של אבא?"],"fam|משה הוא האבא של האבא של שירה. מה משה לשירה?":["פרקו לשני צעדים: מי האבא של שירה? ומי האבא שלו?",

      ['איזה משפט נכון לפי הקטע?',['מיי בנה את הגיטרה יחד עם אביו','מיי קנה את הגיטרה בחנות מיוחדת','מיי מנגן עם מפרט רגיל','מיי סיים את הדוקטורט לפני שהלהקה הצליחה'],'בשאלת "מה נכון" בודקים כל תשובה מול הקטע, ופוסלים כל מה שהקטע סותר.<span class="rdq">כשהיה נער הוא בנה אותה יחד עם אביו</span>השאר נפסלות: הוא "לא קנה" את הגיטרה בחנות, מנגן "עם מטבע" במקום מפרט, והפסיק את הדוקטורט "כשהלהקה הצליחה".<span class="rdt"><b>מלכודת:</b> "מיי סיים את הדוקטורט לפני שהלהקה הצליחה". הוא אכן סיים, אבל רק יותר מ-30 שנה אחרי.</span>',1,'כשהיה נער הוא בנה אותה יחד עם אביו']]},
 { t:'פיאנו-פורטה', p:'לפסנתר רגיל יש 88 קלידים: 52 לבנים ו-36 שחורים. הקלידים השחורים מסודרים בקבוצות של שניים ושלושה, וכך הנגן יודע איפה הוא נמצא בלי לספור. הפסנתר הומצא באיטליה בסביבות שנת 1700 בידי בונה כלים בשם ברטולומאו כריסטופורי. לפני כן היה נפוץ הצ\'מבלו, שבו המיתרים נפרטים, ולכן כל צליל נשמע כמעט באותה עוצמה. בפסנתר, פטיש קטן מכה במיתר: לחיצה חזקה נותנת צליל חזק, ולחיצה עדינה נותנת צליל שקט. השם המקורי של הכלי, "פיאנופורטה", פירושו באיטלקית "שקט-חזק".',
   q:[['מה היה היתרון הגדול של הפסנתר על הצ\'מבלו?',['אפשר לשלוט בעוצמת הצליל','יש לו יותר קלידים שחורים','הוא הומצא לפני הצ\'מבלו','המיתרים בו נפרטים'],'בשאלת השוואה מחפשים מה יש באחד ואין בשני. בצ\'מבלו "כל צליל נשמע כמעט באותה עוצמה". ובפסנתר:<span class="rdq">לחיצה חזקה נותנת צליל חזק, ולחיצה עדינה נותנת צליל שקט</span>כלומר בפסנתר שולטים בעוצמה.<span class="rdt"><b>מלכודת:</b> "המיתרים בו נפרטים". זה נכון לצ\'מבלו, לא לפסנתר: בפסנתר פטיש מכה במיתר.</span>',1,'לחיצה חזקה נותנת צליל חזק, ולחיצה עדינה נותנת צליל שקט'],
      ['למה הקלידים השחורים מסודרים בקבוצות של 2 ו-3?',['כדי שהנגן יזהה את המקום שלו בלי לספור','כדי לחסוך בעץ','כי כך קל יותר לייצר אותם','כדי שהצליל יהיה חזק יותר'],'בשאלת "למה" מחפשים בקטע מילת תוצאה, כמו "וכך" או "ולכן".<span class="rdq">הקלידים השחורים מסודרים בקבוצות של שניים ושלושה, וכך הנגן יודע איפה הוא נמצא בלי לספור.</span><span class="rdt"><b>מלכודת:</b> "כדי שהצליל יהיה חזק יותר". לפי הקטע העוצמה תלויה בלחיצה, לא בסידור הקלידים.</span>',1,'הקלידים השחורים מסודרים בקבוצות של שניים ושלושה, וכך הנגן יודע איפה הוא נמצא בלי לספור.'],
      ['כמה קלידים לבנים יש בפסנתר על כל קליד שחור, בקירוב?',['בערך 1.5','בערך 2','בערך 3','בערך 1'],`לוקחים את שני המספרים מהקטע ומחלקים: לבנים חלקי שחורים.<span class="rdq">לפסנתר רגיל יש 88 קלידים: 52 לבנים ו-36 שחורים.</span>${L('52 ÷ 36')}: ה-36 נכנס פעם אחת, ונשארים 16. זה כמעט חצי מ-36 (חצי הוא 18). לכן בערך קליד וחצי לבן על כל שחור.<span class="rdt"><b>מלכודת:</b> "בערך 2". אילו היו 2 לבנים על כל שחור, היו ${L('2 × 36 = 72')} לבנים, ויש רק 52.</span>`,3,'לפסנתר רגיל יש 88 קלידים: 52 לבנים ו-36 שחורים.']]},
 { t:'סלים של אפרסקים', p:'בחורף של 1891 ביקשו מהמורה לחינוך גופני ג\'יימס נייסמית\' להמציא משחק שאפשר לשחק בתוך אולם, כדי שהסטודנטים לא ישתעממו בקור. נייסמית\' תלה שני סלים של אפרסקים על המעקה של מרפסת באולם, בגובה של כ-3 מטרים, וכתב 13 כללים פשוטים. לסלים הייתה תחתית, ולכן אחרי כל סל מישהו היה צריך לטפס ולהוציא את הכדור. רק שנים אחר כך חשבו לפתוח את התחתית. היום יש בכדורסל הרבה יותר מ-13 כללים, ובמקום סלי אפרסקים יש טבעת מתכת עם רשת. אבל גובה הסל, 3.05 מטרים, לא השתנה מאז.',
   q:[['איזו בעיה נייסמית\' נדרש לפתור?',['למצוא פעילות מעניינת בתוך אולם בחורף','להמציא סל בלי תחתית','לבנות מרפסת חדשה','לכתוב חוקים לכדורגל'],'את הבעיה מוצאים בדרך כלל בהתחלה, ליד המילה "כדי".<span class="rdq">להמציא משחק שאפשר לשחק בתוך אולם, כדי שהסטודנטים לא ישתעממו בקור</span>זה בחורף (קור), באולם, וכדי שלא ישתעממו: פעילות מעניינת בתוך אולם.<span class="rdt"><b>מלכודת:</b> "להמציא סל בלי תחתית". את התחתית פתחו רק "שנים אחר כך", וזו לא הייתה המשימה שלו.</span>',1,'להמציא משחק שאפשר לשחק בתוך אולם, כדי שהסטודנטים לא ישתעממו בקור'],
      ['מה אפשר להסיק מהמשפט "רק שנים אחר כך חשבו לפתוח את התחתית"?',['לפעמים לוקח הרבה זמן לגלות פתרון פשוט','השחקנים אהבו לטפס','הסלים היו יקרים מאוד','נייסמית\' לא רצה שיהיו סלים'],'הסקה: שואלים מה המשפט מלמד, בלי להוסיף דברים שלא כתובים.<span class="rdq">רק שנים אחר כך חשבו לפתוח את התחתית.</span>לפתוח תחתית זה פתרון פשוט מאוד, ובכל זאת עברו שנים עד שחשבו עליו.<span class="rdt"><b>מלכודת:</b> "השחקנים אהבו לטפס". הקטע מתאר את הטיפוס כטרחה ("מישהו היה צריך לטפס"), ולא אומר שמישהו נהנה ממנו.</span>',2,'רק שנים אחר כך חשבו לפתוח את התחתית.'],
      ['איזה פרט לא השתנה מאז 1891?',['גובה הסל','סלי האפרסקים','הסל עם התחתית','מספר הכללים'],'מחפשים בקטע את המילים מהשאלה: "לא השתנה מאז".<span class="rdq">אבל גובה הסל, 3.05 מטרים, לא השתנה מאז.</span><span class="rdt"><b>מלכודת:</b> "מספר הכללים". נייסמית\' כתב 13 כללים, והיום יש "הרבה יותר מ-13". גם סלי האפרסקים והתחתית הוחלפו.</span>',1,'אבל גובה הסל, 3.05 מטרים, לא השתנה מאז.']]},
 { t:'השחקן ה-12', p:'מועדון הכדורגל ליברפול נוסד בשנת 1892, ומשחק מאז באצטדיון אנפילד. אחד הדברים המפורסמים באנפילד הוא היציע "הקופ", שבו נמצאים אלפי האוהדים הרועשים ביותר. אוהדים רבים מאמינים שהרעש שלהם שווה "שחקן 12" לקבוצה. מחקרים על כדורגל מראים שלקבוצה המארחת יש באמת יתרון קטן: היא מנצחת יותר משחקים בבית מאשר בחוץ. עם זאת, החוקרים לא בטוחים מה הסיבה: הקהל, ההיכרות עם המגרש, או אולי העייפות של הקבוצה האורחת מהנסיעה.',
   q:[['מה הכוונה ב"שחקן 12"?',['הקהל, שעוזר לקבוצה כאילו היה עוד שחקן','שחקן מחליף','השוער','המאמן'],'ביטוי במירכאות מסבירים בעזרת המשפט שבו הוא נמצא.<span class="rdq">אוהדים רבים מאמינים שהרעש שלהם שווה "שחקן 12" לקבוצה.</span>בקבוצת כדורגל יש 11 שחקנים על המגרש. הרעש של האוהדים עוזר כמו עוד שחקן, השנים-עשר.<span class="rdt"><b>מלכודת:</b> "שחקן מחליף". הקטע מדבר על הרעש של האוהדים, לא על שחקן אמיתי.</span>',1,'אוהדים רבים מאמינים שהרעש שלהם שווה "שחקן 12" לקבוצה.'],
      ['לפי הקטע, מה ידוע בוודאות?',['קבוצות מארחות מנצחות קצת יותר','הקהל הוא הסיבה ליתרון','הקבוצה האורחת תמיד עייפה','ליברפול לא מפסידה בבית'],'"בוודאות" = מה שהמחקרים מראים, לא מה שאנשים מאמינים או מנחשים.<span class="rdq">מחקרים על כדורגל מראים שלקבוצה המארחת יש באמת יתרון קטן</span><span class="rdt"><b>מלכודת:</b> "הקהל הוא הסיבה ליתרון". על הסיבה הקטע אומר במפורש: "החוקרים לא בטוחים מה הסיבה".</span>',2,'מחקרים על כדורגל מראים שלקבוצה המארחת יש באמת יתרון קטן'],
      ['מה מתאר הכי טוב את הגישה של הקטע לשאלה "למה יש יתרון ביתי"?',['זהירה: היא מציגה כמה הסברים אפשריים','בטוחה לגמרי שזה הקהל','לועגת לאוהדים','טוענת שאין יתרון כזה'],'את הגישה של כותב מגלים לפי המילים שלו: "בטוח", "אולי", "לא ברור".<span class="rdq">עם זאת, החוקרים לא בטוחים מה הסיבה</span>ואחריו שלוש אפשרויות, אחת מהן עם "אולי". מי שמציג כמה הסברים ולא בוחר אחד הוא זהיר.<span class="rdt"><b>מלכודת:</b> "בטוחה לגמרי שזה הקהל". הקהל הוא רק אחת משלוש האפשרויות.</span>',3,'עם זאת, החוקרים לא בטוחים מה הסיבה']]},
 { t:'למה שמונה צלעות?', p:'בקרבות אומנויות לחימה מעורבות (MMA) נלחמים בתוך זירה בעלת שמונה צלעות שנקראת "אוקטגון". למה דווקא שמונה? בזירה מרובעת, כמו בזירת אגרוף, יש פינות חדות שבהן לוחם יכול להילכד. בזירה בעלת שמונה צלעות הזוויות רחבות יותר, ולכן קשה יותר "לתקוע" יריב בפינה. סיבה נוספת היא בטיחות: הרשת שמסביב מונעת מהלוחמים ליפול החוצה. בקרב רגיל יש 3 סיבובים, וכל סיבוב נמשך 5 דקות.',
   q:[['מה היתרון של זירה בעלת שמונה צלעות, לפי הקטע?',['הזוויות רחבות יותר וקשה להילכד בפינה','היא גדולה יותר מזירת אגרוף','היא זולה יותר לבנייה','רואים בה טוב יותר בטלוויזיה'],'מחפשים את המשפט עם "ולכן": הוא מחבר סיבה ותוצאה.<span class="rdq">בזירה בעלת שמונה צלעות הזוויות רחבות יותר, ולכן קשה יותר "לתקוע" יריב בפינה.</span><span class="rdt"><b>מלכודת:</b> "היא גדולה יותר מזירת אגרוף". הקטע משווה לזירת אגרוף רק את הפינות, ולא אומר כלום על הגודל.</span>',1,'בזירה בעלת שמונה צלעות הזוויות רחבות יותר, ולכן קשה יותר "לתקוע" יריב בפינה.'],
      ['קרב רגיל נמשך עד הסוף, בלי ניצחון מוקדם. כמה דקות לחמו בו בסך הכל, בלי ההפסקות?',['15','8','5','35'],`לוקחים מהקטע את שני המספרים. "כל סיבוב" נמשך 5 דקות, ולכן כופלים.<span class="rdq">בקרב רגיל יש 3 סיבובים, וכל סיבוב נמשך 5 דקות.</span>${L('3 × 5 = 15')} דקות.<span class="rdt"><b>מלכודת:</b> 8. זה ${L('3 + 5')}, אבל יש 3 סיבובים של 5 דקות כל אחד.</span>`,1,'בקרב רגיל יש 3 סיבובים, וכל סיבוב נמשך 5 דקות.'],
      ['למה המילה "לתקוע" כתובה בקטע בתוך מירכאות?',['כי היא לא במשמעות הרגילה שלה: הכוונה ללכוד יריב, לא לתקוע חפץ','כי זה ציטוט של לוחם מפורסם','כי זו מילה באנגלית','כי אסור לתקוע יריב לפי החוקים'],'מירכאות סביב מילה אחת מסמנות לפעמים שהמילה משמשת בצורה לא רגילה. בדרך כלל תוקעים מסמר בקיר. בקטע:<span class="rdq">ולכן קשה יותר "לתקוע" יריב בפינה</span>כאן הכוונה ללכוד את היריב בפינה, כך שלא יוכל לברוח. זה מתאים למשפט הקודם: "פינות חדות שבהן לוחם יכול להילכד".<span class="rdt"><b>מלכודת:</b> "ציטוט של לוחם מפורסם". אף אדם לא מוזכר בקטע, אז אין את מי לצטט.</span>',3,'ולכן קשה יותר "לתקוע" יריב בפינה']]},
 { t:'משחקי מחשב והמוח', p:'מדענים בדקו אם משחקי מחשב משפיעים על המוח. הם מצאו שאנשים שמשחקים הרבה במשחקי פעולה מהירים מזהים פרטים קטנים על המסך מהר יותר מאחרים. אבל חוקרים זהירים שאלו שאלה חשובה: אולי אנשים שכבר מזהים פרטים מהר פשוט נהנים יותר ממשחקים כאלה, ולכן משחקים יותר? כדי לבדוק, הם לקחו קבוצה של אנשים שלא שיחקו בכלל, ונתנו רק לחלק מהם לשחק במשך כמה שבועות. רק כך אפשר לדעת מה גורם למה.',
   q:[['מה הבעיה שהחוקרים הזהירים זיהו?',['לא ברור מה הסיבה ומה התוצאה','המשחקים היו ישנים מדי','המשתתפים שיחקו מעט מדי','לא היו מספיק מחשבים'],'את הבעיה מוצאים אחרי מילים כמו "אבל" ו"אולי".<span class="rdq">אולי אנשים שכבר מזהים פרטים מהר פשוט נהנים יותר ממשחקים כאלה, ולכן משחקים יותר?</span>אולי לא המשחק משפר את הזיהוי, אלא הזיהוי הטוב גורם לשחק יותר. לא ברור מה הסיבה ומה התוצאה.<span class="rdt"><b>מלכודת:</b> "המשתתפים שיחקו מעט מדי". הקטע מדבר על אנשים ש"משחקים הרבה".</span>',2,'אולי אנשים שכבר מזהים פרטים מהר פשוט נהנים יותר ממשחקים כאלה, ולכן משחקים יותר?'],
      ['למה החוקרים נתנו לשחק רק לחלק מהאנשים, ולא לכולם?',['כדי להשוות ולראות אם המשחק עשה את ההבדל','כדי שיהיה שקט בחדר','כי לא היו מספיק משחקים','כדי שהקבוצה ששיחקה תנצח'],'בניסוי טוב משנים דבר אחד רק בקבוצה אחת, ומשווים לקבוצה שלא שינו בה כלום.<span class="rdq">ונתנו רק לחלק מהם לשחק במשך כמה שבועות</span>ומיד אחר כך: "רק כך אפשר לדעת מה גורם למה". בלי קבוצה שלא שיחקה, אין למה להשוות.<span class="rdt"><b>מלכודת:</b> "כי לא היו מספיק משחקים". הקטע לא אומר שהיה מחסור, והחלוקה נעשתה בכוונה, "כדי לבדוק".</span>',2,'ונתנו רק לחלק מהם לשחק במשך כמה שבועות'],

/* Solving trace for puzzles with a unique solution: applies the clues one by one, each time the one that fixes
   the most new facts (then the one that rules out the most), and reports which facts became certain after it.
   clues: [{f: sol => bool}], sols: all candidate solutions, facts: sols => [keys that agree in all sols]. */
function lgTrace(clues, sols, facts) {
  let cur = sols, known = facts(cur), left = clues.slice();
  const steps = [];
  while (left.length && cur.length > 1) {
    let best = null;
    for (const c of left) {
      const nx = cur.filter(c.f), nf = facts(nx).filter(k => !known.includes(k)), sc = nf.length * 1000 - nx.length;
      if (!best || sc > best.sc) best = { c, nx, nf, sc };
    }
    steps.push({ c: best.c, nf: best.nf }); cur = best.nx; known = known.concat(best.nf); left = left.filter(c => c !== best.c);
  }
  return steps;
}

  return `<span class="lg-eu">${svg}${cap ? `<span class="lg-cap">${cap}</span>` : ''}</span>`;
}

function spLevel() { const d = nextDay() || TOTAL; return Math.min(3, baseDiff(d) + (SP && SP.score > 12 ? 1 : 0)); }

function spStart() { ac(); SP = { state: 'run', score: 0, end: Date.now() + 60000, prevBest: S.arcade.sprint }; spNew(); S.view = 'sprint'; render(); }

function kpStart() { ac(); KP = { state: 'run', score: 0, end: Date.now() + 90000, prevBest: S.arcade.kupa }; kpNew(); S.view = 'kupa'; render(); }

/* ---- 40-game/fb-engine.js ---- */
/* ---------- football engine: the world in meters ----------
   x 0..68 across the pitch, y = distance from the goal line (the halfway line is at 52.5), z = height.
   The goal mouth is x 30.34..37.66, z 0..2.44 at y 0. Our team attacks toward y 0. */
const FB = { GX0: 30.34, GX1: 37.66, GH: 2.44, G: 9.8, BR: .11 };
const FB_AB = {
  speed: ['מהירות', 'רץ מהר יותר'],
  dribble: ['כדרור', 'קשה מאוד לקחת ממנו את הכדור'],
  power: ['בעיטה חזקה', 'בועט חזק יותר ומרחוק יותר'],
  curl: ['בעיטה מסובבת', 'הכדור מסתובב יותר, והשוער מתבלבל'],
  vision: ['ראיית משחק', 'מסירות מהירות ומדויקות שקשה לחטוף'],
  header: ['נגיחה', 'מנצח בכדורי גובה ונוגח בדיוק'],
  chip: ['לוב', 'מרים לבד מעל שוער שיצא מהשער'],
  turn: ['תפנית', 'כפתור תפנית שמבלבל את המגן הקרוב'],
  poacher: ['חוש שערים', 'בתוך הרחבה השוער מגיב לאט יותר'],
  leader: ['מנהיג', 'עוד 3 שניות בכל שלב'],
  extra: ['שוער-על', 'ניסיון נוסף בכל ריצה'],
};
const fbHas = (p, a) => !!(p && p.ab && p.ab.has(a));
const fbD = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* ----- build a world from a scene ----- */
function fbWorld(m) {
  const W = { m, t: 0, T: m.T, mode: 'idle', ev: [], rec: [], chip: false, turned: false, queue: null, shake: 0 };
  const kit = (team) => team === 'us' ? m.kit : m.kit2;
  W.ps = m.us.map(([id, n, x, y, path, sp, start], i) => ({ id, n, x, y, x0: x, y0: y, vx: 0, vy: 0, team: 'us', kit: kit('us'), num: (m.nums || {})[id] || '', path: path ? path.slice() : null, sp: sp || 6.6, start: start || 0, ab: new Set((m.ab || {})[id] || []), ph: i, st: '' }))
    .concat(m.opp.map(([id, n, x, y, role, sp], i) => {
      const gk = ['keeper', 'rush', 'pen', 'hold'].includes(role);
      return { id, n, x, y, x0: x, y0: y, vx: 0, vy: 0, team: 'them', kit: gk ? m.gkKit || { shirt: '#3FD27A', shorts: '#1B1B1F', socks: '#3FD27A' } : kit('them'), num: gk ? 1 : '', role, gk, sp: sp || (role === 'rush' ? 5.5 : gk ? 4 : 5), stick: 0, fooled: 0, ph: i * 1.7, st: '', tk: 0 };
    }));
  for (const p of W.ps) if (fbHas(p, 'speed')) p.sp *= 1.15;
  if (W.ps.some(p => fbHas(p, 'leader'))) W.T += 3;
  if (m.gkMode) { const k = W.ps.find(p => p.team === 'us'); k.gk = true; k.kit = m.kit; k.num = 1; }
  W.carrier = m.gkMode ? null : W.ps.find(p => p.id === m.ball);
  const sp = m.spot || [W.carrier.x, W.carrier.y - .7];
  W.b = { x: sp[0], y: sp[1], z: FB.BR, vx: 0, vy: 0, vz: 0, spin: 0, rot: 0 };
  W.fly = null;
  return W;
}
const fbP = (W, id) => W.ps.find(p => p.id === id);
const fbEmit = (W, type, data) => W.ev.push([type, data]);
const fbMove = (p, tx, ty, sp, dt, acc = 14) => {
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  const want = d < .08 ? 0 : Math.min(sp, d * 3), ux = d ? dx / d : 0, uy = d ? dy / d : 0;
  const ax = ux * want - p.vx, ay = uy * want - p.vy, am = Math.hypot(ax, ay), k = Math.min(1, acc * dt / (am || 1));
  p.vx += ax * k; p.vy += ay * k;
};
const fbGK = W => W.ps.find(p => p.gk);

/* ----- ball physics: one small step (also used to predict) ----- */
function fbBallStep(b, dt, withSpin = true) {
  const v = Math.hypot(b.vx, b.vy);
  if (withSpin && b.spin && v > 2) { const s = b.spin / v; b.vx += -b.vy * s * dt; b.vy += b.vx * s * dt; b.spin *= Math.pow(.55, dt); }
  if (b.z > FB.BR + .01 || b.vz > 0) { b.vz -= FB.G * dt; const drag = Math.pow(.88, dt); b.vx *= drag; b.vy *= drag; }
  else { const dec = Math.max(0, 1 - 2.6 * dt / Math.max(.5, v)); b.vx *= dec; b.vy *= dec; b.vz = 0; b.z = FB.BR; }
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  if (b.z < FB.BR) { b.z = FB.BR; if (b.vz < -1.2) { b.vz = -b.vz * .5; b.vx *= .82; b.vy *= .82; } else b.vz = 0; }
  b.rot += v * dt * 3;
}
/* where will the ball cross the goal line (y = yk)? keepers read the flight without the spin */
function fbPredict(b, yk, withSpin) {
  const c = Object.assign({}, b); for (let i = 0; i < 160; i++) { const py = c.y; fbBallStep(c, 1 / 60, withSpin); if (c.y <= yk && py > yk) return c; if (Math.hypot(c.vx, c.vy) < .5) break; }
  return null;
}

/* ----- actions ----- */
function fbKick(W, who, vx, vy, vz, spin, kind, extra = {}) {
  const b = W.b; b.vx = vx; b.vy = vy; b.vz = vz; b.spin = spin; b.x = who.x; b.y = who.y - .5; b.z = extra.header && W.header ? 1.8 : FB.BR + .02;
  W.carrier = null; W.runTo = null; W.fly = Object.assign({ kind, by: who, t: 0 }, extra);
  who.st = 'kick'; who.stT = .28; fbEmit(W, 'kick', kind);
}
/* a pass to a teammate: ground pass, or lofted when far or asked; curve bends it */
function fbPassTo(W, to, o = {}) {
  const c = W.carrier; if (!c || c.team !== 'us' || to === c) return;
  /* a runner gets the ball where his run ends; anyone else a little ahead of where he is going */
  let end = to.path && to.path.length ? to.path[to.path.length - 1] : null; if (end && Math.hypot(end[0] - c.x, end[1] - c.y) < 20) end = null;
  const tx = end ? end[0] : to.x + to.vx * .5, ty = end ? end[1] : to.y + to.vy * .5, d = Math.hypot(tx - c.x, ty - c.y);
  const vis = fbHas(c, 'vision'), loft = o.loft || d > 24;
  let vx, vy, vz;
  if (loft) {
    const t = Math.max(.9, d / 17); let h = d / t; vz = FB.G * t / 2 - .2;
    /* air drag shortens a long ball: fly it ahead of time and stretch it until it lands on the target */
    for (let it = 0; it < 4; it++) { const g = { x: c.x, y: c.y - .5, z: FB.BR + .02, vx: (tx - c.x) / d * h, vy: (ty - c.y) / d * h, vz, spin: 0, rot: 0 }; let up = false;
      for (let i = 0; i < 400; i++) { fbBallStep(g, 1 / 60, false); if (g.vz > 0) up = true; if (up && g.z <= FB.BR + .03) break; }
      const got = Math.hypot(g.x - c.x, g.y - (c.y - .5)); if (got > 1) h *= d / got; }
    vx = (tx - c.x) / d * h; vy = (ty - c.y) / d * h;
  }
  else { const v = Math.min(26, (9 + d * .55) * (vis ? 1.3 : 1)); vx = (tx - c.x) / d * v; vy = (ty - c.y) / d * v; vz = 0; }
  fbKick(W, c, vx, vy, vz, (o.curve || 0) * 10, 'pass', { to, vis, loft });
}
/* a shot at (gx, gz) on the goal plane; power 0..1; curve -1..1 bends the flight but it still ends near the aim */
function fbShootAt(W, gx, gz, o = {}) {
  const c = W.carrier; if (!c) return;
  const range = fbHas(c, 'power') ? 40 : 33;
  if (c.y > range) { fbEmit(W, 'toast', 'רחוק מדי מהשער. התקרב קודם.'); return false; }
  const gk = fbGK(W), chip = W.chip || (fbHas(c, 'chip') && gk && gk.y > 3 && c.y < 18);
  const pw = Math.max(0, Math.min(1, o.power == null ? .6 : o.power)), sy = c.y - .5, D = Math.hypot(gx - c.x, sy);
  let v = (chip ? 11 + D * .25 : 19 + pw * 11) * (fbHas(c, 'power') ? 1.15 : 1);
  if (W.header) v *= fbHas(c, 'header') ? .95 : .78;
  /* too much power lifts the ball: the classic shot over the bar */
  const aimZ = Math.max(.15, Math.min(3.4, gz + (chip ? 0 : Math.max(0, pw - .75) * 2.2)));
  const curl = (o.curve || 0) * (fbHas(c, 'curl') ? 26 : 12);
  const t = chip ? Math.max(1.05, D / 12) : D / v;
  const z0 = W.header ? 1.8 : FB.BR, vz = (aimZ - z0 + FB.G * t * t / 2) / t;
  /* aim to the side so the curl brings it back to the target */
  const ux = (gx - c.x) / D, uy = (0 - sy) / D, h = D / t, off = curl * t * t / 2 * .55;
  let vx = ux * h + uy * off / t, vy = uy * h - ux * off / t, vz2 = vz;

/* ----- the real move, replayed from its tracks ----- */
function lgAt(tr, t) {
  let i = 0; while (i < tr.length - 1 && tr[i + 1][0] <= t) i++;
  const a = tr[i], b = tr[Math.min(i + 1, tr.length - 1)]; if (a === b || t <= a[0]) return [a[1], a[2]];
  const k = Math.min(1, (t - a[0]) / (b[0] - a[0])); return [a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
}
function lgReplay() { lgReset(); document.getElementById('lgpane').hidden = true; LGS.W.mode = 'replay'; LGS.W.rt = 0; }
function lgReplayStep(dt) {
  const W = LGS.W, rp = LGS.m.rp; W.rt += dt; W.t += dt; const t = W.rt;
  for (const id in rp.tr) { const p = fbP(W, id); if (!p) continue; const [x, y] = lgAt(rp.tr[id], t); p.vx = (x - p.x) / Math.max(dt, 1e-3); p.vy = (y - p.y) / Math.max(dt, 1e-3); p.ph += Math.hypot(p.vx, p.vy) * dt * 2.3; p.x = x; p.y = y; }

  const bt = rp.ball; let i = 0; while (i < bt.length - 1 && bt[i + 1][0] <= t) i++;
  const a = bt[i], b = bt[Math.min(i + 1, bt.length - 1)], pa = pos(a), B = W.b;

  else { const pb = pos(b), k = Math.min(1, (t - a[0]) / (b[0] - a[0])), mv = Math.hypot(pb[0] - pa[0], pb[1] - pa[1]); B.x = pa[0] + (pb[0] - pa[0]) * k; B.y = pa[1] + (pb[1] - pa[1]) * k; B.z = FB.BR + ((rp.loft || []).includes(b[0]) ? Math.sin(k * Math.PI) * 3 : b.length === 3 && typeof b[1] !== 'string' ? k * .8 : 0); B.rot += mv * dt * 2; if (k > .02 && k < .2 && typeof a[1] === 'string') { const kp = fbP(W, a[1]); if (kp) { kp.st = 'kick'; kp.stT = .25; } } }

}

/* ----- touch: swipe to pass or shoot, hold and drag to dribble, tap to run ----- */
function lgInput() {
  const R = LGS.R, cv = R.cv; let g = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * R.W / r.width, y: (e.clientY - r.top) * R.H / r.height, t: performance.now() }; };

    if (!g) return; const q = pt(e); g.pts.push(q); const p0 = g.pts[0], d = Math.hypot(q.x - p0.x, q.y - p0.y);
    if (!g.mode && d > 16) g.mode = q.t - p0.t < 260 ? 'swipe' : 'drag';
    if (g.mode === 'swipe') LGS.trail.push(q);
    if (g.mode === 'drag' || (!g.mode && q.t - p0.t > 260)) { g.mode = 'drag'; const w = fbUnproject(R, q.x, q.y, 'ground'); if (w && LGS.W.carrier) LGS.W.runTo = { x: w.x, y: Math.max(.5, w.y) }; }
  };

}

  const ctx = LGS.R.ctx, now = performance.now(); LGS.trail = LGS.trail.filter(q => now - q.t < 380); const T = LGS.trail; if (T.length < 2) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

}
function lgTapAt(q) {

}
/* read a swipe: where it ends picks shot or pass; its bend is the curl; its speed is the power */
/* keeper mode: the keeper dives to the point of the goal the finger points at */
function lgDive(q) { const W = LGS.W, g = fbUnproject(LGS.R, q.x, q.y, 'goal'); if (g) W.diveTo = { x: Math.max(FB.GX0 - .5, Math.min(FB.GX1 + .5, g.x)), z: g.z }; }
function lgSwipe(pts) {
  const W = LGS.W, R = LGS.R, a = pts[0], z = pts[pts.length - 1], L = Math.hypot(z.x - a.x, z.y - a.y);
  if (W.m.gkMode) return lgDive(z); if (L < 20) return;

  if (W.fly && W.fly.kind === 'pass') { if (aim) { W.queue = aim; lgCap('בעיטה ראשונה!', 900); } return; }
  const c = W.carrier; if (!c || c.team !== 'us') return;
  if (aim) return fbShootAt(W, aim.x, aim.z, aim);
  const w = fbUnproject(R, z.x, z.y, 'ground'); if (!w) return;
  const mate = W.ps.filter(p => p.team === 'us' && p !== c).sort((p1, p2) => Math.hypot(p1.x - w.x, p1.y - w.y) - Math.hypot(p2.x - w.x, p2.y - w.y))[0];
  if (mate && Math.hypot(mate.x - w.x, mate.y - w.y) < 6) return fbPassTo(W, mate, { curve: curve * .6, loft: power > .8 });
  W.runTo = { x: w.x, y: Math.max(.5, w.y) };

    const upd = () => { scoreEl.innerHTML = `<span>גולים <b>${goals}</b></span><span>בעיטה <b>${Math.min(shots + 1, 5)}</b> מתוך 5</span>`; };
    upd();
    const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };
    cv.style.touchAction = 'none';
    cv.onpointerdown = e => { if (shot || over || msgT) return; start = pt(e); aim = start; };
    cv.onpointermove = e => { if (start) aim = pt(e); };
    cv.onpointerup = e => {

    };

      const { tx, th } = shot, hy = th * gh;
      let res;
      if (th > 1.02) res = ['מעל המשקוף!', 0];
      else if (tx < gx + r0 * .4 || tx > gx + gw - r0 * .4) res = ['החוצה! קרוב לקורה', 0];
      else if (Math.abs(kx - tx) < kw / 2 + r0 * .5 && hy < kh + r0) res = [`${B.n} עצר!`, 0];
      else res = [pick(['גול!', 'גוללל!', 'ישר לרשת!', 'איזה גול!']), 1];
      goals += res[1]; shots++; msg = res[0]; msgT = 60; upd();

      for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.05)'; ctx.fillRect(0, line + i * (H - line) / 6, W, (H - line) / 6); }
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, line); ctx.lineTo(W, line); ctx.stroke();
      ctx.strokeRect(gx - gw * .12, line, gw * 1.24, (H - line) * .32);
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(spot.x, spot.y + r0 * 1.2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
      for (let x = gx; x <= gx + gw; x += 12 * k) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, line); ctx.stroke(); }
      for (let y = gy; y <= line; y += 12 * k) { ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y); ctx.stroke(); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * k; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(gx, line); ctx.lineTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.lineTo(gx + gw, line); ctx.stroke();
    };

      const top = line - kh;
      ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(kx - kw * .32, top + kh * .28, kw * .64, kh * .72, 8) : ctx.rect(kx - kw * .32, top + kh * .28, kw * .64, kh * .72); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 6 * k; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(kx - kw * .3, top + kh * .38); ctx.lineTo(kx - kw * .5, top + kh * .12); ctx.moveTo(kx + kw * .3, top + kh * .38); ctx.lineTo(kx + kw * .5, top + kh * .12); ctx.stroke();

      ctx.fillStyle = '#F6D5BF'; ctx.beginPath(); ctx.arc(kx, top + kh * .16, kw * .17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1A1B22'; ctx.fillRect(kx - kw * .08, top + kh * .14, 3, 3); ctx.fillRect(kx + kw * .05, top + kh * .14, 3, 3);
    };

      ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y + r * .9, r * .9, r * .3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1A1B22'; ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; ctx.lineTo(x + Math.cos(a) * r * .38, y + Math.sin(a) * r * .38); } ctx.fill();

        const p = Math.min(1, shot.f / shot.n), tyE = line - Math.min(1.4, shot.th) * gh;

      }
      if (msgT) {
        ctx.save(); ctx.font = `700 ${Math.round(26 * k)}px Fredoka, Rubik, sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = /גול|רשת/.test(msg) ? '#FFC845' : '#fff';
        ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8; ctx.fillText(msg, W / 2, H * .55); ctx.restore();

    const cols = 6, rows = 3, gap = 6 * k, bw = (W - gap * (cols + 1)) / cols, bh = 16 * k, top = 46 * k;
    const bricks = []; for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) bricks.push({ x: gap + q * (bw + gap), y: top + r * (bh + gap), alive: true, r });
    const end = Date.now() + 40000; let broken = 0;

    const loop = () => {
      if (over) return;
      if (Date.now() > end) return finishGame(broken === bricks.length, broken * 3, `שברת ${broken} מתוך ${bricks.length} לבנים!`);
      bg(); upd();
      if (pause > 0) pause--; else { ball.x += ball.vx; ball.y += ball.vy; }
      if (ball.x < 7 * k || ball.x > W - 7 * k) { ball.vx *= -1; ball.x = Math.max(7 * k, Math.min(W - 7 * k, ball.x)); }

      if (ball.vy > 0 && ball.y + 7 * k >= py && ball.y < py + ph && Math.abs(ball.x - px) <= pw / 2 + 6) { ball.y = py - 7 * k; bounce(px, -1); tone(620, 0, .05, 'square', .04); }

      if (broken === bricks.length) return finishGame(true, broken * 3 + 30, `שברת את כל המגן של ${B.n}!`);

      bricks.forEach(b => { if (!b.alive) return; ctx.globalAlpha = 1 - b.r * .22; ctx.fillStyle = bc; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(b.x, b.y, bw, bh, 4) : ctx.rect(b.x, b.y, bw, bh); ctx.fill(); });
      ctx.globalAlpha = 1; paddle(px, py, '#8FE3FF'); drawBall(ball.x, ball.y);
      MG_RAF = requestAnimationFrame(loop);
    };
    MG_RAF = requestAnimationFrame(loop);
  }

function drawTrails() {
  app.querySelectorAll('.path').forEach(path => {

  app.querySelectorAll('[data-act="diasheet"]').forEach(b => b.onclick = openDiaSheet);
  app.querySelectorAll('[data-mood]').forEach(b => b.onclick = () => setMood(b.dataset.mood));
  on('explained', () => { if (!S.explainQ || S.explainQ.done) return; S.explainQ.done = 1; S.coins += 10; S.explainLog = (S.explainLog || []).concat(todayStr()).slice(-30); SFX.coin(); save(); render(); });
  on('duo', startDuo);
  on('duoskip', () => { S.duoSkip = todayStr(); save(); render(); });
  app.querySelectorAll('[data-guidetab]').forEach(b => b.onclick = () => startGuide(b.dataset.guidetab, 'tips'));
  app.querySelectorAll('[data-accb]').forEach(b => b.onclick = () => { const it = ACC.find(a => a[0] === b.dataset.accb); if (!it || S.coins < it[2]) return; modal(`לקנות ${it[1]}?`, `זה יעלה ${it[2]} מטבעות.`, 'לקנות', () => { S.coins -= it[2]; S.accOwn = Object.assign({}, S.accOwn, { [it[0]]: 1 }); S.accOn = Object.assign({}, S.accOn, { [it[0]]: 1 }); SFX.coin(); save(); render(); }, 'btn-gold'); });
  app.querySelectorAll('[data-accw]').forEach(b => b.onclick = () => { const k = b.dataset.accw; S.accOn = Object.assign({}, S.accOn, { [k]: !(S.accOn || {})[k] }); SFX.tap(); save(); render(); });
  const ex = app.querySelector('[data-act="exch"]'); if (ex) ex.onclick = () => { if (S.exWeek === weekKey() || S.coins < EX_PRICE || S.noEx) return; modal('להמיר מטבעות ליהלום?', `${EX_PRICE} מטבעות יהפכו ליהלום אחד. אפשר פעם בשבוע.`, 'להמיר', () => { S.coins -= EX_PRICE; S.exWeek = weekKey(); giveDia(1, 'המרה שבועית', []); SFX.coin(); save(); render(); toast('קיבלת יהלום!'); }, 'btn-gold'); };
  on('extoggle', () => { S.noEx = !S.noEx; save(); render(); });
  app.querySelectorAll('[data-road]').forEach(b => b.onclick = () => { S.ptab = 'me'; go('stats'); });
  bindBugs();
  app.querySelectorAll('[data-learn]').forEach(b => b.onclick = () => startLesson(b.dataset.learn));
  on('learnlater', () => { (S.learnQ || []).forEach(x => { if (x.at <= todayStr()) x.at = addDays(todayStr(), 1); }); save(); render(); });
  on('xtra', startXtra);
  on('xtraskip', () => { S.xtraSkip = todayStr(); save(); render(); });
}

try { const pc = localStorage.getItem('bl-pin-carry'); if (pc && !S.pin) { S.pin = pc; save(); } localStorage.removeItem('bl-pin-carry'); } catch (e) { }
(function seedRush() { if (S.rh) return; const t = Object.values(S.times || {}).reduce((a, x) => ({ s: a.s + x.s, n: a.n + x.n }), { s: 0, n: 0 }); if (t.n >= 20 && t.s / t.n < 15) S.rh = Array(10).fill(1); })();
trimMist();

if (!S.rhV17) { if ((S.rh || []).length >= 8 && rushRate() > .2) S.rh = Array(8).fill(1); S.rhV17 = 1; save(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullParent(); });

if (!S.msInit && !S.guest) { const J = journey(); S.ms = S.ms || {}; J.st.forEach((s, i) => { if (s.ok) S.ms[i] = todayStr(); }); S.msInit = 1; save(); }

if (!S.streakFix20 && S.lastDone && dayDiff(S.lastDone, todayStr()) === 2 && S.last && ['sim', 'practice', 'review'].includes(S.last.kind)) { S.freezes = Math.max(1, S.freezes || 0); }
S.streakFix20 = 1;
app.addEventListener('click', e => {
  if (Date.now() < TAP_LOCK && e.target.closest('[data-opt],[data-act="hint"],[data-act="next"],[data-act="skip"],[data-act="tcheck"],[data-act="go"]')) { e.stopPropagation(); e.preventDefault(); }
}, true);
/* old saves: a song unlock that was waiting for the result screen */
if (S.pendingSong) { if (S.last) S.last.newSong = S.pendingSong; delete S.pendingSong; }
/* the journey trail follows the nodes when the phone turns */
addEventListener('resize', () => { if (app.querySelector('.path')) drawTrails(); });

render(); guestOnboard();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
