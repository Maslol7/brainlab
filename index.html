<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>מעבדת המוח</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone game set in a night sky over four element worlds.
   Deliberately single (dark) look. The accent follows the current world; skins can override it. */
:root{
  color-scheme:dark;
  --bg0:#0A0F24; --bg1:#121A3C; --bg2:#1A2350;
  --panel:rgba(255,255,255,.065); --panel2:rgba(255,255,255,.1); --edge:rgba(255,255,255,.12); --edge2:rgba(255,255,255,.2);
  --ink:#F3F6FF; --muted:#A3AED6; --dim:#6B76A6;
  --air:#7FE3D6; --water:#53A8FF; --earth:#A6D45E; --fire:#FF7A3D; --gold:#FFC845; --violet:#A98BFF;
  --good:#46E0A0; --bad:#FF5C7A;
  --acc:#7FE3D6; --acc2:#C2F5EE; --on-acc:#0A0F24;
  --paper:#FFFBF2; --paper-ink:#2A2A33;
  --f-display:'Fredoka','Rubik','Arial Hebrew',system-ui,sans-serif;
  --f-body:'Rubik','Arial Hebrew','Segoe UI',system-ui,sans-serif;
  --r:20px;
}
:root[data-w="water"]{--acc:#53A8FF;--acc2:#B5DAFF}
:root[data-w="earth"]{--acc:#A6D45E;--acc2:#DDF2B8}
:root[data-w="fire"]{--acc:#FF7A3D;--acc2:#FFC2A1}
:root[data-w="master"]{--acc:#C9A7FF;--acc2:#EFE4FF}
:root[data-skin="anfield"]{--acc:#E8364F;--acc2:#FF9AA8;--on-acc:#fff}
:root[data-skin="holon"]{--acc:#FFD000;--acc2:#FFF0A0;--on-acc:#3B1A66}
:root[data-skin="rock"]{--acc:#D45CB4;--acc2:#F5B8E4;--on-acc:#fff}
:root[data-skin="keys"]{--acc:#E9E4D6;--acc2:#FFFFFF;--on-acc:#14161c}
:root{--acc-soft:color-mix(in srgb,var(--acc) 18%,transparent);--acc-glow:color-mix(in srgb,var(--acc) 45%,transparent)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--bg0);background-image:radial-gradient(900px 520px at 90% -8%,var(--acc-soft),transparent 70%),radial-gradient(700px 500px at -15% 35%,rgba(169,139,255,.16),transparent 70%),linear-gradient(180deg,var(--bg0),var(--bg1) 55%,var(--bg0));background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;background-image:radial-gradient(1.2px 1.2px at 22px 34px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#fff,transparent),radial-gradient(1.4px 1.4px at 70px 150px,#cfe,transparent),radial-gradient(1px 1px at 170px 20px,#fff,transparent),radial-gradient(.9px .9px at 150px 190px,#fff,transparent),radial-gradient(1px 1px at 40px 210px,#ddf,transparent);background-size:220px 230px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg0)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4,h5{margin:0;text-wrap:balance;font-family:var(--f-display);font-weight:700}
.muted{color:var(--muted)}.small{font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.glow{color:var(--acc);text-shadow:0 0 18px var(--acc-glow)}

/* panels & buttons */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:13px 20px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;min-height:54px;transition:transform .1s,box-shadow .1s;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn-primary{background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--on-acc);box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 50%,#000),0 10px 24px -8px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-primary:active:not(:disabled){box-shadow:0 2px 0 color-mix(in srgb,var(--acc) 50%,#000)}
.btn-boss{background:linear-gradient(180deg,#C9B4FF,#8A63F2);color:#120B2E;box-shadow:0 5px 0 #4B2FA3,0 10px 24px -8px rgba(138,99,242,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold{background:linear-gradient(180deg,#FFE28A,var(--gold));color:#2E2100;box-shadow:0 5px 0 #A07510,inset 0 1px 0 rgba(255,255,255,.5)}
.btn-ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--edge)}
.btn-wide{width:100%}
.btn:disabled{opacity:.45}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px 10px}
.sec-h h3{font-size:1.5rem}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;padding-block:6px 2px}
.ava-ring{--p:0;flex:none;width:60px;height:60px;border-radius:50%;padding:3px;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(255,255,255,.12) 0);box-shadow:0 0 18px var(--acc-glow)}
.ava-ring .in{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--bg2),var(--bg0));overflow:hidden;display:block;border:2px solid var(--bg0)}
.ava-ring svg{width:100%;height:100%;display:block}
.hud h1{font-size:1.7rem;line-height:1}
.hud .sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:700;font-size:.95rem;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--edge);font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}

/* hero */
.hero{position:relative;overflow:hidden;padding:18px;border-color:var(--edge2);background:linear-gradient(155deg,color-mix(in srgb,var(--acc) 22%,transparent),var(--panel) 55%)}
.hero::after{content:"";position:absolute;inset:auto -30px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--acc-soft),transparent 70%);pointer-events:none}
.hero.boss{background:linear-gradient(155deg,rgba(169,139,255,.3),var(--panel) 60%);border-color:rgba(169,139,255,.5)}
.hero .stage{display:flex;align-items:flex-end;gap:10px;position:relative;z-index:1}
.hero .who{width:124px;height:124px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 78%,var(--acc-glow),transparent 62%),radial-gradient(circle at 50% 40%,var(--acc-soft),transparent 70%);position:relative}
.hero .who svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))}
.hero h2{font-size:2.3rem;line-height:1;margin:6px 0 4px;position:relative;z-index:1}
.hero p{margin:4px 0 14px;color:var(--muted);position:relative;z-index:1}
.hero .btn{position:relative;z-index:1}
.bubble{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.08));border:1px solid var(--edge2);border-radius:18px;padding:11px 14px;font-size:.95rem;font-weight:500;line-height:1.45;margin-bottom:24px;box-shadow:0 10px 24px -14px rgba(0,0,0,.6)}
.bubble::after{content:"";position:absolute;top:100%;inset-inline-end:26px;border:9px solid transparent;border-top-color:rgba(255,255,255,.1);border-bottom:0}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:linear-gradient(120deg,rgba(255,200,69,.25),rgba(255,122,61,.18));border:1px solid rgba(255,200,69,.45);font-weight:600}
.banner svg{width:44px;height:44px;flex:none}
.banner .btn{min-height:42px;padding:8px 14px;font-size:.95rem}

/* elements strip */
.elems{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.elems .orb{padding:10px 2px}.elems .orb .ring{width:48px;height:48px}.elems .orb .ring svg{width:21px;height:21px}
.orb{--c:var(--air);--p:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--panel);border:1px solid var(--edge);text-align:center}
.orb .ring{width:56px;height:56px;border-radius:50%;padding:4px;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center}
.orb .ring span{width:100%;height:100%;border-radius:50%;background:var(--bg1);display:grid;place-items:center;color:var(--c)}
.orb .ring svg{width:24px;height:24px}
.orb.on .ring{box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.orb.locked{opacity:.45}
.orb b{font-size:.74rem;font-weight:600}
.orb small{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px 6px;text-align:center}
.stat .big{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:.72rem;color:var(--muted);margin-top:4px}
.stat svg{width:20px;height:20px;display:block;margin:0 auto 4px}
.xpbar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 12px var(--acc-glow)}

/* world map */
.world{--wc:var(--air);position:relative;border-radius:24px;border:1px solid color-mix(in srgb,var(--wc) 35%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--wc) 20%,transparent),color-mix(in srgb,var(--wc) 4%,transparent) 220px),var(--panel);overflow:hidden;box-shadow:0 18px 40px -24px color-mix(in srgb,var(--wc) 55%,transparent)}
.wbanner{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:start}
.wbanner .wi{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--wc) 22%,transparent);color:var(--wc);box-shadow:0 0 16px color-mix(in srgb,var(--wc) 35%,transparent)}
.wbanner .wi svg{width:26px;height:26px}
.wbanner b{display:block;font-family:var(--f-display);font-size:1.2rem}
.wbanner span{font-size:.78rem;color:var(--muted)}
.wbanner .chev{margin-inline-start:auto;color:var(--muted);transition:transform .2s}
.world.open .chev{transform:rotate(180deg)}
.wbar{height:8px;margin:0 16px 12px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--wc) 60%,#fff),var(--wc));box-shadow:0 0 12px var(--wc)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:14px 0 30px}
.pn{transform:translateX(var(--x));position:relative;z-index:1}
.node{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--muted);background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg1));border:2px solid color-mix(in srgb,var(--wc) 30%,var(--edge));box-shadow:0 6px 0 rgba(0,0,0,.4);position:relative;font-variant-numeric:tabular-nums;transition:transform .12s}
.node.done{background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--wc) 55%,#fff),var(--wc) 70%);color:var(--bg0);border-color:transparent;box-shadow:0 6px 0 color-mix(in srgb,var(--wc) 45%,#000),inset 0 -6px 10px rgba(0,0,0,.12)}
.node.open{width:76px;height:76px;font-size:1.45rem;background:radial-gradient(circle at 50% 28%,#fff,color-mix(in srgb,var(--wc) 50%,#fff) 75%);color:var(--bg0);border-color:transparent;box-shadow:0 7px 0 color-mix(in srgb,var(--wc) 45%,#000),0 0 0 6px color-mix(in srgb,var(--wc) 35%,transparent),0 0 34px color-mix(in srgb,var(--wc) 70%,transparent);animation:bob 1.6s ease-in-out infinite}
.node.locked{opacity:.55;background:transparent;border-style:dashed;box-shadow:none}
.node.boss{width:84px;height:84px;border-radius:26px;padding:6px}
.node.boss svg{width:100%;height:100%}
.node.boss.locked svg{filter:grayscale(1) brightness(.7)}
.node .st{position:absolute;bottom:-11px;font-size:.72rem;letter-spacing:-1px;color:var(--gold);text-shadow:0 1px 2px #000;background:var(--bg0);padding:0 5px;border-radius:99px;line-height:1.35}
.node .st i{font-style:normal;color:rgba(255,255,255,.22)}
.node .lk{position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;background:var(--bg2);border:1px solid var(--edge);display:grid;place-items:center;color:var(--muted)}
.node .lk svg{width:12px;height:12px}
.pn.now::before,.pn.now::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--wc);opacity:0;animation:ping 2.2s ease-out infinite;pointer-events:none}
.pn.now::after{animation-delay:1.1s}
@keyframes ping{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.node:not(.locked):active{transform:translateY(3px)}
svg.trail{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
.trail path{fill:none;stroke-linecap:round}
.trail .tr-all{stroke:rgba(255,255,255,.14);stroke-width:5;stroke-dasharray:2 12}
.trail .tr-done{stroke:var(--wc);stroke-width:5;opacity:.55;filter:drop-shadow(0 0 6px var(--wc))}
svg.scene{position:absolute;inset:0;width:100%;height:100%;fill:var(--wc);stroke:var(--wc);opacity:.1;pointer-events:none;z-index:0}
.hero svg.scene{opacity:.13;fill:var(--acc);stroke:var(--acc)}
.node .gift{position:absolute;top:-10px;inset-inline-end:-10px;width:30px;height:30px}
.pn .go{position:absolute;top:50%;white-space:nowrap;background:#fff;color:var(--bg0);font-weight:700;font-family:var(--f-display);font-size:.95rem;padding:6px 12px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:2;transform:translateY(-50%)}
.pn .go.go-r{left:calc(100% + 14px)}
.pn .go.go-l{right:calc(100% + 14px)}
.pn .go::after{content:"";position:absolute;top:50%;margin-top:-7px;border:7px solid transparent}
.pn .go.go-r::after{right:100%;border-right-color:#fff}
.pn .go.go-l::after{left:100%;border-left-color:#fff}
@keyframes bob{50%{transform:translateY(-4px)}}

/* badges & gear */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.badge{text-align:center;font-size:.7rem;line-height:1.25;padding:12px 6px;color:var(--muted)}
.badge svg{width:46px;height:46px;display:block;margin:0 auto 6px}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge b{display:block;font-size:.8rem;color:var(--ink);font-weight:600}
.gear{display:flex;align-items:center;gap:12px;padding:12px}
.gear .gi{width:54px;height:54px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--panel2)}
.gear .gi svg{width:38px;height:38px}
.gear.off{opacity:.5}
.gear b{display:block}
.gear span{font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.88rem;font-weight:500;padding:9px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--edge)}
.chip.hot{border-color:var(--gold);background:rgba(255,200,69,.18);color:var(--gold)}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:6px;background:var(--bg0);box-shadow:0 0 0 100vmax var(--bg0);clip-path:inset(0 -100vmax)}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--edge);flex:none}
.icon-btn svg{width:18px;height:18px}
.pdots{flex:1;display:flex;gap:3px;min-width:0}
.pdots i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.12)}
.pdots i.ok{background:var(--good);box-shadow:0 0 8px rgba(70,224,160,.5)}.pdots i.no{background:var(--bad)}.pdots i.cur{background:var(--acc);box-shadow:0 0 8px var(--acc-glow)}.pdots i.ans{background:var(--muted)}
.qmeta{display:flex;flex-direction:column;align-items:flex-end;font-size:.78rem;font-variant-numeric:tabular-nums;line-height:1.2;flex:none}
.qmeta .pts{font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--acc)}
.qmeta .tm.warn{color:var(--bad);font-weight:700}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.tag{font-size:.74rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.tag.rev{background:rgba(255,200,69,.2);color:var(--gold)}
.lvl{font-size:.72rem;color:var(--muted);display:flex;gap:3px;align-items:center}
.lvl i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15)}.lvl i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.combo{display:inline-flex;align-items:center;gap:3px;font-size:.78rem;font-weight:700;color:#2E2100;background:var(--gold);padding:3px 9px;border-radius:999px;box-shadow:0 0 12px rgba(255,200,69,.5)}
.combo svg{width:13px;height:13px}
.qprompt{font-size:1.15rem;font-weight:600;margin:0 0 14px;line-height:1.55;text-wrap:pretty}
.qvis{margin-bottom:16px;padding:14px 10px;border-radius:18px;background:rgba(0,0,0,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 0 0 1px rgba(255,255,255,.05)}
.qvis:empty{display:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(30%,120px),1fr));gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:start;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.05));border:2px solid var(--edge);border-radius:16px;padding:12px;min-height:58px;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:border-color .15s,background .15s,transform .1s,box-shadow .1s}
.opts.grid .opt{flex-direction:column;justify-content:center;padding:10px 6px 8px}
.opt .lt{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.85rem;font-weight:700;background:var(--acc-soft);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.opt .ob{min-width:0;flex:1;display:flex;justify-content:flex-start;align-items:center}
.opts.grid .opt .ob{justify-content:center;width:100%}
.opt:not([disabled]):active{border-color:var(--acc);transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.ok{border-color:var(--good);background:rgba(70,224,160,.14);box-shadow:0 4px 0 rgba(20,90,60,.6),0 0 18px rgba(70,224,160,.25)}
.opt.ok::after,.opt.no::after{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-weight:700;font-size:1.1rem}
.opt.ok::after{content:"✓";color:var(--good)}
.opt.no::after{content:"✗";color:var(--bad)}
.opts.grid .opt.ok::after,.opts.grid .opt.no::after{top:8px;transform:none}
.opt.ok .lt{background:var(--good);color:var(--bg0)}
.opt.no{border-color:var(--bad);background:rgba(255,92,122,.12);animation:shake .35s}
.opt.no .lt{background:var(--bad);color:var(--bg0)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:14px;border-radius:16px;padding:14px;border:1px solid var(--edge)}
.fb.ok{background:rgba(70,224,160,.1);border-color:rgba(70,224,160,.5)}
.fb.no{background:rgba(255,92,122,.1);border-color:rgba(255,92,122,.5)}
.fb h4{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:1.2rem;margin-bottom:4px}
.fb .fbi{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:var(--good);color:var(--bg0)}
.fb.no .fbi{background:var(--gold);color:#2E2100}
.fb .fbi svg{width:17px;height:17px}
.fb .tchip{margin-inline-start:auto}
.fb p{margin:0;font-size:.95rem}
.fb .why{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted);display:block;margin-top:8px}
.hintbox,.retry{display:flex;gap:10px;align-items:flex-start;margin-top:12px;background:linear-gradient(120deg,rgba(255,200,69,.16),rgba(255,200,69,.08));border:1px solid rgba(255,200,69,.5);border-radius:16px;padding:12px 14px;font-size:.95rem;line-height:1.55;animation:rin .3s ease}
.hintbox .hi,.retry .hi{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,200,69,.22);color:var(--gold)}
.hintbox .hi svg,.retry .hi svg{width:20px;height:20px}
.hintbox b{color:var(--gold);font-family:var(--f-display)}
.hintbox p{margin:2px 0 0}
.floater{position:fixed;z-index:40;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--good);text-shadow:0 0 12px rgba(70,224,160,.7);animation:float 1s ease-out forwards}
@keyframes float{to{transform:translateY(-70px) scale(1.2);opacity:0}}
.qfoot{position:fixed;inset:auto 0 0 0;z-index:6;background:linear-gradient(0deg,var(--bg0) 70%,transparent);padding-top:14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qfoot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.qfoot .btn{flex:1}
.btn-hint svg{width:20px;height:20px;color:var(--gold)}
.btn-hint:disabled svg{color:inherit}

/* battle */
.battle{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;margin-bottom:12px;padding:14px 12px 12px;border-radius:22px;background:radial-gradient(120% 90% at 75% 20%,color-mix(in srgb,var(--bc,#A98BFF) 35%,transparent),transparent 70%),radial-gradient(100% 80% at 20% 30%,var(--acc-soft),transparent 70%),var(--panel);border:1px solid var(--edge);overflow:hidden}
.fighter{text-align:center;min-width:0}
.fighter .pic{width:84px;height:84px;margin:0 auto 6px;display:block}
.fighter .pic svg{width:100%;height:100%;display:block}
.fighter b{display:block;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{height:10px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:4px;border:1px solid var(--edge)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#2BC48A,var(--good));transition:width .4s}
.hp.bhp i{background:linear-gradient(90deg,#E23A5C,var(--bad))}
.vs{font-family:var(--f-display);font-size:1.9rem;font-weight:700;color:var(--gold);text-shadow:0 0 14px rgba(255,200,69,.6);align-self:center}
.hit{animation:hit .5s}
@keyframes hit{20%{transform:translateX(-8px) rotate(-6deg);filter:brightness(2)}50%{transform:translateX(8px) rotate(5deg)}80%{transform:translateX(-3px)}}

/* question visuals: light "paper" inserts keep diagrams crisp */
.analogy{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:16px 8px;background:var(--panel);border:1px dashed var(--edge2);border-radius:16px}
.analogy .w{font-weight:600;font-size:1.06rem;padding:5px 11px;border-radius:10px;background:var(--panel2)}
.analogy .w.q{background:var(--acc);color:var(--on-acc);min-width:42px;text-align:center}
.analogy .sep{font-weight:700;color:var(--muted)}
.analogy .like{font-size:.85rem;color:var(--muted);padding:0 6px}
.sentence{font-size:1.08rem;line-height:1.9;padding:14px;background:var(--panel);border:1px dashed var(--edge2);border-radius:16px}
.sentence .gap{display:inline-block;min-width:54px;text-align:center;background:var(--acc);color:var(--on-acc);border-radius:7px;font-weight:700}
.passage{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:14px 16px;max-height:46vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.passage h5{font-size:1.05rem;margin-bottom:6px;color:#1b1f3a}
.passage p{margin:0;font-size:.96rem;line-height:1.75}
.series{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:3px;overflow-x:auto;padding:4px 2px}
.series .cell{flex:1 1 0;min-width:0;max-width:62px;padding:10px 2px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(.92rem,4.6vw,1.3rem);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07));border:1px solid var(--edge2);border-radius:12px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.series .cell.q{background:var(--acc);border-color:var(--acc);color:var(--on-acc);box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 50%,#000),0 0 16px var(--acc-glow);animation:qpulse 1.8s ease-in-out infinite}
@keyframes qpulse{50%{box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 50%,#000),0 0 26px var(--acc-glow)}}
.series .arr{flex:none;color:var(--dim);font-size:.7rem}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);max-width:270px;margin:0 auto;border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mbox{aspect-ratio:1;border:1px solid #E3DFD3;display:grid;place-items:center;color:#22253A}
.mbox.q{background:var(--acc);color:var(--on-acc);font-family:var(--f-display);font-size:2.4rem;font-weight:700}
.mcell{width:100%;max-width:80px;height:auto;display:block;color:#22253A}
.opts.grid .opt .mcell{max-width:76px;color:#22253A;background:var(--paper);border-radius:12px;padding:4px}
.rev .item .a .mcell{background:var(--paper);border-radius:8px;color:#22253A}
.polybig{display:flex;justify-content:center}
.polybig .poly{width:130px}
.poly{width:84px;max-width:100%;height:auto;display:block}
.poly .pc{fill:var(--acc);stroke:var(--bg0);stroke-width:2}
.polybig .pc{fill:var(--ink)}
.netwrap,.cubewrap{display:flex;justify-content:center}
.net{width:100%;height:auto}
.net .nc{fill:var(--panel2);stroke:var(--ink);stroke-width:2}
.net .nc.hl{fill:var(--acc)}
.net .nt{font-size:24px;fill:var(--ink);font-family:system-ui,sans-serif}
.net .nt.hl{fill:var(--on-acc)}
.cubes{width:100%;max-width:240px;height:auto}
.cu-t{fill:#E9EEFF}.cu-l{fill:#93A7E6}.cu-r{fill:#5B73C4}
.cubes polygon{stroke:#0A0F24;stroke-width:1.2;stroke-linejoin:round}
.sym{font-size:1.6rem;line-height:1;font-family:system-ui,sans-serif}
.eqs{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;background:var(--panel);border:1px dashed var(--edge2);border-radius:16px}
.eq{font-family:var(--f-display);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.clues{margin:0;padding:12px 14px;padding-inline-start:30px;background:var(--panel);border:1px dashed var(--edge2);border-radius:16px;display:flex;flex-direction:column;gap:4px}

/* results */
.res-hero{text-align:center;padding:24px 16px;background:radial-gradient(80% 60% at 50% 20%,var(--acc-soft),transparent 70%),var(--panel)}
.res-hero .who{width:110px;height:110px;margin:0 auto 4px}
.res-hero .who svg{width:100%;height:100%}
.stars{display:flex;justify-content:center;gap:8px;margin-bottom:4px}
.stars svg{width:52px;height:52px}
.stars .on{color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,200,69,.7))}.stars .offs{color:rgba(255,255,255,.14)}
.stars .mid svg{width:64px;height:64px;margin-top:-10px}
.stars svg.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.res-hero .score{font-family:var(--f-display);font-size:3.6rem;font-weight:700;line-height:1}
.gains{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.gain{font-family:var(--f-display);font-weight:700;padding:5px 14px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.gain.c{background:rgba(255,200,69,.18);color:var(--gold)}
.chest{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:start}
.chest svg{width:74px;height:74px;flex:none}
.chest.open svg{animation:pop .5s}
.rev{display:flex;flex-direction:column;gap:10px}
.rev .item{padding:12px 14px}
.rev .item .q{font-weight:500;margin-bottom:6px;font-size:.95rem}
.rev .item .a{font-size:.88rem}
.rev .item .a .mcell,.rev .item .a .poly{width:48px;display:inline-block;vertical-align:middle}
.rev .item .e{font-size:.85rem;color:var(--muted);margin-top:6px}
.newb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-color:rgba(255,200,69,.5)}
.newb svg{width:42px;height:42px;flex:none}

/* arcade */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{--tc:var(--acc);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 14px;min-height:150px;border-radius:22px;text-align:start;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 35%,transparent),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.tile .ti{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 30%,transparent);color:var(--tc);flex:none}
.tile .ti svg{width:30px;height:30px}
.tile h4{font-size:1.15rem}
.tile p{margin:0;font-size:.8rem;color:var(--muted)}
.tile .best{margin-top:auto;font-family:var(--f-display);font-weight:700;font-size:.9rem;color:var(--tc)}
.tile:disabled{opacity:.5}
.sprint-q{font-family:var(--f-display);font-size:3.8rem;font-weight:700;text-align:center;line-height:1;padding:16px 0 6px;font-variant-numeric:tabular-nums;text-shadow:0 0 22px var(--acc-glow)}
.sprint-in{text-align:center;font-family:var(--f-display);font-size:2.2rem;font-weight:700;min-height:56px;border-bottom:3px solid var(--edge2);margin:0 auto 14px;max-width:220px;font-variant-numeric:tabular-nums}
.sprint-in.bad{color:var(--bad);animation:shake .3s}
.tbar{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s linear}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{min-height:60px;border-radius:16px;background:var(--panel2);border:1px solid var(--edge);font-family:var(--f-display);font-size:1.6rem;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.keypad button:active{transform:translateY(3px);box-shadow:none}
.keypad .k-alt{font-size:1rem;color:var(--muted)}
.receipt{background:var(--paper);color:var(--paper-ink);border-radius:12px 12px 0 0;padding:14px 16px 18px;font-variant-numeric:tabular-nums;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.35);margin-bottom:14px;-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 8px 100%,#0000 98%,#000) bottom/16px 8px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 8px 100%,#0000 98%,#000) bottom/16px 8px repeat-x}
.receipt h5{text-align:center;font-size:1rem;letter-spacing:.08em;margin-bottom:8px;color:#1b1f3a}
.receipt .ln{display:flex;justify-content:space-between;border-bottom:1px dashed #cfc8b5;padding:4px 0;font-size:1rem}
.receipt .ask{margin-top:10px;font-weight:700;text-align:center;font-size:1.05rem;color:#B5273D}
.piano{position:relative;display:flex;gap:4px;height:200px;direction:ltr}
.piano button{flex:1;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#F4F4F7,#FFFFFF);border:2px solid #0A0F24;color:#556;font-weight:700;font-size:.8rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;transition:background .1s,box-shadow .1s}
.piano button.lit{background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--on-acc);box-shadow:0 0 24px var(--acc-glow)}
.piano button.wrong{background:var(--bad);color:#fff}
.piano .bk{position:absolute;top:0;width:8%;height:58%;background:linear-gradient(180deg,#2a2f45,#0A0F24);border-radius:0 0 6px 6px;pointer-events:none}
.bigscore{font-family:var(--f-display);font-size:3.6rem;font-weight:700;line-height:1;text-align:center;text-shadow:0 0 22px var(--acc-glow)}
.mark{color:var(--gold)}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;text-align:center}
.item b{font-size:.92rem}
.item .btn{min-height:40px;padding:6px 12px;font-size:.92rem;width:100%}
.item.eq{border-color:var(--acc);box-shadow:0 0 18px var(--acc-glow)}
.sw{display:flex;width:76px;height:76px;border-radius:50%;overflow:hidden;border:3px solid var(--edge2)}
.sw i{flex:1}

/* profile */
.me-hero{text-align:center;padding:22px 16px}
.me-hero .big{width:170px;height:170px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--acc-soft),transparent 70%)}
.me-hero .big svg{width:100%;height:100%}
.me-hero h2{font-size:2.4rem;margin-top:6px}

/* stats */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .rw{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:5px;gap:8px}
.bar .rw span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);text-align:end}
.bar .track{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar.weak .track i{background:var(--bad)}
.spark{width:100%;height:auto;display:block}
.spark .b{fill:var(--acc)}.spark .b.boss{fill:var(--violet)}.spark .gl{stroke:rgba(255,255,255,.12);stroke-width:1}
.spark text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.tip h4{margin-bottom:6px;font-size:1.15rem}
.tip p{margin:0;font-size:.95rem;color:#D6DCF5}
.tip ol,.tip ul{margin:6px 0 0;padding-inline-start:20px;font-size:.95rem;color:#D6DCF5}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.field input{padding:9px 11px;border-radius:12px;border:1px solid var(--edge);background:var(--bg1);color:var(--ink)}
.toggle{width:54px;height:30px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.toggle.on{background:var(--acc)}.toggle.on::after{inset-inline-start:27px}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:6;background:rgba(10,15,36,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:.7rem;color:var(--dim);position:relative}
.nav button svg{width:25px;height:25px}
.nav button.on{color:var(--acc);font-weight:700}
.nav button.on svg{filter:drop-shadow(0 0 8px var(--acc-glow))}
.nav .dot{position:absolute;top:6px;inset-inline-end:calc(50% - 19px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}

/* jokes & diamonds */
.joke{border-color:rgba(255,200,69,.4);background:linear-gradient(150deg,rgba(255,200,69,.14),var(--panel) 60%)}
.joke .jq{font-family:var(--f-display);font-size:1.25rem;font-weight:600;margin:6px 0 10px;line-height:1.35}
.joke .ja{font-size:1.1rem;font-weight:600;color:var(--gold);margin:4px 0 0;animation:pop .4s}
.jokes details{border-bottom:1px solid var(--edge);padding:10px 2px}
.jokes details:last-child{border-bottom:0}
.jokes summary{cursor:pointer;font-weight:500;list-style-position:inside}
.jokes details p{margin:6px 0 0;color:var(--gold);font-weight:600}
.dia-box{border-color:rgba(143,227,255,.45);background:linear-gradient(155deg,rgba(143,227,255,.16),rgba(169,139,255,.12) 50%,var(--panel))}
.dia-head{display:flex;align-items:center;gap:12px}
.dia-n{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1;color:#BFF0FF;text-shadow:0 0 18px rgba(143,227,255,.6)}
.reward{padding:12px 14px}
details summary{cursor:pointer}
.pin,.txt{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--bg1);color:var(--ink);min-width:0}
.pin{font-size:1.4rem;letter-spacing:.4em;text-align:center}
.pills .pill{padding:6px 8px}

/* v5: intro, typed, pace, new visuals */
.intro-card{text-align:center;padding:26px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb,var(--wc,var(--acc)) 30%,transparent),transparent 70%),var(--panel)}
.intro-card.boss{background:radial-gradient(90% 60% at 50% 0%,rgba(169,139,255,.35),transparent 70%),var(--panel)}
.intro-card.champ{background:radial-gradient(90% 60% at 50% 0%,rgba(255,200,69,.3),transparent 70%),var(--panel);border-color:rgba(255,200,69,.5)}
.intro-card .ii{width:96px;height:96px;display:grid;place-items:center;border-radius:28px;color:var(--wc,var(--acc));background:color-mix(in srgb,var(--wc,var(--acc)) 18%,transparent)}
.intro-card.champ .ii{color:var(--gold);background:rgba(255,200,69,.18)}
.intro-card .ii svg{width:62px;height:62px}
.intro-card.boss .ii{width:130px;height:130px;background:none}.intro-card.boss .ii svg{width:130px;height:130px}
.intro-card h2{font-size:2.1rem;line-height:1.05}
.intro-card .brief{margin:0;font-size:1.05rem;line-height:1.6}
.intro-card .mod{font-size:.88rem;color:var(--muted);background:var(--panel2);border:1px solid var(--edge);border-radius:14px;padding:10px 12px;width:100%;line-height:1.6}
.intro-card .btn{margin-top:2px}
.champq{border-color:rgba(255,200,69,.6);box-shadow:0 0 24px rgba(255,200,69,.18)}
.pace{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:-4px 0 12px}
.pace i{display:block;height:100%;width:0;border-radius:9px;background:var(--acc);animation:pace 60s linear forwards,paceC 60s steps(1,end) forwards}
.pace.blitz i{background:var(--gold)}
@keyframes pace{to{width:100%}}
@keyframes paceC{0%{opacity:.55}80%{opacity:.9}}
.tchip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--muted);vertical-align:middle;margin-inline-start:6px}
.tchip.ok{color:var(--good)}
.chbar{font-size:.85rem;color:var(--muted);margin:0 2px 10px}.chbar b{color:var(--acc)}
.typed .tin-row{display:flex;align-items:baseline;justify-content:center;gap:8px}
.typed .sprint-in{margin-bottom:12px;min-width:140px}
.typed .unit{color:var(--muted);font-size:1.1rem}
.typed .keypad button{min-height:52px}
.typed-res{font-size:1.15rem;padding:14px;border-radius:16px;text-align:center;border:2px solid var(--edge)}
.typed-res.ok{border-color:var(--good);background:rgba(70,224,160,.12)}.typed-res.no{border-color:var(--bad);background:rgba(255,92,122,.1)}
.lang{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--paper);color:var(--paper-ink);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lang .lr{display:flex;align-items:center;gap:10px;font-size:1.08rem;flex-wrap:wrap}
.lang .lr b{font-family:var(--f-display);color:#5B2AB5;letter-spacing:.04em;min-width:110px}
.lang .lr span:nth-child(2){color:#999}
.story{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:14px 16px;font-size:1.04rem;line-height:1.75;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.story .dots{color:#B5273D;font-weight:700;margin-inline-start:4px}
.fan,.sseries{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:nowrap}
.fbox{flex:none;width:56px;height:56px;border-radius:12px;background:var(--paper);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.fbox .mcell{width:48px;color:#22253A}
.fbox.q{background:var(--acc);color:var(--on-acc);font-family:var(--f-display);font-size:2rem;font-weight:700}
.fan .ar,.sseries .ar{color:var(--dim);font-size:.65rem}
.fan .like{color:var(--muted);font-size:.78rem;padding:0 3px}
.sseries .fbox{width:47px;height:47px;border-radius:10px}.sseries .fbox .mcell{width:41px}
.sseries .fbox.q{font-size:1.6rem}
.ntab-wrap{display:flex;justify-content:center}
.ntab{border-collapse:separate;border-spacing:6px;font-family:var(--f-display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.ntab td{width:60px;height:52px;text-align:center;background:var(--panel2);border:1px solid var(--edge);border-radius:12px}
.ntab td.res{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.ntab td.q{background:var(--acc);color:var(--on-acc)}
.ringwrap{display:flex;justify-content:center}.ring{width:190px;height:190px;color:var(--ink)}
.ring .rc{fill:var(--bg2);stroke:var(--edge2);stroke-width:1.5}.ring .rq{fill:var(--acc)}
.ring .rt{fill:var(--ink);font-family:var(--f-display);font-size:16px;font-weight:700}.ring .rqt{fill:var(--on-acc);font-family:var(--f-display);font-size:16px;font-weight:700}
.seats{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.seat{width:44px;height:44px;border-radius:12px 12px 6px 6px;background:var(--panel2);border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--f-display);color:var(--muted)}
.gauge .gz{display:flex;font-size:.7rem;color:var(--muted);margin-bottom:4px}.gauge .gz span{text-align:center}
.gauge .gt{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.12) 0 55%,rgba(255,200,69,.25) 55% 75%,rgba(169,139,255,.35) 75%);overflow:visible}
.gauge .gt i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--gold));opacity:.85}
.gauge .gt b{position:absolute;top:-30px;font-family:var(--f-display);font-size:1rem;background:var(--bg2);border:1px solid var(--edge);border-radius:8px;padding:0 6px}
.gauge{direction:ltr}

/* dad sandbox */
#sbxbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 4px) 12px 4px;background:repeating-linear-gradient(-45deg,#FFC845 0 14px,#F5B820 14px 28px);color:#2E2100;font:600 .78rem var(--f-body)}
#sbxbar button{background:#2E2100;color:#FFC845;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.75rem}
html.sbx #app{padding-top:38px}
html.sbx .qbar{top:calc(env(safe-area-inset-top,0px) + 28px)}
.sbx-tools{border-color:rgba(255,200,69,.6);background:repeating-linear-gradient(-45deg,rgba(255,200,69,.06) 0 14px,transparent 14px 28px),var(--panel)}

/* update banner & toast */
#updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:99px;background:var(--bg2);border:1px solid var(--acc);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 18px var(--acc-glow);font-weight:600;font-size:.88rem;white-space:nowrap;direction:rtl}
#updbar button{background:var(--acc);color:var(--on-acc);border-radius:99px;padding:7px 14px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:#F3F6FF;color:#0A0F24;font-weight:600;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* v8: rules & cloud */
.fb .rule,.rev .rule{display:flex;gap:8px;align-items:baseline;margin:8px 0 6px;font-weight:500;line-height:1.5}
.rt{flex:none;font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.fb .sol summary{cursor:pointer;font-size:.82rem;color:var(--muted);margin-top:2px}
.fb .sol p,.fb .solx{margin:6px 0 0;font-size:.92rem;color:#D6DCF5}
.fb .mnote{margin:8px 0 0;font-size:.75rem;color:var(--muted)}
.rev details.item summary{cursor:pointer;font-weight:500;font-size:.92rem;line-height:1.5}
.rev details.item[open] summary{margin-bottom:8px}
.rev .tag{margin-inline-end:4px}
.rules{display:flex;flex-direction:column;gap:0;padding:6px 14px}
.rules .rl{display:flex;flex-direction:column;padding:9px 0;border-bottom:1px solid var(--edge)}
.rules .rl:last-child{border-bottom:0}
.rules .rl b{font-size:.8rem;color:var(--acc)}
.rules .rl span{font-size:.92rem}
.dot-st{width:10px;height:10px;border-radius:50%;flex:none;background:var(--good);box-shadow:0 0 8px var(--good)}
.dot-st.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}

/* v9: path, tabs, ordering */
.today{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:-4px}
.tchk{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--muted)}
.tchk.ok{color:var(--good);border-color:rgba(70,224,160,.4)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini>div{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:10px 6px 9px;text-align:center}
.mini b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.mini span{font-size:.7rem;color:var(--muted)}
.mini .mi{display:block;width:18px;height:18px;margin:0 auto 3px;color:var(--acc);opacity:.85}
.mini .mi svg{width:100%;height:100%;display:block}
.mini .mi.fl{color:inherit}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--edge)}
.seg button{padding:9px 0;border-radius:10px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.nav.four .in{grid-template-columns:repeat(4,1fr)}
.node.simn{border-radius:18px;color:var(--violet);border-color:rgba(169,139,255,.5)}
.node.simn svg{width:28px;height:28px}
.node.simn.done{background:linear-gradient(180deg,#D9C9FF,#A98BFF);color:var(--bg0)}
.tipd{border-bottom:1px solid var(--edge);padding:8px 0}.tipd:last-child{border-bottom:0}
.tipd summary{cursor:pointer;font-weight:600}.tipd p{margin:6px 0 0}
.ord-slots{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ord-slot{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 10px;border-radius:12px;border:2px dashed var(--edge2);text-align:start;font-size:.95rem}
.ord-slot b{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.78rem;background:var(--panel2);color:var(--acc)}
.ord-slot.full{border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.ord-pool{display:flex;flex-direction:column;gap:6px}
.ord-item{padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--edge);text-align:start;font-size:.95rem}
.ord-res{display:flex;flex-direction:column;gap:6px}
.ord-res .ord-slot{border-style:solid}
.ord-res .ord-slot.ok{border-color:var(--good);background:rgba(70,224,160,.1)}
.ord-res .ord-slot.no{border-color:var(--bad);background:rgba(255,92,122,.08)}
#sbxbar button+button{margin-inline-start:-4px}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,20,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
.modal .card{max-width:360px;width:100%;background:var(--bg2)}
.modal h4{margin:0 0 6px;font-size:1.25rem}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal .rw{display:flex;gap:10px}.modal .rw .btn{flex:1}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero h2{font-size:2rem}.hero .who{width:96px;height:96px}.stat .big{font-size:1.7rem}.hud h1{font-size:1.45rem}.pill{padding:5px 8px;font-size:.85rem}.tile{min-height:136px}}
/* v10 */
.fb.no{background:rgba(255,200,69,.09);border-color:rgba(255,200,69,.45)}
.retry{background:linear-gradient(120deg,rgba(255,200,69,.2),rgba(255,138,61,.1))}
@keyframes rin{from{opacity:0;transform:translateY(6px)}}
.retry b{color:var(--gold)}
.retry .rh{display:block;margin-top:6px;font-weight:500;color:var(--ink)}
.opt.gone{opacity:.32;text-decoration:line-through;pointer-events:none}
.mgbox,.mbox[dir="ltr"]{aspect-ratio:auto;display:flex;flex-direction:column;gap:6px;align-items:center;margin:4px auto 2px;padding:10px 14px;background:var(--panel);border:1px solid var(--edge);border-radius:16px;width:max-content;max-width:100%}
.mrow{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.mrow b{min-width:38px;text-align:center;font-size:1.15rem;font-weight:800}
.mrow i{font-style:normal;color:var(--muted)}
.mrow .mb{display:inline-grid;place-items:center;width:46px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7B5CFF,#53A8FF);color:#fff;font-weight:800;box-shadow:0 0 14px rgba(123,92,255,.45)}
.mrow:last-child b{color:var(--gold)}
.prem{background:var(--panel);border:1px dashed var(--edge2);border-radius:16px;padding:10px 14px}
.prem p{margin:3px 0;font-weight:600;line-height:1.5}
.ctx{margin:0 0 8px;color:var(--muted);font-size:.92rem}
/* v11 */
.praise{display:flex;gap:8px;align-items:center;margin:8px 0 2px;padding:8px 12px;border-radius:12px;background:linear-gradient(120deg,rgba(255,200,69,.22),rgba(255,138,61,.12));border:1px solid rgba(255,200,69,.55);font-weight:700;font-size:.92rem;animation:rin .35s ease}
.praise svg,.imp svg{width:18px;height:18px;flex:none;color:var(--gold)}
.imp{border-color:rgba(255,200,69,.5)}
.imp .row{gap:8px;padding:4px 0;font-weight:600;align-items:flex-start}
.imp .row svg{margin-top:3px}
.love{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 14px;border-radius:14px;background:rgba(255,122,168,.1);border:1px solid rgba(255,122,168,.35);font-weight:600;font-size:.95rem;color:#FFD3E2}
.love svg{width:20px;height:20px;flex:none}
.friend{gap:12px;align-items:center}
.friend .fi{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--acc-soft);color:var(--acc)}
.friend .fi svg{width:22px;height:22px}
/* v12 piano corner */
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.song{display:flex;align-items:center;gap:12px;text-align:start;width:100%;padding:12px 14px;color:inherit;font:inherit;cursor:pointer}
.song .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.song .grow span{font-size:.82rem;color:var(--muted)}
.song .sn{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:rgba(255,122,168,.15);color:#FF9BBE;font-weight:800}
.song .sn svg{width:18px;height:18px}
.song .sc{font-size:.78rem;color:var(--muted);white-space:nowrap;font-weight:700}
.song.locked{opacity:.5;cursor:default}
.howto summary{cursor:pointer}
.howto p{margin:8px 0 0;font-size:.92rem;line-height:1.6}
.kbwrap{background:#0B1030;border:1px solid var(--edge);border-radius:14px;padding:10px}
.kb{width:100%;height:92px;display:block}
.kb .wk{fill:#F4F6FF;stroke:#1A2150;stroke-width:.6}
.kb .bk{fill:#141936}
.kb .wk.r{fill:#FFD66B}.kb .bk.r{fill:#E3A817}
.kb .wk.l{fill:#8CC8FF}.kb .bk.l{fill:#2F86E0}
.kb .dot{fill:#1A2150;opacity:.55}
.kbl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.9rem;gap:10px}
.kbl b{font-size:1.4rem;font-family:var(--f-display)}
.kbl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline:4px 4px;vertical-align:middle}
.kbl i.l{background:#8CC8FF}.kbl i.r{background:#FFD66B}
.sec .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.ch{min-width:52px;height:44px;border-radius:12px;border:1px solid var(--edge2);background:var(--panel);color:var(--ink);font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.ch.sel{border-color:#FFD66B;box-shadow:0 0 0 2px rgba(255,214,107,.35) inset}
.ch.beat{background:linear-gradient(135deg,#FF7AA8,#A98BFF);color:#fff;border-color:transparent;transform:scale(1.06)}
.tempo{gap:8px;align-items:center}
.twin{margin:0;color:#FF9BBE}
.newtag{display:inline-block;font-size:.66rem;padding:2px 7px;border-radius:99px;background:#FF7AA8;color:#fff;vertical-align:middle;margin-inline-start:6px}
.songban{width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border-color:rgba(255,122,168,.55)!important;background:linear-gradient(120deg,rgba(255,122,168,.22),rgba(169,139,255,.18))!important}
.songban svg{width:36px;height:36px;flex:none;color:#FF9BBE}
/* v14 */
.diagoal{display:flex;gap:10px;align-items:center;width:100%;text-align:start;font:inherit;color:var(--ink);cursor:pointer;margin:10px 0;padding:10px 14px;border-radius:14px;background:linear-gradient(120deg,rgba(143,227,255,.16),rgba(169,139,255,.14));border:1px solid rgba(143,227,255,.45);font-weight:600;font-size:.92rem}
.diagoal svg{width:24px;height:24px;flex:none}
.diagoal.near{border-color:rgba(255,200,69,.55);background:rgba(255,200,69,.12)}
.ways{display:flex;flex-direction:column;gap:8px}
.way{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--edge)}
.way .wd svg{width:20px;height:20px;margin-top:2px}
.way .grow{display:flex;flex-direction:column;gap:2px}
.way span{font-size:.86rem;color:var(--muted)}
.way em{font-style:normal;font-size:.8rem;color:#8FE3FF;font-weight:700}
.report .verdict{font-weight:800;font-size:1.1rem;padding:8px 12px;border-radius:12px}
.report .verdict.ok{background:rgba(70,224,160,.14);color:#7CF0BF}
.report .verdict.mid{background:rgba(255,200,69,.14);color:#FFD66B}
.report .verdict.bad{background:rgba(255,92,122,.14);color:#FF9AAE}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rgrid div{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rgrid b{font-size:1.1rem}
.rgrid span{font-size:.72rem;color:var(--muted);line-height:1.3}
.days14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;direction:ltr}
.days14 i{height:14px;border-radius:4px;background:rgba(255,255,255,.08)}
.days14 i.on{background:#46E0A0}
.recs p{margin:4px 0 0;font-size:.9rem;line-height:1.5}
/* v15 */
.nudge{display:flex;gap:10px;align-items:center;margin:10px 0 0;padding:10px 14px;border-radius:14px;background:rgba(83,168,255,.14);border:1px solid rgba(83,168,255,.5);font-weight:600;font-size:.95rem;animation:shake .4s ease}
.nudge b{font-size:1.2rem}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.thinkbar{position:relative;margin:10px 0 0;padding:9px 12px 12px;border-radius:12px;background:rgba(169,139,255,.12);border:1px solid rgba(169,139,255,.4);font-size:.88rem;font-weight:600;overflow:hidden}
.thinkbar i{position:absolute;inset-inline-start:0;bottom:0;height:3px;width:100%;background:#A98BFF;transform-origin:right;animation:thinkfill linear forwards}
[dir="ltr"] .thinkbar i{transform-origin:left}
@keyframes thinkfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.think{opacity:.45;filter:blur(1.5px);transition:opacity .3s,filter .3s;pointer-events:none}
.rgrid div.warn{border-color:rgba(255,200,69,.6);background:rgba(255,200,69,.1)}
/* v16 */
.checkin{border-color:rgba(169,139,255,.5)}
.explain{border-color:rgba(70,224,160,.45)}
.commit{margin-top:8px;display:inline-block;background:rgba(169,139,255,.25);border-color:#A98BFF;font-weight:700}
.duo{margin:8px 0 0;padding:8px 12px;border-radius:12px;background:rgba(255,122,168,.12);border:1px solid rgba(255,122,168,.4);font-size:.88rem;font-weight:600}
.duohero{background:linear-gradient(155deg,rgba(255,122,168,.25),var(--panel) 60%)}
.offer h2{margin:6px 0}
.bcirc{width:150px;height:150px;margin:18px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(143,227,255,.45),rgba(83,168,255,.12));box-shadow:0 0 40px rgba(143,227,255,.35);transform:scale(.8);transition:transform 4s ease-in-out}
.bcirc .ii{width:60px;height:60px;color:#8FE3FF}
.court{position:relative;width:100%;align-self:stretch;box-sizing:border-box;height:170px;margin:12px 0;border-radius:16px;background:linear-gradient(#1B2350,#0E1433);overflow:hidden;border:1px solid var(--edge)}
.hoop{position:absolute;top:56px;left:50%;width:70px;height:12px;margin-left:-35px;border:4px solid #FF8A3D;border-top:none;border-radius:0 0 30px 30px}
.hoop:before{content:"";position:absolute;left:50%;top:-40px;width:96px;height:42px;margin-left:-48px;border:3px solid rgba(255,255,255,.6);border-radius:4px;border-bottom:none}
.ballrow{position:absolute;bottom:18px;left:0;right:0;height:40px;direction:ltr}
.ball{position:absolute;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFB067,#E06A1B);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);transition:transform .35s ease-out}
.ball.in{transform:translateY(-78px) scale(.7)}
.ball.miss{transform:translateY(-55px) translateX(30px) scale(.8)}
.hstat{font-weight:700;margin-bottom:6px}
.banner.calm{border-color:rgba(255,200,69,.45)}
.rmore{display:flex;flex-direction:column;gap:3px;padding-top:6px;border-top:1px solid var(--edge)}
/* v17 */
.dadban{width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border-color:rgba(83,168,255,.55)!important}
.dadban svg{width:36px;height:36px;color:#8CC8FF}
/* v19 */
.twin2 p{margin:4px 0}
.guide .gvis{margin:8px 0}
.gvis.focus .mbox:not(.hl),.gvis.focus .fbox:not(.hl){opacity:.3;transition:opacity .3s}
.gvis .mbox.hl{box-shadow:inset 0 0 0 3px #FFB020;background:#FFF5D6}
.gvis .fbox.hl{box-shadow:0 0 0 3px #FFB020;border-radius:10px}
.gstep{margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(83,168,255,.12);border:1px solid rgba(83,168,255,.4);line-height:1.6;font-size:.98rem}
.gans{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.gans span{padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--edge2)}
.gask{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.garow{display:flex;align-items:center;gap:8px}
.garow b{min-width:52px}
.chip.ok{background:rgba(70,224,160,.2);border-color:#46E0A0;color:#7CF0BF}
.chip.no{background:rgba(255,200,69,.15);border-color:#FFC845}
.gopts .opt{position:relative;cursor:default}
.gopts .opt.gx{opacity:.45}
.gopts .opt.gx:after{content:"";position:absolute;inset:18% 18%;background:linear-gradient(45deg,transparent 46%,#FF5C7A 46%,#FF5C7A 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#FF5C7A 46%,#FF5C7A 54%,transparent 54%);pointer-events:none}
.gwhy{position:absolute;bottom:4px;left:4px;right:4px;font-size:.66rem;text-align:center;color:#FFD3DC;background:rgba(10,15,36,.8);border-radius:6px;padding:1px 2px;z-index:1}
.gfirst{margin:4px 0 10px;padding:12px 14px;border-radius:14px;background:rgba(255,200,69,.12);border:1px solid rgba(255,200,69,.45);display:flex;flex-direction:column;gap:2px}
.gfirst span{font-size:.88rem;color:var(--muted)}
.gbtn{margin-inline-start:auto;font-size:.78rem;padding:5px 10px}
.acc .accp{width:52px;height:52px;flex:none;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05)}
.acc .accp svg{width:100%;height:100%}
.exch{border-color:rgba(143,227,255,.45)}
.exch svg{flex:none}
/* v20 */
.gvis.focus .eq:not(.hl),.gvis.focus .clues li:not(.hl),.gvis.focus .mrow:not(.hl),.gvis.focus .prem p:not(.hl){opacity:.35;transition:opacity .3s}
.gvis .eq.hl,.gvis .clues li.hl,.gvis .mrow.hl,.gvis .prem p.hl,.gvis .seats.hl{background:rgba(255,176,32,.16);box-shadow:0 0 0 2px #FFB020;border-radius:8px}
.road.mini{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border-color:rgba(255,200,69,.45)}
.road.mini .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.road .chev{width:18px;height:18px;opacity:.6;transform:scaleX(-1)}
.rsteps{display:flex;flex-direction:column-reverse;gap:3px}
.rsteps i{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.12)}
.rsteps i.ok{background:#46E0A0}.rsteps i.cur{background:#FFC845;box-shadow:0 0 8px #FFC845}
.road.full{border-color:rgba(255,200,69,.45)}
.rlist{display:flex;flex-direction:column;gap:8px}
.rs{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;border:1px solid var(--edge)}
.rs.ok{opacity:.75}.rs.lock{opacity:.5}
.rs.cur{border-color:#FFC845;background:rgba(255,200,69,.08)}
.rn{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;background:rgba(255,255,255,.08)}
.rs.ok .rn{background:#46E0A0;color:#0A0F24}.rs.cur .rn{background:#FFC845;color:#0A0F24}
.rbar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);margin:8px 0 4px;overflow:hidden}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,#FFC845,#46E0A0);border-radius:99px}
.rnext{margin-top:6px;font-size:.9rem;padding:8px 10px;border-radius:10px;background:rgba(83,168,255,.12)}
.roadban{width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border-color:rgba(255,200,69,.6)!important}
.roadline{padding:6px 10px;border-radius:10px;background:rgba(255,200,69,.1)}
/* v21 */
.xhero{background:linear-gradient(155deg,rgba(70,224,160,.22),var(--panel) 60%)}
/* v22 */
.bossgame{border-color:color-mix(in srgb,var(--bc) 60%,transparent)}
.bghead{gap:12px;align-items:center}
.bgface{width:56px;height:56px;flex:none}
.bgface svg{width:100%;height:100%}
.bgscore{display:flex;justify-content:space-between;margin:10px 2px 6px;font-size:.95rem}
.bgscore b{font-size:1.2rem;color:var(--gold)}
#bgc{display:block;margin:0 auto;border-radius:14px;touch-action:none;border:1px solid var(--edge)}
#bgend{margin-top:10px}
.bgres{text-align:center;padding:10px;border-radius:12px;background:var(--panel);margin-bottom:8px;display:flex;flex-direction:column;gap:2px}
.bgres.win{background:rgba(70,224,160,.15);border:1px solid #46E0A0}
.bgres span{color:var(--gold);font-weight:700}
/* v23 */
.qtop{flex-wrap:wrap;row-gap:6px}
.qvis,.sseries,.series{max-width:100%}
.sseries,.series{overflow-x:auto;scrollbar-width:none}
/* step-by-step calculation inside a solution */
.calc{display:block;margin:8px 0 4px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-variant-numeric:tabular-nums;line-height:1.75}
.calc>span{display:block}
.calc b{color:var(--gold);font-weight:700}
.calc.diffs{background:rgba(143,227,255,.08)}
/* correct-answer celebration */
.yay{position:relative;z-index:1}
.yay-a{animation:yayPop .55s cubic-bezier(.2,1.6,.4,1)}
.yay-b{animation:yayJump .6s cubic-bezier(.2,1.5,.4,1)}
.yay-c{animation:yayWiggle .6s ease}
.opt.yay{box-shadow:0 0 0 2px var(--good),0 0 26px rgba(70,224,160,.45)}
.opt.yay .lt{animation:yayLt .6s ease}
@keyframes yayPop{0%{transform:scale(.96)}45%{transform:scale(1.06)}100%{transform:none}}
@keyframes yayJump{0%{transform:none}35%{transform:translateY(-8px) scale(1.03)}65%{transform:translateY(2px)}100%{transform:none}}
@keyframes yayWiggle{20%{transform:rotate(-2deg) scale(1.04)}40%{transform:rotate(2deg) scale(1.04)}60%{transform:rotate(-1deg)}100%{transform:none}}
@keyframes yayLt{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-12deg)}100%{transform:none}}
.yay-ring{position:fixed;border-radius:16px;border:3px solid var(--good);pointer-events:none;z-index:60;animation:yayRing .8s ease-out forwards}
.yay-ring.big{border-color:var(--gold)}
@keyframes yayRing{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.25,1.6)}}
.yay-sticker{position:fixed;z-index:61;pointer-events:none;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--good);color:#06281C;font-family:var(--f-display);font-size:1.05rem;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:yaySt 1.25s cubic-bezier(.2,1.4,.4,1) forwards}
.yay-sticker .ys-ic svg{width:22px;height:22px;display:block}
.yay-sticker.k-combo,.yay-sticker.k-hard,.yay-sticker.k-champ{background:linear-gradient(120deg,#FFC845,#FF9F43);color:#3A2400}
.yay-sticker.k-fix{background:#8FE3FF;color:#06233A}
@keyframes yaySt{0%{opacity:0;transform:scale(.3) rotate(-14deg)}25%{opacity:1;transform:scale(1.12) rotate(4deg)}45%{transform:scale(1) rotate(0)}80%{opacity:1;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-34px)}}
.typed-res.ok.yay{box-shadow:0 0 0 2px var(--good),0 0 26px rgba(70,224,160,.45)}
/* question bug report */
.qbug{display:block;margin:10px 0 0 auto;background:none;border:0;color:var(--muted,#9AA3C7);font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer;padding:4px 0}
.qbug.done{text-decoration:none;cursor:default}
.bugsheet{max-width:440px}
.bugwhy{display:flex;flex-wrap:wrap;gap:8px}
.bugwhy .chip.on{background:var(--acc);color:var(--bg0);border-color:var(--acc)}
.bugitem summary{cursor:pointer;line-height:1.5}
/* reading: the sentence that proves the answer, marked after answering */
mark.ev{background:rgba(255,200,69,.45);color:inherit;border-radius:4px;padding:0 2px;box-shadow:0 0 0 2px rgba(255,200,69,.45)}
/* teaching what was not taught well enough */
.learnnote{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(169,139,255,.14);border:1px solid rgba(169,139,255,.45);font-size:.9rem;line-height:1.5}
.learnnote svg{width:20px;height:20px;flex:none;color:var(--violet);margin-top:2px}
.learncard{border-color:rgba(169,139,255,.55);background:linear-gradient(155deg,rgba(169,139,255,.24),var(--panel) 65%)}
.learncard h3{font-size:1.5rem;margin:4px 0 6px}
.learncard p{margin:0 0 12px;color:var(--ink)}
.fb.demo{background:rgba(83,168,255,.1);border-color:rgba(83,168,255,.45)}
.fb.demo .fbi{background:var(--water);color:var(--bg0)}
.banner.learnok{background:linear-gradient(120deg,rgba(70,224,160,.2),rgba(255,200,69,.14));border-color:rgba(70,224,160,.5)}

/* ---------- code (צפנים) solutions: rule, steps, symbols, ◆, week strip, clock ---------- */
.cx-rule{display:block;margin:2px 0 8px;padding:7px 10px;border-radius:10px;background:var(--acc-soft);border-inline-start:3px solid var(--acc);color:var(--ink);line-height:1.45}
.cx-rule b{color:var(--acc)}
.cx-ans{display:block;margin:8px 0 2px;font-weight:700;color:var(--gold)}
.cx-check{display:block;margin:6px 0 0;font-size:.86rem;color:var(--muted)}
.cx-math{display:block;margin:6px 0;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.05);text-align:center;font-variant-numeric:tabular-nums;line-height:1.8}
.cx-math>span{display:block}
.cx-math b,.cx-steps b{color:var(--gold);font-weight:700}
/* numbered steps */
.cx-steps{display:block;margin:6px 0}
.cx-step{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;margin:0 0 5px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--edge)}
.cx-n{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--acc);color:var(--on-acc)}
.cx-body{display:block;flex:1;min-width:0}
.cx-l{display:block;font-variant-numeric:tabular-nums;line-height:1.7}
.cx-note{display:block;font-size:.8rem;color:var(--muted);line-height:1.35}
.cx-old{color:var(--muted);text-decoration:none;opacity:.85}
/* symbols: one color per symbol; a number that replaced a symbol sits in a chip of that color */
.cx-s1{color:var(--acc)}.cx-s2{color:var(--gold)}.cx-s3{color:var(--violet,#A98BFF)}
.cx-old .cx-s1,.cx-old .cx-s2,.cx-old .cx-s3{opacity:.9}
.cx-v{display:inline-block;min-width:1.5em;padding:0 5px;border-radius:7px;font-weight:700;text-align:center;line-height:1.45}
.cx-v1{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cx-v2{background:rgba(255,200,69,.18);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cx-v3{background:rgba(169,139,255,.2);color:var(--violet,#A98BFF);box-shadow:inset 0 0 0 1px var(--violet,#A98BFF)}
/* ◆: a in the accent color, b in gold, in the definition and in every substitution */
.cx-def{display:block;margin:4px 0;padding:6px 10px;text-align:center;font-size:1.08rem;font-weight:600;border:1px dashed var(--edge2);border-radius:10px}
.cx-a{color:var(--acc);font-weight:700}.cx-b{color:var(--gold);font-weight:700}
.cx-who{display:block;text-align:center;margin:4px 0 0}
.cx-who .ltr{margin:0 6px}
/* week strip: 7 day chips, right to left */
.cal-wk{display:block;margin:4px 0}
.cal-loop{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--panel2);color:var(--acc);font-weight:700}
.cal-strip{display:flex;gap:3px;margin:8px 0 4px}
.cal-d{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;padding:4px 1px;border-radius:9px;background:var(--panel);border:1px solid var(--edge);font-size:.7rem;line-height:1.3}
.cal-d i{font-style:normal;font-size:.66rem;color:var(--muted);min-height:1.2em;white-space:nowrap}
.cal-d b{font-weight:700;white-space:nowrap}
.cal-d.st{border-color:var(--acc);background:var(--acc-soft)}
.cal-d.jp{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.cal-d.jp i{color:var(--acc)}
.cal-d.ans{border-color:var(--gold);background:rgba(255,200,69,.2);box-shadow:0 0 10px rgba(255,200,69,.35)}
.cal-d.ans b,.cal-d.ans i{color:var(--gold)}
.cal-d.off{opacity:.45}
/* clock face */
.ck-wrap{display:flex;align-items:center;gap:10px;margin:6px 0}
.ck{flex:none;width:140px;height:140px}
.ck-rim{fill:rgba(255,255,255,.04);stroke:var(--edge2);stroke-width:2}
.ck-tk{stroke:var(--muted);stroke-width:2}
.ck-num{fill:var(--muted);font-size:10px;font-family:inherit}
.ck-wedge{fill:rgba(70,224,160,.28);stroke:var(--good);stroke-width:1.5}
.ck-ghost{stroke:var(--muted);stroke-width:2;stroke-dasharray:3 3;opacity:.8}
.ck-h{stroke:var(--gold);stroke-width:5;stroke-linecap:round}
.ck-m{stroke:var(--acc);stroke-width:3;stroke-linecap:round}
.ck-pin{fill:var(--ink)}
.ck-key{display:block;flex:1;min-width:0;font-size:.82rem;line-height:1.4}
.ck-k{display:block;margin:0 0 4px;padding-inline-start:14px;position:relative}
.ck-k::before{content:"";position:absolute;inset-inline-start:0;top:.45em;width:9px;height:9px;border-radius:3px}
.ck-km::before{background:var(--acc)}.ck-kh::before{background:var(--gold)}
.ck-kg{color:var(--muted)}.ck-kg::before{border:2px dashed var(--muted);width:5px;height:5px}
.ck-ka::before{background:var(--good)}
.ck-ka b{color:var(--gold)}

/* ---- school geometry drawings (10-content/geometry.js) and the geometry screen (70-ui/geo.js) ----
   Colours carry meaning and do not follow the world accent (a skin can make the accent gold or white):
   shape = ink outline on a blue tint, given angle = blue arc, what we look for = gold (pill or x),
   height = violet dashed line, found on the way = green, the answer in a solution = gold. */
.gsv{--g-ink:var(--ink);--g-fill:color-mix(in srgb,var(--water) 17%,transparent);--g-given:var(--water);--g-ask:var(--gold);--g-ht:var(--violet);--g-ok:var(--good);--g-halo:var(--bg0);
  direction:ltr;display:block;width:100%;height:auto;margin:8px auto 4px;overflow:visible;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.gsv text{fill:var(--g-ink);font-weight:600;paint-order:stroke fill;stroke:var(--g-halo);stroke-width:4px;stroke-linejoin:round}
.gsv .gk{stroke:var(--g-ink);stroke-width:2.2;fill:none;stroke-linecap:round}
.gsv .gk2{stroke:var(--g-ink);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-opacity:.85}
.gsv .gsh{fill:var(--g-fill);stroke:var(--g-ink);stroke-width:2.2;stroke-linejoin:round}
.gsv .gsh0{fill:none}
.gsv .gper{stroke:var(--g-ask);stroke-width:4}
.gsv .gdot{fill:var(--g-ink)}
.gsv .gref{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
.gsv .gtk{stroke:var(--g-ink);stroke-width:2}
/* angles */
.gsv .gak{stroke:var(--g-given);stroke-width:2.2;fill:none}
.gsv .gax{stroke:var(--g-ask);stroke-width:3;fill:none}
.gsv .gas{stroke:var(--g-ask);stroke-width:2.6;fill:none}
.gsv .gasf{fill:color-mix(in srgb,var(--g-ask) 30%,transparent)}
.gsv .gag{stroke:var(--g-ok);stroke-width:2.4;fill:none}
.gsv .gagf{fill:color-mix(in srgb,var(--g-ok) 24%,transparent)}
.gsv .gan{stroke:var(--muted);stroke-width:1.5;fill:none}
.gsv .gra{stroke:var(--g-ink);stroke-width:1.6;fill:none}
.gsv .grah{stroke:var(--g-ht);stroke-width:1.6;fill:none}
/* labels */
.gsv text.gtx{fill:var(--g-ask);font-weight:800}
.gsv text.gts{fill:var(--g-ask);font-weight:800}
.gsv text.gtg{fill:var(--g-ok);font-weight:700}
.gsv text.gtv{fill:var(--g-ht);font-weight:700}
.gsv text.gtm{fill:var(--muted);font-weight:500}
.gsv text.gtb{font-weight:800}
.gsv .gqp{fill:var(--g-ask)}
.gsv text.gqt{fill:#2E2100;stroke:none;font-weight:800}
/* area */
.gsv .ght{stroke:var(--g-ht);stroke-width:2.2;stroke-dasharray:6 4;fill:none}
.gsv .ghtb{stroke-width:3.4}
.gsv .gbase{stroke:var(--g-ask);stroke-width:4;stroke-linecap:round}
.gsv .gext{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 4}
.gsv .ggr{stroke:var(--g-ink);stroke-opacity:.4;stroke-width:1}
.gsv .grect{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 4}
.gsv .gcut{fill:color-mix(in srgb,var(--muted) 10%,transparent);stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 4}
.gsv .gmove{fill:color-mix(in srgb,var(--g-ok) 26%,transparent);stroke:var(--g-ok);stroke-width:1.6;stroke-dasharray:4 3}
.gsv .gpa{fill:color-mix(in srgb,var(--water) 28%,transparent)}
.gsv .gpb{fill:color-mix(in srgb,var(--violet) 32%,transparent)}
.gsv .gsplit{stroke:var(--g-ok);stroke-width:2.2;stroke-dasharray:6 4}
.gsv .glawn{fill:color-mix(in srgb,var(--good) 18%,transparent)}
.gsv .ghole{fill:var(--bg0);stroke:var(--g-ink);stroke-width:1.8;stroke-dasharray:5 3}
.gsv .gpool{fill:color-mix(in srgb,var(--water) 45%,transparent);stroke:var(--g-ink);stroke-width:1.8}
.gsv .gholex{fill:var(--bg0);stroke:var(--bad);stroke-dasharray:5 3}
/* circle */
.gsv .gcir{fill:var(--g-fill);stroke:var(--g-ink);stroke-width:2.2}
.gsv .gfil{fill:color-mix(in srgb,var(--g-ask) 26%,transparent)}
.gsv .gdia,.gsv .grad{stroke:var(--g-ink);stroke-width:2}
.gsv .grad2{stroke:var(--g-ink);stroke-width:2;stroke-dasharray:5 3}
.gsv .ghl2{stroke:var(--g-ok);stroke-width:3.4}
.gsv .garcp{fill:none;stroke:var(--g-ok);stroke-width:4}
.gsv .gring{fill:color-mix(in srgb,var(--water) 40%,transparent);stroke:var(--g-ink);stroke-width:2.2}
.gsv .gringx{fill:color-mix(in srgb,var(--g-ask) 30%,transparent)}
/* solids */
.gsv .gbf{fill:color-mix(in srgb,var(--water) 22%,transparent)}
.gsv .gbt{fill:color-mix(in srgb,var(--water) 34%,transparent)}
.gsv .gbs{fill:color-mix(in srgb,var(--water) 11%,transparent)}
.gsv .gbo{fill:none;stroke:var(--g-ink);stroke-width:2.1;stroke-linejoin:round}
.gsv .ghid{stroke:var(--g-ink);stroke-opacity:.55;stroke-width:1.5;stroke-dasharray:5 4}
.gsv .ghl{fill:color-mix(in srgb,var(--g-ask) 38%,transparent)}
.gsv .ghle{stroke:var(--g-ask);stroke-width:2}
.gsv .gone{fill:color-mix(in srgb,var(--g-ask) 45%,transparent);stroke:var(--g-ask);stroke-width:1.4}
.gsv .gpf{fill:color-mix(in srgb,var(--violet) 32%,transparent)}
.gsv .gpt{fill:color-mix(in srgb,var(--water) 36%,transparent)}
.gsv .gps{fill:color-mix(in srgb,var(--good) 26%,transparent)}
.gsv .gdotv{fill:var(--g-ask)}
.gsv .gdoth{fill:none;stroke:var(--g-ask);stroke-width:2}
/* nets */
.gsv .gnf{fill:color-mix(in srgb,var(--water) 20%,transparent);stroke:var(--g-ink);stroke-width:1.8}
.gsv .gna{fill:color-mix(in srgb,var(--water) 38%,transparent)}
.gsv .gnb{fill:color-mix(in srgb,var(--violet) 38%,transparent)}
.gsv .gnc{fill:color-mix(in srgb,var(--good) 30%,transparent)}
.gsv .gfold{stroke:var(--g-ink);stroke-width:1.2;stroke-dasharray:3 3;stroke-opacity:.7}
.gsv.gcells{margin:2px auto}
.gsv.gcells text{stroke-width:3px}
.opts.grid:has(.gcells){grid-template-columns:1fr 1fr}
.opts.grid .opt .gsv.gcells{width:100%;max-width:104px}
.solx .gsv.gcells,.sol .gsv.gcells{width:auto;max-width:150px}
/* in a solution the drawing sits between the method line and the calculation */
.solx .gsv,.sol .gsv,.gstep .gsv{margin:8px auto 6px}
.mleg i.k{background:var(--violet);border-color:var(--violet)}

/* ---- the geometry screen ---- */
.geo-top{display:flex;align-items:center;gap:10px}
.geo-top .icon-btn{flex:none}
.geo-top h2{font-size:1.5rem;line-height:1.1}
.geo-top p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.geo-lv{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.geo-lv .chip{padding:6px 10px;font-size:.82rem}
.geo-lv .chip.on{background:var(--water);border-color:var(--water);color:var(--bg0);font-weight:700}
.geo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.geo-t{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 20%,transparent),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--tc) 40%,var(--edge))}
.geo-t .gti{display:flex;align-items:center;gap:8px}
.geo-t .gti svg{flex:none;width:38px;height:38px;color:var(--tc)}
.geo-t h4{font-size:1.08rem;line-height:1.15}
.geo-t .gtd{margin:0;font-size:.76rem;color:var(--muted);line-height:1.35}
.geo-t .gres{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);min-height:18px}
.geo-dots{display:inline-flex;gap:3px}
.geo-dots i{width:9px;height:9px;border-radius:50%;background:var(--edge2)}
.geo-dots i.o{background:var(--good)}
.geo-dots i.x,.geo-dots i.g,.geo-dots i.s{background:var(--bad)}
.geo-t .row{gap:6px;margin-top:auto}
.geo-t .btn{min-height:42px;padding:8px 10px;font-size:.95rem;border-radius:13px}
.geo-t .btn-primary{flex:1.4}
.geo-t .btn-ghost{flex:1}
.geo-mix{display:flex;align-items:center;gap:12px}
.geo-mix .grow p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.geo-log{display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.geo-log div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--edge);padding-top:4px}
.geo-log div:first-child{border-top:0;padding-top:0}
.geo-log b{font-variant-numeric:tabular-nums}

/* logic explanations: order ladder, seat row, Euler circles, team boxes (all inside <p class="solx">, so spans only) */
.lg-cap{display:block;text-align:center;font-size:.78rem;color:var(--muted);margin:2px 0 6px}
/* order: a ladder from most to least */
.lg-lad{display:flex;flex-direction:column;align-items:center;gap:5px;margin:8px auto 8px;padding:2px 0;background:linear-gradient(var(--edge2),var(--edge2)) center/2px 100% no-repeat}
.lg-end{font-size:.76rem;color:var(--muted);background:var(--bg1);padding:0 8px;border-radius:99px}
.lg-rung{display:flex;align-items:center;gap:8px;min-width:150px;padding:4px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--edge2);font-weight:600}
.lg-rung i,.lg-seat i{font-style:normal;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lg-rung.on,.lg-seat.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
/* seating: seat 1 is the first span, so it sits on the right in RTL */
.lg-seats{display:flex;justify-content:center;gap:5px;margin:10px 0 0}
